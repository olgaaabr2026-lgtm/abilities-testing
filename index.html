<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр тестов способностей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark instrument header band over a cool "test-booklet" paper; one centred working column; progress drawn as a segmented log track. Single light theme by request. */
:root{
  --paper:#F1F4F6; --surface:#FFFFFF; --ink:#15212B; --ink-2:#2B3A47; --muted:#5A6874; --line:#D5DDE3; --line-2:#E6EBEF;
  --accent:#E0552A; --accent-ink:#B5401B; --accent-soft:#FCEBE4;
  --steel:#245B7E; --steel-soft:#E4EEF5;
  --ok:#1D7A4F; --ok-soft:#E2F2E9; --bad:#BC3434; --bad-soft:#FAE6E5; --warn:#A86A12;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--steel);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--ink);color:#E8EEF2;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 34px)}
.band .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;display:block;line-height:1.2}
.brand span{font-size:12px;color:#9FB0BD;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;color:#B8C6D0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-current="true"]{color:#fff;background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid #3A4B59;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#B8C6D0;padding:6px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:34px 18px}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.hero-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero-fig .series{justify-content:center}
.hero-fig .series .fig{width:min(64px,15%)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.provs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.prov{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:var(--surface)}

/* settings */
.section{padding-block:12px 40px}
.settings{display:flex;gap:18px 28px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.settings .hint{font-size:13px;color:var(--muted);flex:1 1 220px;min-width:0}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.mod-art{height:112px;background:linear-gradient(180deg,#F7F9FA,#EEF2F5);border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;padding:12px}
.mod-art svg{height:100%;width:auto;max-width:100%}
.mod-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0;letter-spacing:.005em}
.mod p{margin:0;color:var(--ink-2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--steel);font-weight:500}
.mod-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.mod-stat{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-primary:disabled{background:#E7B9A8;cursor:not-allowed}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:7px 12px;font-size:13.5px}

/* exam list */
.note-box{background:var(--steel-soft);border:1px solid #C9DCE9;border-radius:var(--r);padding:12px 14px;font-size:14px;color:#1C4561;margin-bottom:18px}
.prov-group{margin-bottom:22px}
.prov-group h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.prov-group>p{margin:0 0 10px;color:var(--muted);font-size:14px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.row-main{flex:1 1 260px;min-width:0}
.row-main b{display:block;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2)}
.tag.hot{background:var(--accent-soft);border-color:#F3C9B8;color:var(--accent-ink)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.sbar-title{font-weight:600;font-size:14px;min-width:0;flex:1 1 180px}
.sbar-title small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.warn{color:#fff;background:var(--accent);border-color:var(--accent)}
.timer small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.timer.warn small{color:#FFE3D8}
.track{display:flex;gap:3px;flex:2 1 260px;min-width:0;align-items:center}
.track i{flex:1;height:8px;border-radius:2px;background:var(--line-2);display:block;min-width:3px}
.track i.on{background:var(--ink)}
.track i.ok{background:var(--ok)}
.track i.bad{background:var(--bad)}
.track i.cur{background:var(--accent);height:12px}
.qwrap{max-width:900px;margin:0 auto;padding-block:22px 60px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-family:var(--mono);font-size:13px;color:var(--muted)}
.qtype{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);background:var(--steel-soft);padding:3px 9px;border-radius:6px}
.lvl{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted)}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--ink-2)}
.prompt{font-size:18px;font-weight:600;margin:4px 0 16px;text-wrap:balance;line-height:1.4}
.visual{margin-bottom:18px}
.series{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.series .fig{width:min(88px,15.2%);height:auto;flex:none}
.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,104px));gap:6px;justify-content:center;background:var(--paper);padding:10px;border-radius:12px;width:max-content;max-width:100%;margin:0 auto}
.matrix .fig{width:100%;height:auto;display:block}
.fig{display:block}
.opts{display:grid;gap:10px}
.opts.figs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.opts.txt{grid-template-columns:1fr}
.opts.short{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;position:relative;transition:border-color .12s, background-color .12s}
.opt:hover:not(:disabled){border-color:#9FB2C1;background:#FAFCFD}
.opt .ol{font-family:var(--mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt .ot{min-width:0;padding-top:1px}
.opts.figs .opt{flex-direction:column;align-items:center;padding:8px}
.opts.figs .opt .fig{width:100%;max-width:132px;height:auto}
.opt.multi .ol{border-radius:5px}
.opt.sel{border-color:var(--steel);background:var(--steel-soft)}
.opt.sel .ol{background:var(--steel);color:#fff;border-color:var(--steel)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ol{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qact{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--sbarH, 60px));z-index:4;background:var(--surface);margin:14px -22px 0;padding:10px 22px}
.qact.rev{border-bottom:1px solid var(--line-2);box-shadow:0 6px 10px -10px rgba(21,33,43,.35)}
.actions .spacer{flex:1}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.passage{background:#FAFBFC;border:1px solid var(--line-2);border-left:3px solid var(--ink);border-radius:8px;padding:14px 16px}
.passage h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.passage p{margin:0;max-width:72ch}
.statement{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--steel-soft);font-weight:600;color:#14384F}
.statement .lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--steel);margin-bottom:2px}
.logic p{margin:0 0 8px}
.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.clues li{padding-left:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px}
.dt{border-collapse:collapse;width:100%;font-size:14px}
.dt caption{caption-side:top;text-align:left;font-weight:600;padding:10px 12px 8px;font-size:13.5px}
.dt th,.dt td{padding:7px 12px;border-top:1px solid var(--line-2);white-space:nowrap}
.dt thead th{background:var(--paper);font-weight:600;font-size:12.5px;color:var(--ink-2);text-align:left}
.dt .r{text-align:right}
.dt tbody th{text-align:left;font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.cap{font-weight:600;font-size:13.5px;margin:0 0 6px}
.chart-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px;padding:6px 4px 0;background:#fff}
.chart{width:100%;min-width:480px;height:auto;display:block}

/* feedback */
.fb{margin-top:18px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.fb-head{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.fb.good .fb-head{background:var(--ok-soft)}
.fb.wrong .fb-head{background:var(--bad-soft)}
.verdict{font-family:var(--display);font-weight:600;font-size:16px}
.fb.good .verdict{color:var(--ok)}
.fb.wrong .verdict{color:var(--bad)}
.fb-head .ans{font-size:14px;color:var(--ink-2)}
.fb-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.fb-body h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rules{margin:4px 0 0;padding-left:20px}
.rules li+li{margin-top:3px}
.calc{font-family:var(--mono);font-size:14px;background:var(--paper);padding:8px 10px;border-radius:7px;margin:4px 0 0;overflow-x:auto}
.sol-order{margin:4px 0 0;padding-left:24px;display:flex;flex-wrap:wrap;gap:4px 26px}
.notes{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.notes li{display:flex;gap:10px;font-size:14px;padding:5px 8px;border-radius:7px}
.notes li b{font-family:var(--mono);flex:none;width:18px}
.notes li.mine{background:var(--bad-soft)}
.notes li.right{background:var(--ok-soft)}
.tip{font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;color:#5E2510}
.tip b{color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(21,33,43,.25)}

/* results */
.res-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;margin-bottom:18px}
.score{background:var(--ink);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden}
.score .big{font-family:var(--display);font-weight:600;font-size:56px;line-height:1;margin:10px 0 6px;letter-spacing:-.02em}
.score .big small{font-size:22px;color:#9FB0BD}
.score .band-lbl{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:var(--accent);font-size:13px;font-weight:600}
.score .eyebrow{color:#9FB0BD}
.score p{margin:10px 0 0;color:#C9D4DC;font-size:13px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kv h3,.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar-row.wbtn{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto}
.bar-row .lb{min-width:0;overflow-wrap:break-word;hyphens:auto}
.bar-row .meter{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-row .meter i{display:block;height:100%;border-radius:4px;background:var(--steel)}
.bar-row .meter i.lo{background:var(--bad)}
.bar-row .meter i.mid{background:var(--warn)}
.bar-row .meter i.hi{background:var(--ok)}
.bar-row .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink-2);white-space:nowrap;min-width:44px}
.rv-empty{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:14px}
.qcard:focus{outline:none}
.qwrap{scroll-margin-top:96px}
.facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.review summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px}
.review summary::-webkit-details-marker{display:none}
.review summary .mk{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.mk.y{background:var(--ok)} .mk.n{background:var(--bad)} .mk.s{background:#9AA7B2}
.review summary .st{min-width:0;flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review summary .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.review .rv{padding:0 14px 16px;border-top:1px solid var(--line-2)}
.review .rv .qcard{border:0;padding:14px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:8px 6px;border-top:1px solid var(--line-2);text-align:left;white-space:nowrap}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist .r{text-align:right;font-family:var(--mono)}
.guide h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 8px}
.guide ul,.guide ol{margin:6px 0 0;padding-left:22px;max-width:80ch}
.guide li+li{margin-top:6px}
.guide li::marker{color:var(--accent);font-weight:600}
.guide .src{font-size:13px;color:var(--muted)}
.guide a{color:var(--steel)}
.sum-tip{font-size:14px;color:var(--ink-2)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-block:22px 10px}
  .mods,.grid2,.res-top{grid-template-columns:1fr}
  .qcard{padding:16px 14px 18px}
  .qact{margin:12px -14px 0;padding:10px 14px}
  .qact .kbd{display:none}
  .prompt{font-size:16.5px}
  .opts.figs{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .sbar .wrap{gap:8px 10px;padding-block:8px}
  .sbar-title{font-size:13px;flex:1 1 0}
  .sbar-title small{display:none}
  .timer{min-width:70px;font-size:16px;padding:3px 8px}
  .track{order:3;flex-basis:100%}
}
@media (max-width:520px){

  P('ru', 'Инвестиционный комитет', 'В компании «Полярная нефть» каждый проект стоимостью свыше 50 млн долларов проходит через инвестиционный комитет. Комитет одобряет проект, если его внутренняя норма доходности (IRR) в базовом сценарии превышает 15% и проект остаётся безубыточным при цене нефти 45 долларов за баррель. В 2025 году комитет рассмотрел 14 проектов, одобрил 9 из них, остальные отклонил. Два из отклонённых проектов превысили порог по IRR, но не выдержали стресс-теста по цене. Проекты стоимостью до 50 млн долларов финансовый директор утверждает единолично.', [

  P('ru', 'Попутный газ', 'По итогам 2025 года уровень полезного использования попутного нефтяного газа (ПНГ) на месторождениях «Восток-Нефти» составил 93% против 88% годом ранее. Рост обеспечен вводом газотурбинной электростанции на Кедровом месторождении, которая покрывает его собственные потребности в электроэнергии. На двух удалённых месторождениях газ по-прежнему частично сжигается на факелах, поскольку строительство газопровода туда признано нерентабельным. Компания рассматривает закачку газа в пласт как альтернативу, но окончательное решение пока не принято.', [

  P('ru', 'Проект СПГ', 'Проект «Белый Мыс» по производству сжиженного природного газа мощностью 6 млн тонн в год законтрактовал 80% проектной мощности по долгосрочным договорам сроком 15 лет. Цены в этих договорах привязаны к нефтяной корзине с задержкой в шесть месяцев. Оставшиеся 20% планируется продавать на спотовом рынке. Банки-кредиторы потребовали, чтобы доля законтрактованного объёма составляла не менее 75%, иначе финансирование не будет предоставлено.', [

  P('ru', 'Автономные самосвалы', 'Горнодобывающая компания «Уральская медь» с 2023 года испытывает автономные самосвалы на карьере «Южный». За два года пилот охватил 12 машин из 70 в парке карьера. Производительность автономных самосвалов оказалась на 9% выше, чем у машин с водителем, за счёт отсутствия пересменок. При этом затраты на техническое обслуживание выросли из-за сложного сенсорного оборудования. Руководство заявило, что решение о полном переводе парка будет принято, когда срок окупаемости модернизации станет меньше четырёх лет.', [

  P('ru', 'Мониторинг бурения', 'Внедрение системы удалённого мониторинга бурения позволило «Таёжной буровой компании» сократить среднюю продолжительность строительства скважины с 24 до 19 суток. Наибольший эффект достигнут на горизонтальных скважинах, где сократилось число аварий с прихватом инструмента. Центр мониторинга работает круглосуточно и одновременно сопровождает до 30 буровых установок. Стоимость внедрения системы компания не раскрывает.', [

  PA('ru', 'idea', 'Критерии отбора проектов', 'Ещё десять лет назад нефтегазовые компании оценивали проекты прежде всего по объёму запасов. Сегодня на первый план вышли скорость возврата капитала и устойчивость к низким ценам: инвесторы готовы мириться с меньшим ростом добычи, если компания стабильно выплачивает дивиденды. Поэтому крупные проекты с длинным инвестиционным циклом всё чаще уступают место коротким проектам на уже освоенных месторождениях, даже если их суммарный ресурсный потенциал ниже.', [

  PA('ru', 'contra', 'Нефтепровод «Восточный луч»', 'Проект строительства нефтепровода «Восточный луч» разделён на три очереди. Первая очередь длиной 240 км введена в эксплуатацию в 2024 году, вторая строится, а проектирование третьей ещё не завершено. Пропускная способность после ввода всех очередей составит 30 млн тонн в год, сейчас — 12 млн тонн. Финансирование второй очереди полностью обеспечено собственными средствами компании.', [

  PA('ru', 'idea', 'Цифровизация и люди', 'Цифровые решения в добыче часто не дают ожидаемого эффекта не из-за технологий, а из-за людей. Система может точно предсказать отказ насоса, но если у мастера нет полномочий остановить скважину без согласования, рекомендация так и остаётся на экране. Компании, которые одновременно с внедрением ИТ-систем меняют регламенты и распределение ответственности, получают эффект в два-три раза выше.', [

  PA('ru', 'contra', 'Стоимость скважин', 'По данным отраслевого обзора, в 2025 году средняя стоимость строительства горизонтальной скважины в регионе выросла на 12% и составила 280 млн рублей. Основной причиной названо удорожание импортных комплектующих для многостадийного гидроразрыва пласта. При этом стоимость собственно буровых работ, по оценке авторов обзора, выросла лишь на 4%.', [

  PA('ru', 'idea', 'Регионы и инвесторы', 'Добывающие регионы долго соревновались за инвестиции налоговыми льготами. Однако опросы компаний показывают, что при выборе площадки льготы стоят лишь на четвёртом месте — после наличия инфраструктуры, доступности квалифицированного персонала и предсказуемости правил. Регион, который меняет условия каждые два года, проигрывает даже при более щедрых льготах.', [

          ['Округляйте только в конце, промежуточные значения держите с 3–4 знаками.', 'Round only at the end; keep 3–4 digits in interim values.'],

    ded: {
      intro: T('Всё, что нужно, есть в условии. Задача не догадаться, а строго вывести ответ.', 'Everything you need is in the conditions. The task is not to guess but to derive the answer strictly.'),
      blocks: [

          ['Начните с жёстких условий: точное место, «сразу после», «в одной комнате».', 'Start with the tight conditions: exact place, “immediately after”, “in the same room”.'],
          ['Склейте связанные элементы в блоки (А сразу после Б → «БА») и двигайте блоками.', 'Glue linked items into blocks (A right after B → “BA”) and move the blocks.'],
          ['Условия с «не», «раньше», «позже» применяйте последними — они отсекают оставшиеся варианты.', 'Apply “not”, “before” and “after” last — they eliminate the remaining options.'],
          ['Часто для ответа не нужно решать всё: спрашиваемое место определяется раньше полной расстановки.', 'Often you do not need the full solution: the asked position is fixed before everything else.'],
          ['В интерактивных заданиях SHL (составить расписание, распределить комнаты) перечитывайте условия после каждого размещения: одно пропущенное «не» ломает решение.', 'In SHL interactive tasks (build a schedule, assign rooms) re-read the conditions after each placement: one missed “not” breaks the solution.'],
          ['Внимательно читайте вопрос: «обязательно верно» — в любой допустимой расстановке, «может быть верно» — хотя бы в одной, «не может быть верно» — ни в одной. Для «может» достаточно одной расстановки, для «обязательно» ищите контрпример.', 'Read the question stem: “must be true” holds in every valid arrangement, “could be true” in at least one, “cannot be true” in none. For “could”, one valid arrangement is enough; for “must”, look for a counter-arrangement.']
        ]],
        ['Логические выводы', 'Logical conclusions', [
          ['Рисуйте круги Эйлера. «Все A — B»: круг A внутри B. «Ни один A не B»: круги не пересекаются. «Некоторые A — B»: есть хотя бы одна общая точка.', 'Draw Euler circles. “All A are B”: A inside B. “No A is B”: circles apart. “Some A are B”: at least one shared point.'],
          ['«Некоторые» значит «хотя бы один, возможно все».', '“Some” means “at least one, possibly all”.'],
          ['«Все A — B» не означает «все B — A», но из него следует «некоторые B — A», если группа A непуста (в тренажёре это сказано в условии, в тестах обычно так же). «Некоторые A — B» равносильно «некоторые B — A», «ни один A не B» — «ни один B не A».', '“All A are B” does not mean “all B are A”, but it does give “some B are A”, provided group A is non-empty (the trainer states this; tests usually assume it). “Some A are B” equals “some B are A”, and “no A is B” equals “no B is A”.'],
          ['«Некоторые A не B» переворачивать нельзя.', '“Some A are not B” cannot be reversed.'],
          ['Отрицание «все A — B» — «некоторые A не B», а не «ни один A не B». Отрицание «некоторые A — B» — «ни один A не B».', 'The negation of “all A are B” is “some A are not B”, not “no A is B”. The negation of “some A are B” is “no A is B”.'],
          ['Вывод верен, только если его нельзя опровергнуть ни одним рисунком, совместимым с условиями. Нашли контрпример — вывод не обязателен.', 'A conclusion holds only if no drawing consistent with the premises refutes it. Found a counter-example? Then it is not certain.'],
          ['Не используйте знания о реальном мире: если в условии сказано «все месторождения шельфовые», так и считайте.', 'Do not use real-world knowledge: if the premise says all fields are offshore, accept it.'],
          ['Вариант «ни одно не следует» тоже бывает верным. Не бойтесь его выбирать.', '“None of these follows” can be the right answer. Do not be afraid to pick it.']

        ['Правило «если — то»', '“If — then” rules', [

          ['Из «если А, то Б» и «Б» про А ничего не следует. Из «не А» ничего не следует про Б.', 'From “if A then B” and “B”, nothing follows about A. From “not A”, nothing follows about B.'],
          ['«А, только если Б» означает «если А, то Б».', '“A only if B” means “if A then B”.'],
          ['«А, если Б» означает «если Б, то А». «А, если не Б» (<i>A unless B</i>) означает «если не Б, то А».', '“A if B” means “if B then A”. “A unless B” means “if not B then A”.'],
          ['«Если А, то Б» равносильно «если не Б, то не А». Цепочки складываются: из «А → Б» и «Б → В» следует «А → В».', '“If A then B” is the same as “if not B then not A”. Chains combine: from A → B and B → C, A → C follows.']

    verb: {

      blocks: [
        ['«Верно / Неверно / Нельзя сказать»: алгоритм', 'True / False / Cannot say: routine', [

          ['Найдите в тексте место, о котором идёт речь. Перечитывать весь текст не нужно.', 'Find the part of the passage it refers to. No need to re-read everything.'],
          ['Спросите себя: следует ли утверждение из текста — прямо, через перефразирование, простой расчёт или неизбежный вывод (Верно); противоречит ли ему текст — прямо или по тем же правилам (Неверно); или данных не хватает ни для того, ни для другого (Нельзя сказать)?', 'Ask: does the statement follow from the passage — directly, by paraphrase, simple calculation or necessary inference (True); does the passage rule it out, directly or in the same ways (False); or is there not enough information either way (Cannot say)?'],
          ['Сомневаетесь между «Неверно» и «Нельзя сказать» — спросите, может ли утверждение быть верным, если всё в тексте правда. Может — «Нельзя сказать». Не может — «Неверно».', 'Torn between False and Cannot say? Ask whether the statement could be true if everything in the passage is true. If it could — Cannot say. If it could not — False.']

        ['Слова-ловушки', 'Trap words', [
          ['«Все», «только», «всегда», «никогда», «ни один»: одно исключение в тексте делает утверждение неверным.', '“All”, “only”, “always”, “never”, “none”: one exception in the passage makes the statement false.'],
          ['«В основном» не равно «только».', '“Mainly” does not mean “only”.'],
          ['«Планирует», «ожидает», «рассматривает» не равно «сделал». Прогноз — не факт.', '“Plans”, “expects”, “is considering” do not mean “has done”. A forecast is not a fact.'],
          ['«После» не значит «из-за». Совпадение по времени ещё не причина.', '“After” does not mean “because of”. Timing alone is not a cause.'],
          ['«Аналитики считают», «руководство полагает» — это мнение, а не установленный факт. Если в тексте сказано, что руководство ожидает X, то «руководство ожидает X» — «Верно», а «X произойдёт» — «Нельзя сказать».', '“Analysts believe”, “management thinks” — that is an opinion, not an established fact. If the passage says management expects X, “Management expects X” is True; “X will happen” is Cannot say.'],
          ['Следите за сменой охвата: компания и отрасль, один регион и вся страна, «одна из крупнейших» и «крупнейшая», 2025 и 2026 годы.', 'Watch for scope shifts: company vs industry, one region vs the whole country, “one of the largest” vs “the largest”, 2025 vs 2026.'],
          ['Абсолютное утверждение («все», «всегда»), которому в тексте нет ни подтверждения, ни исключения, — обычно «Нельзя сказать», а не «Верно».', 'An absolute claim (“all”, “always”) with neither support nor an exception in the passage is usually Cannot say, not True.'],
          ['Расчёт допустим: если из цифр текста простым счётом выходит ответ, это «Верно» или «Неверно», а не «Нельзя сказать».', 'Calculation is allowed: if simple maths on the passage’s figures gives the answer, it is True or False, not Cannot say.']

        ['Выбор одного или двух утверждений (Korn Ferry)', 'Choosing one or two statements (Korn Ferry)', [

          ['Отмечайте только утверждения, которые следуют из текста — прямо, через перефразирование, расчёт или неизбежный вывод.', 'Select only statements that follow from the passage — directly, by paraphrase, calculation or necessary inference.'],
          ['В вопросе сказано, сколько утверждений выбрать — одно или два. Выберите ровно столько и не больше.', 'The question says how many statements to choose — one or two. Choose exactly that many.'],
          ['Korn Ferry иногда задаёт вопрос в отрицательной форме: «какое утверждение НЕ следует из текста». Перечитайте вопрос перед ответом.', 'Korn Ferry sometimes asks negatively: “which statement does NOT follow”. Re-read the question before answering.']
        ]],
        ['Анализ текста (ЭКОПСИ)', 'Text analysis (Ecopsy)', [
          ['Читайте вопрос до текста — так сразу понятно, что искать: главную мысль, вывод, противоречие или допущение.', 'Read the question before the passage so you know what to look for: main idea, conclusion, contradiction or assumption.'],
          ['<b>Основная мысль</b> охватывает весь текст, а не одну деталь. Отбрасывайте крайности, подмену причины и следствия и то, чего в тексте нет.', '<b>Main idea</b> covers the whole passage, not one detail. Drop extremes, reversed cause and effect, and anything the passage lacks.'],
          ['<b>Вывод</b> должен быть верен при любом раскладе, который допускает текст. Правило «если А, то Б» нельзя переворачивать.', '<b>Conclusion</b> must hold in every situation the passage allows. “If A then B” cannot be reversed.'],
          ['<b>Противоречие</b> — прямой конфликт с фактом текста. Утверждение, о котором данных нет, тексту не противоречит.', '<b>Contradiction</b> is a direct clash with a fact. A statement with no data in the passage does not contradict it.'],
          ['<b>Допущение</b> — то, без чего вывод рушится. Проверка: возьмите отрицание варианта. Если аргумент перестаёт работать, это допущение.', '<b>Assumption</b> is what the argument needs. Test it by negating the option: if the argument collapses, that is the assumption.']
        ]],
        ['Если тест на английском', 'If the test is in English', [
          ['Полезные слова: <i>cannot say</i> — нельзя сказать; <i>respectively</i> — соответственно; <i>at least / at most</i> — не менее / не более; <i>unless</i> — если не; <i>mainly</i> — в основном; <i>rose by / rose to</i> — выросла на / выросла до; <i>no more than</i> — не более; <i>provided that</i> — при условии, что; <i>one of the</i> — один из.', 'Useful words: <i>respectively</i>, <i>at least / at most</i>, <i>unless</i>, <i>mainly</i>, <i>rose by</i> vs <i>rose to</i>, <i>no more than</i>, <i>provided that</i>, <i>one of the</i> — read them literally.'],
          ['Не переводите весь текст в голове: ищите в нём ключевые слова утверждения.', 'Do not translate the whole passage in your head: look for the statement’s key words.'],

        ]]

      blocks: [

          ['SHL Verify G+ — около 90 секунд на вопрос (36 мин ÷ 24).', 'SHL Verify G+ — about 90 seconds per item (36 min ÷ 24).'],
          ['Korn Ferry Elements — отдельный таймер на каждый вопрос: 60–90 секунд. Больше всего времени даётся на первый вопрос к новой таблице или тексту — потратьте его на то, чтобы разобраться в данных: следующие вопросы будут по ним же.', 'Korn Ferry Elements — a separate timer on every item: 60–90 seconds. The first question on a new table or passage gets the most time — use it to understand the data, because the next questions use the same data.'],
          ['ЭКОПСИ Switch (по неофициальным данным) — до 45 секунд на лёгкие задания, до 60 на средние и до 90 на сложные.', 'Ecopsy Switch (unofficial data) — up to 45 seconds for easy items, up to 60 for medium and up to 90 for hard ones.']
        ]],
        ['Тактика по провайдерам', 'Tactics by provider', [
          ['Во всех трёх форматах вопросы идут по одному: пропустить вопрос и вернуться к нему позже обычно нельзя. Тактика «сначала лёгкие, потом трудные» здесь не работает.', 'In all three formats items come one at a time: you usually cannot skip an item and come back to it. “Easy ones first, hard ones later” does not work here.'],
          ['SHL: таймер общий. Знайте средний темп своего теста (индуктивный ≈72 с, дедуктивный ≈90 с, числовой ≈108 с, вербальный ≈38 с) и не тратьте на один вопрос больше полуторной нормы — дайте лучший ответ и двигайтесь дальше.', 'SHL: one overall timer. Know your test’s average pace (inductive ≈72 s, deductive ≈90 s, numerical ≈108 s, verbal ≈38 s) and spend no more than about 1.5 times that on one item — give your best answer and move on.'],
          ['SHL: за неверный ответ обычно не штрафуют (проверьте инструкцию), поэтому пустые вопросы невыгодны. Если время кончается, дайте лучший ответ на текущий вопрос, а не оставляйте его пустым.', 'SHL: wrong answers are usually not penalised (check the instructions), so blanks cost you. If time is running out, give your best answer to the current item rather than leave it blank.'],
          ['Korn Ferry: остаток времени не переносится на следующий вопрос. Решили — переходите, но не жертвуйте точностью ради скорости: сэкономленное время не пригодится.', 'Korn Ferry: unused time does not carry over. Once solved, move on, but do not trade accuracy for speed — saved time is lost anyway.'],
          ['Korn Ferry: выберите предварительный ответ, как только он у вас появится, и уточняйте его, пока идёт время. Если таймер истечёт, выбранный ответ засчитается; без ответа балла не будет, а следующий вопрос станет проще.', 'Korn Ferry: pick a provisional answer as soon as you have one and refine it while time remains. If the timer runs out, the selected answer is submitted; a blank scores nothing and the next item gets easier.'],
          ['Korn Ferry адаптивный: если вопросы стали труднее, это хороший знак.', 'Korn Ferry is adaptive: if items get harder, that is a good sign.'],
          ['ЭКОПСИ Switch: у каждого задания свой лимит. В числовом и вербальном тестах первые задания простые и короткие по времени (до 45 с) — решайте их быстро и без ошибок; на последних трёх сложных времени больше (до 90 с). Абстрактно-логический тест адаптивный.', 'Ecopsy Switch: every item has its own limit. In numerical and verbal the first items are easy and short (up to 45 s) — solve them quickly and accurately; the last three hard items get more time (up to 90 s). The abstract test is adaptive.']
        ]],
        ['Перед тестом', 'Before the test', [
          ['Узнайте точное название теста из приглашения (Verify Numerical, Elements Logical и т. п.) и тренируйте именно этот формат.', 'Find the exact test name in the invitation (Verify Numerical, Elements Logical, etc.) and practise that format.'],
          ['Пройдите демо-вопросы перед стартом: это бесплатное время, чтобы привыкнуть к интерфейсу.', 'Do the demo items before starting: it is free time to get used to the interface.'],
          ['Ноутбук лучше телефона: таблицы и графики читать удобнее.', 'A laptop beats a phone: tables and charts are easier to read.'],
          ['Подготовьте стабильный интернет, зарядку и тихое место: 30–60 минут на один тест, около 3 часов на комплексную оценку вроде ЭКОПСИ Potential in Focus. Выключите уведомления: внутри блока перерыв сделать нельзя, таймер продолжает идти.', 'Arrange a stable connection, a charger and a quiet place: 30–60 minutes for one test, about 3 hours for a full battery such as Ecopsy Potential in Focus. Turn off notifications: you cannot pause within a block and the timer keeps running.'],
          ['Держите под рукой обычный калькулятор, бумагу и ручку. Калькулятор в телефоне хуже: тест может идти на том же телефоне, а переключение между окнами отнимает время. Для Elements Numerical калькулятор нужен — возьмите свой.', 'Keep a physical calculator, paper and a pen at hand. A phone app is worse: the test may run on that same phone, and switching windows costs time. Elements Numerical needs a calculator — bring your own.'],
          ['Проходите тест сами: в SHL Verify может проводиться короткий проверочный тест для финалистов, и большой разрыв с онлайн-результатом будет заметен.', 'Take the test yourself: SHL Verify can include a short verification test for shortlisted candidates, and a big gap from your online score shows up.'],
          ['Лучше проходить на свежую голову, а не вечером после тяжёлого дня.', 'Take it when you are fresh, not late after a long day.']

        ['План подготовки на 1–2 недели', 'A 1–2 week preparation plan', [

          ['Дни 4–7: откройте «Статистику» и тренируйте два самых слабых типа заданий точечно.', 'Days 4–7: open Progress and drill your two weakest question types.'],
          ['Дни 8–10: экзамены в формате провайдера из приглашения, один-два в день. Если ждёте ЭКОПСИ для руководящей позиции, пройдите блок Potential in Focus.', 'Days 8–10: exams in the provider’s format from your invitation, one or two a day. If you expect Ecopsy for a management role, take the Potential in Focus block.'],

  function guideTab() {
    var sec = S.guideSec || 'formats';
    var h = '<div class="chips" style="margin-bottom:16px">' + GSECS.map(function (g) { return '<button class="chip" data-act="gsec" data-v="' + g[0] + '" aria-pressed="' + (sec === g[0]) + '">' + esc(tr(g[1])) + '</button>'; }).join('') + '</div>';
    if (sec === 'formats') return h + formatsHtml();
    var G = GUIDE[sec], ru = S.lang === 'ru';
    h += '<p class="sum-tip" style="max-width:72ch;margin:0 0 14px">' + esc(tr(G.intro)) + '</p>';
    G.blocks.forEach(function (b) {
      var tag = b[3] ? 'ol' : 'ul';
      h += '<div class="panel guide"><h2>' + esc(ru ? b[0] : b[1]) + '</h2><' + tag + '>' + b[2].map(function (it) { return '<li>' + (ru ? it[0] : it[1]) + '</li>'; }).join('') + '</' + tag + '></div>';
    });
    return h;
  }
  function formatsHtml() {
    var ru = S.lang === 'ru';

      'Три теста: Numerical — 12 вопросов по 4 таблицам, Verbal — 15 вопросов по 5 текстам, Logical — 12 вопросов. Общего лимита нет; если использовать время на каждом вопросе полностью, тест занимает 15–16 минут.',
      'Таймер на каждый вопрос: Numerical — 90 с на первый вопрос к таблице и 75 с на следующие; Verbal — 75 с на первый вопрос к тексту и 60 с на следующие; Logical — 75 с. Неиспользованное время не переносится, вернуться к прошлым вопросам нельзя.',
      'Тест адаптивный и начинается со средней сложности: после верного ответа следующий вопрос сложнее, после неверного или если время вышло без ответа — проще.',
      'Если время на вопрос истекло, засчитывается ответ, выбранный к этому моменту.',
      'В вербальном тесте в части вопросов нужно выбрать два утверждения, в остальных — одно; в вопросе всегда сказано, сколько выбрать. В числовом тесте ответ выбирается из длинного выпадающего списка значений.',

    ] : [
      'Three tests: Numerical — 12 questions on 4 tables, Verbal — 15 questions on 5 passages, Logical — 12 questions. There is no overall limit; using every item’s full time, a test takes 15–16 minutes.',
      'A timer on every item: Numerical — 90 s for the first question on a table, 75 s for the next ones; Verbal — 75 s for the first question on a passage, 60 s for the next; Logical — 75 s. Unused time does not carry over and you cannot go back.',

  /* ---------- events ---------- */
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), s = S.ses;
    switch (act) {
      case 'tab': S.tab = v; S.view = 'home'; S.confirmReset = false; render(); break;
      case 'lang': S.lang = v; DB.lang = v; persist(); heroSeries = null; render(); break;
      case 'count': S.cfg.count = +v; DB.cfg = S.cfg; persist(); render(); break;
      case 'level': S.cfg.level = +v; DB.cfg = S.cfg; persist(); render(); break;
      case 'filt': {
        var m = el.getAttribute('data-m'), f = S.filters[m];
        if (!v) S.filters[m] = []; else { var ix = f.indexOf(v); if (ix >= 0) f.splice(ix, 1); else f.push(v); if (f.length === MODS[m].types.length) S.filters[m] = []; }
        render(); break;
      }
      case 'train': startPractice(v); break;
      case 'exam': startExam(v); break;
      case 'weak': startPractice(el.getAttribute('data-m'), v ? [v] : []); break;
      case 'opt': if (s && Date.now() - s.qStart < 350) break; selectOpt(+v); break;
      case 'check': if (s && !s.revealed && hasSel()) reveal(); break;
      case 'submit': if (s && hasSel()) { record(false); advance(); } break;
      case 'next': advance(); break;
      case 'quit': S.confirmQuit = true; render(); break;
      case 'quit-no': S.confirmQuit = false; render(); break;
      case 'quit-yes': S.confirmQuit = false; if (s.kind === 'train' && !answeredCount(s)) { stopTick(); S.view = 'home'; S.ses = null; render(); window.scrollTo(0, 0); } else finish(false); break;
      case 'again': { var src = s.src; if (src.type === 'exam') startExam(src.id); else startPractice(src.mod, src.filter); break; }
      case 'home': S.view = 'home'; S.ses = null; render(); window.scrollTo(0, 0); break;
      case 'gsec': S.guideSec = v; render(); break;
      case 'reset': S.confirmReset = true; render(); break;
      case 'reset-no': S.confirmReset = false; render(); break;
      case 'reset-yes': DB.hist = []; persist(); S.confirmReset = false; render(); break;
    }
  });
  app.addEventListener('toggle', function (ev) {
    var d = ev.target; if (!d.matches || !d.matches('details[data-i]') || !d.open) return;
    var box = d.querySelector('.rv'); if (box.childElementCount) return;
    var s = S.ses, i = +d.getAttribute('data-i');
    box.innerHTML = qHtml(s.qs[i], { idx: i, total: s.plan.length, sel: s.ans[i].chosen, revealed: true, ans: s.ans[i], lang: s.lang, review: true });
  }, true);
  function hasSel() { var s = S.ses, q = s.qs[s.i]; return q.multi ? s.sel.length > 0 : s.sel != null; }
  function reveal() {
    var s = S.ses; record(false); s.revealed = true; render();
    var nb = app.querySelector('[data-act="next"]'); if (nb) nb.focus({ preventScroll: true });
  }
  function selectOpt(i) {
    var s = S.ses; if (!s || s.revealed || s.done) return;
    var q = s.qs[s.i]; if (i < 0 || i >= q.options.length) return;
    if (q.multi) { var ix = s.sel.indexOf(i); if (ix >= 0) s.sel.splice(ix, 1); else s.sel.push(i); }
    else s.sel = i;
    render();
    var b = app.querySelector('.opt[data-v="' + i + '"]'); if (b) b.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', function (ev) {
    if (S.view !== 'session' || !S.ses || S.ses.done || S.confirmQuit || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = (ev.key || '').toLowerCase(), s = S.ses;
    if (ev.repeat) return;
    var map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7, a: 0, b: 1, c: 2, d: 3, e: 4, f: 5, g: 6, h: 7 };
    if (map[k] != null && !s.revealed) { ev.preventDefault(); if (Date.now() - s.qStart >= 350) selectOpt(map[k]); return; }
    if (k === 'enter') {
      var tg = ev.target;
      if (tg && tg.closest && (tg.closest('.opt') || tg.closest('[data-act="quit"],[data-act="quit-yes"],[data-act="quit-no"]'))) return;
      ev.preventDefault();
      if (Date.now() - s.qStart < 350) return;
      if (s.kind === 'train') { if (s.revealed) advance(); else if (hasSel()) reveal(); }
      else if (hasSel()) { record(false); advance(); }
    }
  });

  render();
})();
