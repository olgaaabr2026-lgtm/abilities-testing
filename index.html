  var GSECS = [['use', T('Как пользоваться', 'How to use it')], ['formats', T('Форматы тестов', 'Test formats')], ['ind', T('Абстрактный', 'Abstract')], ['num', T('Числовой', 'Numerical')], ['ded', T('Дедуктивный', 'Deductive')], ['verb', T('Вербальный', 'Verbal')], ['time', T('Время и день теста', 'Timing and test day')]];
  // block: [titleRu, titleEn, [[ru, en], ...], ordered]
  var GUIDE = {
    ind: {
      intro: T('Задача — найти скрытые правила. В реальных тестах обычно действуют два-три правила одновременно, и каждое относится к своему элементу фигуры.', 'The task is to find hidden rules. Real tests usually apply two or three rules at once, each to a different element of the figure.'),
      blocks: [
        ['Алгоритм на один вопрос (60–75 секунд)', 'Routine for one item (60–75 seconds)', [
          ['За 10 секунд пробегите взглядом весь ряд и отметьте, какие элементы вообще меняются.', 'In 10 seconds scan the whole series and note which elements change at all.'],
          ['Возьмите один элемент и проследите его по всем фигурам. Не сравнивайте фигуры целиком.', 'Take one element and follow it through every figure. Do not compare whole figures.'],
          ['Найдя первое правило, сразу вычеркните варианты, которые его нарушают. Обычно остаётся два-три.', 'Once you find the first rule, cross out every option that breaks it. Usually two or three remain.'],
          ['Второе правило ищите только среди оставшихся вариантов — так быстрее.', 'Look for the second rule only among the remaining options — it is faster.'],
          ['Если осталось два варианта, найдите элемент, которым они различаются, и проверьте только его.', 'If two options remain, find the element where they differ and check just that.']
        ], true],
        ['Чек-лист ФЦПКП: что может меняться', 'Checklist SCPNR: what can change', [
          ['<b>Форма</b> — тип фигуры, число сторон (+1, −1, по циклу).', '<b>Shape</b> — figure type, number of sides (+1, −1, in a cycle).'],
          ['<b>Цвет и заливка</b> — белая, серая, чёрная, штриховка; чередование через один или цикл из трёх.', '<b>Colour and fill</b> — white, grey, black, hatching; alternating or a three-step cycle.'],
          ['<b>Положение</b> — сдвиг по кругу или сетке, по или против часовой стрелки, на 1, 2 или 3 позиции.', '<b>Position</b> — moves around a ring or grid, clockwise or anticlockwise, by 1, 2 or 3 places.'],
          ['<b>Количество</b> — элементов, точек, линий: прибавляется, убывает или повторяется по циклу.', '<b>Number</b> — of elements, dots, lines: rising, falling or cycling.'],
          ['<b>Поворот</b> — на 45°, 90° или 180°; иногда шаг растёт: 45°, 90°, 135°…', '<b>Rotation</b> — by 45°, 90° or 180°; sometimes the step grows: 45°, 90°, 135°…']
        ]],
        ['Как решать по форматам', 'How to solve each format', [
          ['<b>Ряды.</b> Следите за одним элементом от фигуры к фигуре и запишите, как он меняется: «+90°», «белый → серый → чёрный». Предскажите следующую фигуру и только потом смотрите на варианты.', '<b>Series.</b> Follow one element from figure to figure and write down how it changes: “+90°”, “white → grey → black”. Predict the next figure before you look at the options.'],
          ['<b>Матрицы.</b> Начните с полной строки или столбца. Проверьте оба направления: правило может идти по строкам, по столбцам или быть «латинским квадратом» — каждое значение один раз в строке и в столбце. Тогда в пустую клетку попадает то значение, которого в её строке ещё нет.', '<b>Matrices.</b> Start from a complete row or column. Check both directions: the rule may run along rows, along columns, or be a “Latin square” — each value once in every row and column. Then the empty cell takes the value its row is still missing.'],
          ['<b>Лишняя фигура.</b> Ищите связь элементов внутри каждой фигуры (точек столько же, сколько сторон; стрелка смотрит на кружок). Фигура, которая сильнее всего выделяется на вид, чаще ловушка, чем ответ.', '<b>Odd one out.</b> Look for a link between elements inside each figure (as many dots as sides; the arrow points at the circle). The figure that looks most different is more often a trap than the answer.'],
          ['<b>Движение по сетке.</b> Разберите каждый элемент отдельно: запишите номер его клетки на каждом шаге — так сразу видно маршрут, шаг и переход через край сетки. Если один элемент прыгает без системы, а остальные объяснены, это шум.', '<b>Grid movement.</b> Take each element separately: write down its cell number at every step — the path, the step size and how it wraps past the edge become obvious. If one element jumps around with no pattern and the rest are explained, it is noise.'],
          ['<b>Повороты в матрице (Korn Ferry).</b> Выберите несимметричную деталь — короткий выступ буквы L или флажок — и следите за ней: так виден угол и направление поворота. Проверка на зеркало: мысленно поверните вариант так, чтобы длинная часть легла как у соседней фигуры. Если выступ оказался с другой стороны, это отражение, а не поворот.', '<b>Rotation matrices (Korn Ferry).</b> Pick an asymmetric detail — the short foot of an L or the flag — and follow it: it shows the angle and direction of rotation. Mirror check: mentally turn the option so its long part lies like the neighbouring figure. If the foot ends up on the other side, it is a reflection, not a rotation.'],
          ['<b>Стрелки.</b> Клетка состоит из нескольких позиций (левая, средняя, правая стрелка), и у каждой своё правило: одна поворачивается от столбца к столбцу, другая одинакова во всей строке, третья принимает каждое направление один раз в строке и в столбце. Решайте позицию за позицией.', '<b>Arrows.</b> A cell has several positions (left, middle, right arrow), each with its own rule: one rotates from column to column, another stays the same across the row, a third takes each direction once per row and column. Solve one position at a time.'],
          ['<b>Наложение.</b> Третья фигура получается из первых двух одним из четырёх способов: всё вместе, только общее, только различающееся, «первое минус второе». Хватает двух проверок. Линия есть в обеих фигурах — она остаётся при «всё вместе» и «только общее». Линия есть только во второй — она остаётся при «всё вместе» и «только различающееся».', '<b>Overlay.</b> The third figure is made from the first two in one of four ways: everything, common lines only, differing lines only, or “first minus second”. Two checks are enough. A line in both figures stays under “everything” and “common only”. A line only in the second figure stays under “everything” and “differing only”.'],
          ['<b>Счёт элементов.</b> Считайте каждый вид элементов отдельно (линии, точки), не обращая внимания на их расположение. Подпишите числа под фигурами и посмотрите на разности: +1; цикл +2, −1; −1.', '<b>Counting.</b> Count each kind of element separately (lines, dots) and ignore where they sit. Write the numbers under the figures and look at the differences: +1; a +2, −1 cycle; −1.'],
          ['<b>Поворот узора (Cognify).</b> Проследите одну угловую плитку, затем проверьте одну диагональную: её жёлтый угол поворачивается вместе со всем узором. Ловушка — плитки переставлены, но сами не повёрнуты.', '<b>Turning a pattern (Cognify).</b> Track one corner tile, then check one diagonal tile: its yellow corner turns with the whole pattern. The trap: tiles moved but not turned.'],
          ['<b>Заполнить силуэт (Cognify).</b> Посчитайте клетки пустого места, приложите каждую фигуру к его самой длинной прямой части. Фигуры можно поворачивать, но не переворачивать: зеркальная копия — ловушка.', '<b>Fill the silhouette (Cognify).</b> Count the gap’s cells and line each piece up against its longest straight run. Pieces may be turned but not flipped: the mirror image is a trap.'],
          ['<b>Коды перестановки (Aon).</b> Для каждой позиции нижнего ряда найдите, откуда пришла фигура, — это и есть цифра кода. Обратный код (куда фигура ушла) — главная ловушка. В цепочке сначала примените известный код.', '<b>Switch codes (Aon).</b> For each position in the bottom row find where the shape came from — that is the code digit. The inverse code (where a shape went) is the main trap. In a chain, apply the known code first.'],
          ['<b>Коды и цепочки (SHL Interactive).</b> Разбейте код на позиции и найдите правило для каждой: буква сдвигается по алфавиту, цифра растёт или убывает, последний символ чередуется, знаки меняются местами. Опорные номера латинских букв: E = 5, J = 10, O = 15, T = 20, Y = 25.', '<b>Codes and chains (SHL Interactive).</b> Split the code into positions and find a rule for each: a letter steps through the alphabet, a digit rises or falls, the last symbol alternates, characters swap places. Anchor letters: E = 5, J = 10, O = 15, T = 20, Y = 25.']
        ]],
        ['Матрицы Равена (KFALP)', 'Raven’s matrices (KFALP)', [
          ['В матрицах Равена встречается всего несколько типов правил: признак одинаков в строке; признак меняется с постоянным шагом (поворот, число элементов); три значения распределены по одному разу в каждой строке и столбце; третья фигура — сумма или разность первых двух; совпадающие элементы исчезают.', 'Raven’s matrices use only a handful of rule types: an attribute stays the same along a row; it changes by a constant step (rotation, number of elements); three values are spread once per row and column; the third figure is the sum or difference of the first two; matching elements cancel out.'],
          ['Разберите клетку на признаки и решайте каждый отдельно. Сначала составьте ответ мысленно, потом ищите его среди вариантов: из восьми вариантов большинство отличается от верного одной деталью или повторяет соседнюю клетку.', 'Break the cell into attributes and solve each separately. Build the answer in your head first, then look for it: most of the eight options differ from it by one detail or copy a neighbouring cell.'],
          ['Сложение и вычитание: посчитайте элементы в каждой клетке и проверьте, не равно ли третье число сумме или разности первых двух. Если значков несколько видов, считайте каждый вид отдельно — у них могут быть разные действия. Правило может идти и сверху вниз по столбцам.', 'Adding and subtracting: count the elements in each cell and check whether the third number is the sum or difference of the first two. With several kinds of symbol, count each kind separately — they may follow different operations. The rule may also run down the columns.'],
          ['Если признак «скачет» без порядка по строкам, проверьте столбцы и диагонали — правило «по одному разу в строке и столбце» часто выглядит как хаос.', 'If an attribute seems to jump around along the rows, check the columns and diagonals — the “once per row and column” rule often looks like chaos.'],
          ['Недостающий фрагмент: смотрите, где каждая линия входит в вырез и где выходит. Зеркальный, повёрнутый или сдвинутый кусок выдаёт себя на одном из краёв.', 'Missing piece: look at where each line enters and leaves the gap. A mirrored, turned or shifted piece gives itself away at one edge.'],
          ['Сложность растёт к концу, а время общее (около 40 минут): первые задания решайте быстро, чтобы оставить запас на последние. Пустой ответ обычно хуже предположения.', 'Items get harder towards the end and the time is shared (about 40 minutes): move quickly through the early ones to save time for the last. A blank is usually worse than a guess.']
        ]],
        ['Типовые правила, которые стоит знать', 'Common rules worth knowing', [
          ['Чередование и цикл: «белый — чёрный» (период 2), «белый — серый — чёрный» (период 3). Чтобы найти период, посчитайте, через сколько шагов признак повторяется.', 'Alternation and cycles: white–black (period 2), white–grey–black (period 3). To find the period, count how many steps it takes for the feature to repeat.'],
          ['Растущий шаг: сдвиг на 1, 2, 3… позиции. Если движение кажется неровным, выпишите разности между соседними положениями.', 'Growing step: moves of 1, 2, 3… places. If the motion looks irregular, write down the differences between neighbouring positions.'],
          ['Движение по кругу из 8 позиций: одна позиция = 45°. Сдвиг на 4 = противоположная сторона.', 'Movement around 8 positions: one position = 45°. A move of 4 = the opposite side.'],
          ['Связь внутри фигуры: число точек равно числу сторон, стрелка указывает на кружок, цвета противоположны.', 'A link inside each figure: dots equal sides, the arrow points at the circle, colours are opposite.'],
          ['Матрицы: правило идёт по строкам, по столбцам или «каждое значение один раз в каждой строке и каждом столбце».', 'Matrices: the rule runs along rows, along columns, or “each value once in every row and column”.'],
          ['Ещё типовые правила: сумма или чётность элементов, симметрия, число углов или пересечений, наложение, при котором остаются только общие элементы.', 'More common rules: the sum or parity of elements, symmetry, the number of corners or intersections, and overlays where only common elements remain.']
        ]],
        ['Лайфхаки', 'Tips', [
          ['Сначала предскажите ответ, потом смотрите на варианты. Сравните варианты между собой: признаки, которыми они различаются, подсказывают, какие правила нужно проверить.', 'Predict the answer before looking at the options. Then compare the options: the features in which they differ show which rules you need to check.'],
          ['В SHL Interactive ответ часто нужно собрать самому — перетащить элементы или линию. Отсеять варианты не получится, поэтому найдите все правила до конца.', 'In SHL Interactive you often build the answer yourself by dragging elements or a line. You cannot eliminate options, so pin down every rule.'],
          ['Проговаривайте правило коротко: «стрелка +90°, кружок −1». Так варианты проверяются за секунды.', 'Say the rule briefly: “arrow +90°, circle −1”. Options can then be checked in seconds.'],
          ['Не ищите одно сложное правило — почти всегда это несколько простых.', 'Do not look for one complex rule — it is almost always several simple ones.'],
          ['Если признак меняется хаотично, это шум. Сосредоточьтесь на остальных элементах.', 'If a feature changes at random, it is noise. Focus on the other elements.'],
          ['Сравните первую и последнюю фигуры: это быстро показывает направление поворота и общий счёт.', 'Compare the first and last figures: it quickly shows the direction of rotation and the overall count.'],
          ['В матрице начните с самой полной строки или столбца и выведите правило из них.', 'In a matrix start from the most complete row or column and derive the rule from it.'],
          ['В «лишней фигуре» ищите связь элементов внутри каждой фигуры. Самая заметная по цвету фигура часто ловушка.', 'For the odd one out, look for a link between elements inside each figure. The one that stands out by colour is often the trap.'],
          ['В рядах и поворотах на уровнях Senior и эксперт у каждого правила есть «свой» неверный вариант, нарушающий только его, поэтому без всех правил остаются минимум два варианта. Обратная сторона: верный ответ здесь часто больше всех похож на остальные — по каждому признаку его значение встречается чаще. Используйте это только как последний приём, когда время кончается: в матрицах с 6–8 вариантами и в Равене он не работает.', 'In series and rotation items at Senior and Expert level every rule has its own wrong option that breaks only that rule, so without all the rules at least two options remain. The flip side: the right answer is often the one most like the others — on each feature its value is the most common. Use this only as a last resort when time runs out: it does not work in 6–8-option matrices or in Raven items.'],
          ['Не тратьте больше 90 секунд на вопрос: выберите лучший вариант и двигайтесь дальше.', 'Do not spend more than 90 seconds on one item: pick the best option and move on.']
        ]]
      ]
    },
    num: {
      intro: T('Проверяется не высшая математика, а умение быстро найти нужные данные и не ошибиться в базе, единицах и периоде. Большинство ошибок связано с чтением условия, а не с арифметикой.', 'This is not about advanced maths but about finding the right data fast and getting the base, units and period right. Most mistakes come from reading the question, not from arithmetic.'),
      blocks: [
        ['Алгоритм на один вопрос', 'Routine for one item', [
          ['Сначала прочитайте вопрос, потом ищите в таблице только нужное: строку, столбец, год.', 'Read the question first, then look up only what you need: row, column, year.'],
          ['Проверьте единицы: тысячи или миллионы, сутки или год, доллары или рубли, проценты или процентные пункты. Прочитайте сноски.', 'Check the units: thousands or millions, per day or per year, dollars or roubles, percent or percentage points. Read the footnotes.'],
          ['Прикиньте порядок ответа в уме и отбросьте явно нереальные варианты.', 'Estimate the order of magnitude and drop clearly unrealistic options.'],
          ['Посчитайте на калькуляторе (обычно разрешён — проверьте инструкцию) и сверьте с вариантами.', 'Calculate (a calculator is usually allowed — check the instructions) and compare with the options.'],
          ['Если результат не совпадает ни с одним вариантом, проверьте базу процента и период.', 'If your result matches no option, check the percentage base and the period.']
        ], true],
        ['Формулы, которые нужны чаще всего', 'Formulas you will need most', [
          ['Изменение в %: (новое − старое) ÷ старое × 100. База — старое значение. В сравнениях «на сколько % A больше B» база — B, то, с чем сравнивают.', 'Change in %: (new − old) ÷ old × 100. The base is the old value. In comparisons such as “by what % is A higher than B”, the base is B — the thing you compare with.'],
          ['Доля в %: часть ÷ целое × 100. Целое включает саму часть.', 'Share in %: part ÷ whole × 100. The whole includes the part itself.'],
          ['Обратный процент: если после роста на p% получилось X, исходное = X ÷ (1 + p/100), а не X × (1 − p/100).', 'Reverse percentage: if X is the value after a p% rise, the original is X ÷ (1 + p/100), not X × (1 − p/100).'],
          ['Процентные пункты — разница двух процентов: рост с 30% до 45% — это +15 п. п., но +50%.', 'Percentage points are the difference between two percentages: 30% to 45% is +15 pp but +50%.'],
          ['CAGR = (конец ÷ начало)<sup>1/n</sup> − 1, где n — число годовых шагов (2023 → 2025 — это два шага).', 'CAGR = (end ÷ start)<sup>1/n</sup> − 1, where n is the number of annual steps (2023 → 2025 is two steps).'],
          ['Проверяйте ответ подстановкой: для CAGR умножьте начало на (1 + r)<sup>n</sup> и сравните с концом. Если после падения на p% получилось X, исходное = X ÷ (1 − p/100).', 'Check answers by substitution: for CAGR, multiply the start by (1 + r)<sup>n</sup> and compare with the end. If X is the value after a p% fall, the original is X ÷ (1 − p/100).'],
          ['Удельный показатель: затраты ÷ объём за тот же период. Суточную добычу сначала умножьте на 365.', 'Unit metric: cost ÷ volume for the same period. Multiply daily output by 365 first.'],
          ['Средняя цена = выручка ÷ объём, а не среднее арифметическое цен.', 'Average price = revenue ÷ volume, not the simple average of prices.'],
          ['Рублёвая цена = цена в долларах × курс. Её изменение зависит и от цены, и от курса.', 'Rouble price = dollar price × exchange rate. Its change depends on both.'],
          ['Если цена выросла на a%, а курс на b%, рублёвая цена изменилась на [(1 + a/100)(1 + b/100) − 1] × 100%, а не на (a + b)%.', 'If the price rose by a% and the exchange rate by b%, the rouble price changed by [(1 + a/100)(1 + b/100) − 1] × 100%, not by (a + b)%.']
        ]],
        ['Как решать по типам данных', 'How to handle each type of data', [
          ['<b>Круговая диаграмма.</b> Сумма по статье = доля × итог. Разница двух статей в деньгах = (доля 1 − доля 2) × итог; сама разница долей — это процентные пункты. Если выросла одна статья, вырос и итог: новая доля = новая сумма статьи ÷ новый итог.', '<b>Pie chart.</b> An item’s amount = share × total. The money gap between two items = (share 1 − share 2) × total; the gap in shares alone is percentage points. If one item grows, the total grows too: new share = the item’s new amount ÷ the new total.'],
          ['<b>Линейный график.</b> Берите подписанные значения, а не оценку по сетке. «Сильнее всего вырос» — это самая большая разница с предыдущим месяцем, а не самая высокая точка графика. Спред между двумя линиями (например, дисконт Urals к Brent) — это разница значений за один и тот же месяц.', '<b>Line chart.</b> Use the labelled values, not a reading off the grid. “Rose the most” is the largest change from the previous month, not the highest point on the chart. The spread between two lines (e.g. the Urals discount to Brent) is the difference for the same month.'],
          ['<b>Отчётность.</b> Используйте определения из условия или сноски, даже если в вашей компании считали иначе: в тесте «FCF = EBITDA − CAPEX» значит ровно это. Рентабельность считается от выручки, а не от расходов; «долг / EBITDA» — долг в числителе.', '<b>Financial statements.</b> Use the definitions in the question or footnote, even if your company calculated differently: if the test says FCF = EBITDA − CAPEX, it means exactly that. Margin is on revenue, not on costs; in net debt / EBITDA, debt goes on top.'],
          ['<b>План-факт.</b> Отклонение в % = (факт − план) ÷ план; перерасход — со знаком плюс. Общее отклонение = (сумма факта − сумма плана) ÷ сумма плана, а не среднее отклонений по статьям. Наибольшее отклонение в процентах и в деньгах обычно у разных статей.', '<b>Budget vs actual.</b> Variance in % = (actual − budget) ÷ budget; an overspend is positive. The total variance = (total actual − total budget) ÷ total budget, not the average of the item variances. The biggest variance in per cent and in money usually belong to different items.'],
          ['<b>Средневзвешенное.</b> Средняя цена = Σ(объём × цена) ÷ Σ объёмов. Доля канала в выручке = его объём × цена ÷ общая выручка — это не то же самое, что доля в объёме. Простое среднее цен почти всегда стоит среди вариантов как ловушка.', '<b>Weighted average.</b> Average price = Σ(volume × price) ÷ Σ volumes. A channel’s share of revenue = its volume × price ÷ total revenue — not the same as its share of volume. The simple average of the prices is almost always among the options as a trap.'],
          ['<b>Обратный процент в несколько шагов.</b> Если значение дважды проиндексировали на a% и b%, исходное = X ÷ (1 + b/100) ÷ (1 + a/100). Складывать проценты или вычитать их из нового значения нельзя.', '<b>Multi-step reverse percentage.</b> If a value was indexed twice, by a% and b%, the original = X ÷ (1 + b/100) ÷ (1 + a/100). Do not add the percentages or subtract them from the new value.'],
          ['<b>Данные не из вашей отрасли.</b> В SHL, Korn Ferry и банковских тестах таблицы чаще всего про продажи, персонал, авиаперевозки, производство или финансы компании. Формулы те же; главное — внимательно читать единицы и подписи (пенсы и фунты, часы и минуты смены, млн и тыс.). В тренажёре около 30% числовых задач в смешанном режиме — такие.', '<b>Data from outside your industry.</b> In SHL, Korn Ferry and bank tests the tables are most often about sales, staff, air traffic, manufacturing or company financials. The formulas are the same; read units and labels carefully (pence and pounds, shift hours and minutes, millions and thousands). About 30% of mixed numerical items in the trainer are like this.'],
          ['<b>Смена и рабочее время.</b> 08:00–15:30 — это 7,5 часа, а не 7,3. Если нужно число людей, округляйте вверх: 13,2 человека — это 14.', '<b>Shifts and working time.</b> 08:00–15:30 is 7.5 hours, not 7.3. When the answer is a number of people, round up: 13.2 people means 14.'],
          ['<b>Проценты и ставки (банки).</b> Простые проценты: сумма × ставка × месяцы ÷ 12. Эффективная ставка при ежемесячной капитализации: (1 + r/12)<sup>12</sup> − 1. NPV: каждый поток делится на (1 + r)<sup>t</sup>, где t — номер года.', '<b>Interest and rates (banks).</b> Simple interest: amount × rate × months ÷ 12. Effective rate with monthly compounding: (1 + r/12)<sup>12</sup> − 1. NPV: divide each flow by (1 + r)<sup>t</sup>, where t is its year.'],
          ['<b>Головоломки с собеседований.</b> Часы: минутная стрелка — 6° в минуту, часовая — 0,5° в минуту. Совместная работа: складывайте производительности (1/a + 1/b). Средняя скорость «туда и обратно» = 2v₁v₂ ÷ (v₁ + v₂). Последовательные проценты перемножаются.', '<b>Interview puzzles.</b> Clocks: the minute hand moves 6° a minute, the hour hand 0.5°. Combined work: add the rates (1/a + 1/b). Average speed there and back = 2v₁v₂ ÷ (v₁ + v₂). Successive percentages multiply.'],
          ['<b>График и таблица вместе.</b> Сначала сопоставьте периоды и единицы в обоих источниках. Считайте по каждому периоду отдельно (объём × цена × курс) и только потом складывайте. Средняя цена × средний курс × общий объём дадут неверный ответ.', '<b>Chart plus table.</b> First match the periods and units in both sources. Calculate each period separately (volume × price × rate) and only then add up. Average price × average rate × total volume gives the wrong answer.']
        ]],
        ['Английские термины в числовых тестах', 'English terms in numerical tests', [
          ['<b>Финансы:</b> turnover / revenue — выручка; net income / net profit — чистая прибыль; operating profit — операционная прибыль; margin — рентабельность; EPS (earnings per share) — прибыль на акцию; market cap — капитализация; share price — цена акции; assets / liabilities / debt — активы / обязательства / долг.', '<b>Finance:</b> turnover / revenue; net income / net profit; operating profit; margin; EPS (earnings per share); market cap; share price; assets / liabilities / debt.'],
          ['<b>Изменения:</b> percentage points (pp) — процентные пункты; year-on-year (YoY) — к прошлому году; CAGR — среднегодовой темп роста; rose by / rose to — выросло на / до; fell by — снизилось на; at the same rate — тем же темпом; per annum (p.a.) — в год.', '<b>Changes:</b> percentage points (pp) — a difference between percentages; year-on-year (YoY); CAGR; rose by / rose to; fell by; at the same rate; per annum (p.a.).'],
          ['<b>Единицы:</b> bn — млрд, mn или m — млн, k — тыс.; 100 pence = 1 pound (в британских тестах цены акций часто в пенсах, а выручка — в фунтах); headcount — численность персонала; man-hours — человеко-часы; shift — смена.', '<b>Units:</b> bn, mn or m, k; 100 pence = 1 pound (UK tests often quote share prices in pence and revenue in pounds); headcount; man-hours; shift.'],
          ['<b>Формулировки:</b> approximately — округлите; to the nearest… — до ближайшего…; which of the following is closest — выберите ближайший вариант; cannot say / insufficient information — данных не хватает.', '<b>Wording:</b> approximately; to the nearest…; which of the following is closest; cannot say / insufficient information.']
        ]],
        ['Быстрый счёт', 'Quick mental maths', [
          ['10% — сдвиг запятой, 5% — половина от 10%, 1% — сотая часть; 15% = 10% + 5%.', '10% moves the decimal point, 5% is half of that, 1% is one hundredth; 15% = 10% + 5%.'],
          ['Рост на 25% = × 1,25; падение на 20% = × 0,8. Рост на 20% и затем падение на 20% дают × 0,96, а не возврат к исходному.', 'A 25% rise = × 1.25; a 20% fall = × 0.8. A 20% rise followed by a 20% fall gives × 0.96, not the starting value.'],
          ['Если варианты отличаются друг от друга на 15–20% и больше, точный расчёт не нужен — хватит оценки. В тренажёре на уровнях Senior и эксперт варианты стоят теснее (часто в 1–5% друг от друга), и там оценки уже недостаточно.', 'If the options differ by 15–20% or more, an estimate is enough. At Senior and Expert level in the trainer the options sit closer (often 1–5% apart), so an estimate is no longer enough.']
        ]],
        ['Ловушки составителей', 'Traps setters use', [
          ['Процент от неверной базы — от нового значения вместо старого.', 'Percentage of the wrong base — the new value instead of the old.'],
          ['Не тот год или квартал в таблице с несколькими периодами.', 'The wrong year or quarter in a multi-period table.'],
          ['360 дней вместо 365, сутки вместо года, тысячи вместо миллионов.', '360 days instead of 365, days instead of years, thousands instead of millions.'],
          ['Абсолютный прирост вместо процентного в вопросах «где выросло сильнее».', 'Absolute growth instead of percentage growth in “which grew most” questions.'],
          ['Забытый дисконт, курс или коэффициент в многошаговом расчёте.', 'A missed discount, exchange rate or factor in a multi-step calculation.'],
          ['В Korn Ferry Elements Numerical ответ выбирается из выпадающего списка, где вариантов часто 10 и больше. Сначала посчитайте, потом ищите своё число в списке: близкие значения в нём часто соответствуют типичным ошибкам.', 'In Korn Ferry Elements Numerical you pick the answer from a drop-down list that often has 10 or more values. Calculate first, then find your number: nearby values often match typical mistakes.']
        ]],
        ['Лайфхаки', 'Tips', [
          ['Держите рядом бумагу и записывайте промежуточные результаты, чтобы не пересчитывать.', 'Keep paper at hand and write down interim results so you do not recalculate.'],
          ['Округляйте только в конце, промежуточные значения держите с 3–4 знаками.', 'Round only at the end; keep 3–4 digits in interim values.'],
          ['Читайте график целиком: начинается ли ось с нуля, нет ли второй оси, сложены ли столбцы. Среднее из процентов равно общему проценту, только если базы одинаковы.', 'Read the whole chart: does the axis start at zero, is there a second axis, are the bars stacked? An average of percentages equals the overall percentage only if the bases are equal.'],
          ['В SHL Interactive иногда нужно ввести число или перетащить столбец графика. Потренируйтесь отвечать без готовых вариантов: решайте задачу до того, как смотреть на ответы. В тренажёре для этого есть фильтры «Ввод числа (SHL)» и «Графики и таблицы (SHL Interactive)».', 'SHL Interactive sometimes asks you to type a number or drag a chart bar. Practise answering without options: solve the item before looking at the choices. The trainer’s “Type the number (SHL)” and “Charts and tables (SHL Interactive)” filters do exactly this.'],
          ['При вводе числа ошибка формата стоит столько же, сколько ошибка в расчёте. Округляйте ровно так, как сказано в задании; для снижения ставьте минус; единицы уже указаны рядом с полем — вводите только число. Перед отправкой подставьте ответ обратно в условие.', 'When typing a number, a format slip costs as much as a calculation error. Round exactly as instructed; use a minus sign for a decrease; the units are shown next to the box, so enter only the number. Before submitting, plug your answer back into the question.']
        ]]
      ]
    },
    ded: {
      intro: T('Всё, что нужно, есть в условии. Задача не догадаться, а строго вывести ответ.', 'Everything you need is in the conditions. The task is not to guess but to derive the answer strictly.'),
      blocks: [
        ['Порядок, расписание, рассадка', 'Ordering, schedules, seating', [
          ['Нарисуйте слоты: 1 _ 2 _ 3 _ 4 _ 5 или сетку «время × комната».', 'Draw the slots: 1 _ 2 _ 3 _ 4 _ 5, or a time × room grid.'],
          ['Начните с жёстких условий: точное место, «сразу после», «в одной комнате».', 'Start with the tight conditions: exact place, “immediately after”, “in the same room”.'],
          ['Склейте связанные элементы в блоки (А сразу после Б → «БА») и двигайте блоками.', 'Glue linked items into blocks (A right after B → “BA”) and move the blocks.'],
          ['Условия с «не», «раньше», «позже» применяйте последними — они отсекают оставшиеся варианты.', 'Apply “not”, “before” and “after” last — they eliminate the remaining options.'],
          ['Часто для ответа не нужно решать всё: спрашиваемое место определяется раньше полной расстановки.', 'Often you do not need the full solution: the asked position is fixed before everything else.'],
          ['В интерактивных заданиях SHL (составить расписание, распределить комнаты) перечитывайте условия после каждого размещения: одно пропущенное «не» ломает решение.', 'In SHL interactive tasks (build a schedule, assign rooms) re-read the conditions after each placement: one missed “not” breaks the solution.'],
          ['Рассадка: число мест — тоже условие. Если в кабинете уже сидят двое, остальные туда не попадают, и часто именно это даёт последний шаг.', 'Room allocation: the number of seats is a condition too. Once an office has two people, nobody else can go there — often that gives the final step.'],
          ['Ранжирование: условия «A больше B» выстраивайте в цепочку A > B > C, а «сразу после» склеивайте в блок. Обычно одна цепочка и один блок задают почти весь порядок.', 'Ranking: chain the “A is above B” conditions into A > B > C, and glue “immediately after” into a block. Usually one chain and one block fix almost the whole order.'],
          ['Расписание и календарь: проверяйте не только время начала, но и весь отрезок события. Типичная ловушка — окно короче встречи или день, после которого идут выходные. Строки людей, которых нет в условии, — шум.', 'Schedules and calendars: check the whole length of the event, not just its start. Typical traps are a window shorter than the meeting, or a day followed by a weekend. Rows for people not named in the task are noise.'],
          ['Календарь: «не менее двух полных рабочих дней между X и началом» — считаются только рабочие дни строго между ними; сам день X, день начала и выходные не считаются. «Закончиться не позже 23-го» относится к последнему дню события, а не к первому.', 'Calendars: “at least two full working days between X and the start” counts only working days strictly in between; day X, the start day and weekends do not count. “End no later than the 23rd” applies to the event’s last day, not its first.'],
          ['Планирование задач: раннее начало задачи = самое позднее окончание её предшественников. Срок проекта — самое позднее окончание, а не сумма длительностей. Резерв — на сколько задачу можно сдвинуть, не задев срок; у задач критического пути резерв 0.', 'Task scheduling: a task’s earliest start = the latest finish of its predecessors. The project length is the latest finish, not the sum of durations. Float is how far a task can slip without moving the end date; critical-path tasks have zero float.'],
        ]],
        ['Когда допустимых расстановок несколько', 'When several arrangements are possible', [
          ['Прочитайте вопрос: «обязательно верно» — в любой допустимой расстановке, «может быть верно» — хотя бы в одной, «точно неверно» — ни в одной.', 'Read the stem: “must be true” holds in every valid arrangement, “could be true” in at least one, “cannot be true” in none.'],
          ['Выпишите две-три допустимые расстановки. Обычно этого хватает, чтобы сразу отсечь большую часть вариантов.', 'Write out two or three valid arrangements. That is usually enough to rule out most options at once.'],
          ['«Может быть верно»: варианты, которые нарушают условия, отсекаются быстро. Для оставшегося достаточно найти одну подходящую расстановку.', '“Could be true”: options that break a condition drop out quickly. For the one left, a single valid arrangement is enough.'],
          ['«Точно неверно»: добавьте утверждение к условиям и попробуйте расставить всех. Не получилось — это ответ.', '“Cannot be true”: add the statement to the conditions and try to place everyone. If you cannot, that is the answer.'],
          ['«Обязательно верно»: ищите допустимую расстановку, в которой утверждение ложно. Нашли — вариант отпадает.', '“Must be true”: look for a valid arrangement in which the statement is false. If you find one, the option is out.']
        ], true],
        ['Логические выводы', 'Logical conclusions', [
          ['Рисуйте круги Эйлера. «Все A — B»: круг A внутри B. «Ни один A не B»: круги не пересекаются. «Некоторые A — B»: есть хотя бы одна общая точка.', 'Draw Euler circles. “All A are B”: A inside B. “No A is B”: circles apart. “Some A are B”: at least one shared point.'],
          ['«Некоторые» значит «хотя бы один, возможно все».', '“Some” means “at least one, possibly all”.'],
          ['«Все A — B» не означает «все B — A», но из него следует «некоторые B — A», если группа A непуста (в тренажёре это сказано в условии, в тестах обычно так же). «Некоторые A — B» равносильно «некоторые B — A», «ни один A не B» — «ни один B не A».', '“All A are B” does not mean “all B are A”, but it does give “some B are A”, provided group A is non-empty (the trainer states this; tests usually assume it). “Some A are B” equals “some B are A”, and “no A is B” equals “no B is A”.'],
          ['«Некоторые A не B» переворачивать нельзя.', '“Some A are not B” cannot be reversed.'],
          ['Отрицание «все A — B» — «некоторые A не B», а не «ни один A не B». Отрицание «некоторые A — B» — «ни один A не B».', 'The negation of “all A are B” is “some A are not B”, not “no A is B”. The negation of “some A are B” is “no A is B”.'],
          ['Вывод верен, только если его нельзя опровергнуть ни одним рисунком, совместимым с условиями. Нашли контрпример — вывод не обязателен.', 'A conclusion holds only if no drawing consistent with the premises refutes it. Found a counter-example? Then it is not certain.'],
          ['Не используйте знания о реальном мире: если в условии сказано «все месторождения шельфовые», так и считайте.', 'Do not use real-world knowledge: if the premise says all fields are offshore, accept it.'],
          ['Вариант «ни одно не следует» тоже бывает верным. Не бойтесь его выбирать.', '“None of these follows” can be the right answer. Do not be afraid to pick it.']
        ]],
        ['Правило «если — то»', '“If — then” rules', [
          ['Из «если А, то Б» и «А» следует «Б».', 'From “if A then B” and “A”, “B” follows.'],
          ['Из «если А, то Б» и «не Б» следует «не А».', 'From “if A then B” and “not B”, “not A” follows.'],
          ['Из «если А, то Б» и «Б» про А ничего не следует. Из «не А» ничего не следует про Б.', 'From “if A then B” and “B”, nothing follows about A. From “not A”, nothing follows about B.'],
          ['«А, только если Б» означает «если А, то Б».', '“A only if B” means “if A then B”.'],
          ['«А, если Б» означает «если Б, то А». «А, если не Б» (<i>A unless B</i>) означает «если не Б, то А».', '“A if B” means “if B then A”. “A unless B” means “if not B then A”.'],
          ['«Если А, то Б» равносильно «если не Б, то не А». Цепочки складываются: из «А → Б» и «Б → В» следует «А → В».', '“If A then B” is the same as “if not B then not A”. Chains combine: from A → B and B → C, A → C follows.'],
          ['«Ровно один из А и Б»: если А, то не Б, а если не А, то Б.', '“Exactly one of A and B”: if A then not B, and if not A then B.'],
          ['«А и Б не могут быть одновременно»: если А, то не Б, и если Б, то не А. Вариант «ни А, ни Б» не запрещён.', '“A and B cannot both happen”: if A then not B, and if B then not A. “Neither A nor B” is still allowed.'],
          ['«Хотя бы один из А и Б» означает «если не А, то Б» (и «если не Б, то А»).', '“At least one of A and B” means “if not A then B” (and “if not B then A”).'],
          ['Если факта в условии нет, переберите случаи по элементу, который чаще всего встречается в правилах: «да» и «нет». Два случая обычно быстро раскрывают остальные элементы.', 'If no fact is given, split into cases on the element that appears in the most rules: “yes” and “no”. Two cases usually settle the rest quickly.']
        ]]
      ]
    },
    verb: {
      intro: T('Проверяется точность чтения. Текст — единственный источник правды, даже если вы знаете отрасль лучше автора.', 'This tests careful reading. The passage is the only source of truth, even if you know the industry better than the author.'),
      blocks: [
        ['«Верно / Неверно / Нельзя сказать»: алгоритм', 'True / False / Cannot say: routine', [
          ['Сначала прочитайте утверждение и выделите ключевые слова: кто, что, сколько, когда, «все», «только», «уже».', 'Read the statement first and pick out the key words: who, what, how much, when, “all”, “only”, “already”.'],
          ['Найдите в тексте место, о котором идёт речь. Перечитывать весь текст не нужно.', 'Find the part of the passage it refers to. No need to re-read everything.'],
          ['Спросите себя: следует ли утверждение из текста — прямо, через перефразирование, простой расчёт или неизбежный вывод (Верно); противоречит ли ему текст — прямо или по тем же правилам (Неверно); или данных не хватает ни для того, ни для другого (Нельзя сказать)?', 'Ask: does the statement follow from the passage — directly, by paraphrase, simple calculation or necessary inference (True); does the passage rule it out, directly or in the same ways (False); or is there not enough information either way (Cannot say)?'],
          ['Сомневаетесь между «Неверно» и «Нельзя сказать» — спросите, может ли утверждение быть верным, если всё в тексте правда. Может — «Нельзя сказать». Не может — «Неверно».', 'Torn between False and Cannot say? Ask whether the statement could be true if everything in the passage is true. If it could — Cannot say. If it could not — False.']
        ], true],
        ['Слова-ловушки', 'Trap words', [
          ['«Все», «только», «всегда», «никогда», «ни один»: одно исключение в тексте делает утверждение неверным.', '“All”, “only”, “always”, “never”, “none”: one exception in the passage makes the statement false.'],
          ['«В основном» не равно «только».', '“Mainly” does not mean “only”.'],
          ['«Планирует», «ожидает», «рассматривает» не равно «сделал». Прогноз — не факт.', '“Plans”, “expects”, “is considering” do not mean “has done”. A forecast is not a fact.'],
          ['«После» не значит «из-за». Совпадение по времени ещё не причина.', '“After” does not mean “because of”. Timing alone is not a cause.'],
          ['«Аналитики считают», «руководство полагает» — это мнение, а не установленный факт. Если в тексте сказано, что руководство ожидает X, то «руководство ожидает X» — «Верно», а «X произойдёт» — «Нельзя сказать».', '“Analysts believe”, “management thinks” — that is an opinion, not an established fact. If the passage says management expects X, “Management expects X” is True; “X will happen” is Cannot say.'],
          ['Следите за сменой охвата: компания и отрасль, один регион и вся страна, «одна из крупнейших» и «крупнейшая», 2025 и 2026 годы.', 'Watch for scope shifts: company vs industry, one region vs the whole country, “one of the largest” vs “the largest”, 2025 vs 2026.'],
          ['Абсолютное утверждение («все», «всегда»), которому в тексте нет ни подтверждения, ни исключения, — обычно «Нельзя сказать», а не «Верно».', 'An absolute claim (“all”, “always”) with neither support nor an exception in the passage is usually Cannot say, not True.'],
          ['Расчёт допустим: если из цифр текста простым счётом выходит ответ, это «Верно» или «Неверно», а не «Нельзя сказать».', 'Calculation is allowed: if simple maths on the passage’s figures gives the answer, it is True or False, not Cannot say.']
        ]],
        ['Выбор одного или двух утверждений (Korn Ferry)', 'Choosing one or two statements (Korn Ferry)', [
          ['Оценивайте каждое утверждение отдельно, как мини-вопрос «Верно / Неверно / Нельзя сказать».', 'Judge each statement separately, like a mini True / False / Cannot say item.'],
          ['Отмечайте только утверждения, которые следуют из текста — прямо, через перефразирование, расчёт или неизбежный вывод.', 'Select only statements that follow from the passage — directly, by paraphrase, calculation or necessary inference.'],
          ['В вопросе сказано, сколько утверждений выбрать — одно или два. Выберите ровно столько и не больше.', 'The question says how many statements to choose — one or two. Choose exactly that many.'],
          ['Korn Ferry иногда задаёт вопрос в отрицательной форме: «какое утверждение НЕ следует из текста». Перечитайте вопрос перед ответом.', 'Korn Ferry sometimes asks negatively: “which statement does NOT follow”. Re-read the question before answering.']
        ]],
        ['Анализ текста (ЭКОПСИ)', 'Text analysis (Ecopsy)', [
          ['Читайте вопрос до текста — так сразу понятно, что искать: главную мысль, вывод, противоречие или допущение.', 'Read the question before the passage so you know what to look for: main idea, conclusion, contradiction or assumption.'],
          ['<b>Основная мысль</b> охватывает весь текст, а не одну деталь. Отбрасывайте крайности, подмену причины и следствия и то, чего в тексте нет.', '<b>Main idea</b> covers the whole passage, not one detail. Drop extremes, reversed cause and effect, and anything the passage lacks.'],
          ['<b>Вывод</b> должен быть верен при любом раскладе, который допускает текст. Правило «если А, то Б» нельзя переворачивать.', '<b>Conclusion</b> must hold in every situation the passage allows. “If A then B” cannot be reversed.'],
          ['<b>Противоречие</b> — прямой конфликт с фактом текста. Утверждение, о котором данных нет, тексту не противоречит.', '<b>Contradiction</b> is a direct clash with a fact. A statement with no data in the passage does not contradict it.'],
          ['<b>«Найдите противоречие» и «найдите, о чём нет данных»</b>: пометьте каждое из четырёх утверждений как В, Н или НС. Ответ — единственное утверждение с пометкой Н (противоречие) или НС (нет данных). Если таких получилось два, одно из них вы оценили по своим знаниям, а не по тексту: перепроверьте оба.', '<b>“Find the contradiction” and “find what the passage does not cover”</b>: mark each of the four statements T, F or CS. The answer is the only F (contradiction) or the only CS (not covered). If you end up with two, you judged one by your own knowledge rather than the passage: re-check both.'],
          ['<b>Допущение</b> — то, без чего вывод рушится. Проверка: возьмите отрицание варианта. Если аргумент перестаёт работать, это допущение.', '<b>Assumption</b> is what the argument needs. Test it by negating the option: if the argument collapses, that is the assumption.']
        ]],
        ['Усиление и ослабление аргумента', 'Strengthening and weakening an argument', [
          ['Найдите вывод — он часто стоит после слов «поэтому», «делает вывод», «считает» — и посылку, на которой он держится.', 'Find the conclusion — often after “so”, “concludes”, “argues” — and the premise it rests on.'],
          ['Определите тип аргумента. <b>Причина</b> («рост вызван новой технологией»): ослабляют другая причина или другое изменение в тот же период; подкрепляет сравнение с группой, где ничего не меняли.', 'Identify the type of argument. <b>Cause</b> (“growth was caused by the new technology”): another cause or another change in the same period weakens it; a comparison with a group where nothing changed strengthens it.'],
          ['<b>Обобщение по выборке</b> («90% опрошенных довольны, значит, это подойдёт всем»): ослабляют нерепрезентативная выборка и самоотбор участников; подкрепляют широкий охват и случайный отбор.', '<b>Generalising from a sample</b> (“90% of those surveyed are happy, so it suits everyone”): an unrepresentative sample or self-selection weakens it; wide coverage and random selection strengthen it.'],
          ['<b>План или прогноз</b> («окупится за три года», «маржа вырастет»): ослабляет то, что ключевое условие не сохранится (цена, тариф, срок службы); подкрепляют фактические результаты пилота и подтверждение, что условия сохранятся.', '<b>Plan or forecast</b> (“it will pay back in three years”, “margins will rise”): it is weakened if a key condition will not hold (price, tariff, service life); pilot results and evidence that conditions will persist strengthen it.'],
          ['Не влияют: мотивы автора, затраты, если вывод не о затратах, и сведения о других компаниях без сравнения. Из двух подходящих вариантов сильнее тот, что бьёт прямо по связи посылки с выводом.', 'Irrelevant: the author’s motives, cost when the conclusion is not about cost, and facts about other companies with no comparison. Of two plausible options, the stronger one hits the link between premise and conclusion directly.']
        ], true],
        ['Критическое мышление (Watson-Glaser)', 'Critical thinking (Watson-Glaser)', [
          ['<b>Выводы.</b> Пять ответов: верно, скорее верно, недостаточно данных, скорее неверно, неверно. «Верно» и «Неверно» — только когда факты не оставляют сомнений. «Скорее…» — когда текст делает вывод вероятнее или менее вероятным. «Недостаточно данных» — когда текст вопроса вообще не касается.', '<b>Inference.</b> Five answers: true, probably true, insufficient data, probably false, false. Use true and false only when the facts leave no doubt; “probably” when the passage makes the inference more or less likely; insufficient data when the passage does not touch the point.'],
          ['<b>Допущения.</b> Проверка: если допущение неверно, рассуждение разваливается? Тогда оно сделано. Утверждения «сильнее», чем нужно автору («так же эффективно», «все»), обычно не сделаны.', '<b>Assumptions.</b> Test: if the assumption were false, would the argument collapse? Then it is made. Stronger claims than the author needs (“just as effective”, “all”) are usually not made.'],
          ['<b>Дедукция.</b> Принимайте посылки как есть, даже абсурдные, и не добавляйте знаний о мире. «Некоторые» не значит «не все»; «ни один из A не B» не значит, что все не-A — это B.', '<b>Deduction.</b> Accept the premises as given, even if absurd, and add no outside knowledge. “Some” does not mean “not all”; “no A is B” does not make every non-A a B.'],
          ['<b>Интерпретация.</b> Мягче дедукции: вывод должен следовать вне разумных сомнений. Средние значения не говорят о каждом случае; «устранит», «всегда», «каждый» — признаки чрезмерного обобщения.', '<b>Interpretation.</b> Less strict than deduction: the conclusion must follow beyond reasonable doubt. Averages say nothing about every case; “eliminate”, “always”, “every” signal over-generalisation.'],
          ['<b>Аргументы.</b> Не важно, согласны ли вы. Сильный аргумент важен и прямо касается вопроса; ссылки на то, как делают другие, на популярность, личные вкусы и мелочи — слабые. Считайте аргумент верным, даже если сомневаетесь в факте.', '<b>Arguments.</b> Your own view does not matter. A strong argument is important and directly about the question; appeals to what others do, popularity, personal taste or trivia are weak. Treat the argument as true even if you doubt the fact.'],
          ['Время: 40 вопросов за 30 минут — около 45 секунд на ответ. Разделы идут по порядку; правило раздела прочитайте один раз внимательно и дальше применяйте его без перечитывания.', 'Time: 40 items in 30 minutes — about 45 seconds each. Sections come in order; read each section’s rule carefully once, then apply it without rereading.']
        ]],
        ['Если тест на английском', 'If the test is in English', [
          ['Полезные слова: <i>cannot say</i> — нельзя сказать; <i>respectively</i> — соответственно; <i>at least / at most</i> — не менее / не более; <i>unless</i> — если не; <i>mainly</i> — в основном; <i>rose by / rose to</i> — выросла на / выросла до; <i>no more than</i> — не более; <i>provided that</i> — при условии, что; <i>one of the</i> — один из.', 'Useful words: <i>respectively</i>, <i>at least / at most</i>, <i>unless</i>, <i>mainly</i>, <i>rose by</i> vs <i>rose to</i>, <i>no more than</i>, <i>provided that</i>, <i>one of the</i> — read them literally.'],
          ['Не переводите весь текст в голове: ищите в нём ключевые слова утверждения.', 'Do not translate the whole passage in your head: look for the statement’s key words.'],
          ['Модальные слова <i>may</i>, <i>could</i>, <i>is expected to</i> обозначают возможность, а не факт.', 'Modal words like <i>may</i>, <i>could</i>, <i>is expected to</i> signal possibility, not fact.']
        ]]
      ]
    },
    use: {
      intro: T('Задания создаются заново при каждом запуске, поэтому тренироваться можно сколько угодно, не заучивая ответы. Ниже — чем отличаются уровни, режимы и как читать статистику.', 'Items are generated afresh every time, so you can practise as much as you like without memorising answers. Below: how the levels and modes differ, and how to read your progress.'),
      blocks: [
        ['Уровни сложности: что меняется', 'Difficulty levels: what changes', [
          ['<b>Общий принцип.</b> Базовый уровень — знакомство с форматом. Senior — уровень реального теста для руководителя. Эксперт — с запасом: если уверенно решаете его, реальный тест покажется спокойнее.', '<b>The idea.</b> Base is for learning the format. Senior matches a real test for a manager. Expert adds a margin: if you handle it, the real test will feel calmer.'],
          ['<b>Абстрактный.</b> На базовом уровне 2 правила, и иногда ответ виден уже по части из них. На Senior и эксперте правил 3–4, у каждого правила есть «свой» неверный вариант, поэтому нужны все правила; добавляются отвлекающие элементы, цепочки, правила по столбцам и «по одному разу в строке и столбце».', '<b>Abstract.</b> Base has 2 rules, and sometimes part of them is enough. At Senior and Expert there are 3–4 rules, each with its own wrong option, so you need them all; distractor elements, chains, column rules and “once per row and column” are added.'],
          ['<b>Числовой.</b> Базовый — расчёт в один шаг, варианты заметно различаются. Senior — около трети задач в два шага, в каждой не меньше двух вариантов-ловушек, варианты ближе друг к другу. Эксперт — около 70% задач составные, варианты часто в 1–5% друг от друга: прикидки не хватает.', '<b>Numerical.</b> Base: one-step sums, options clearly apart. Senior: about a third of items take two steps, every item has at least two trap options, options sit closer. Expert: about 70% of items are multi-step and options are often 1–5% apart, so estimating is not enough.'],
          ['<b>Дедуктивный.</b> Базовый — до двух прямых подсказок о позициях, в выводах только «все» и «ни один». Эксперт — прямых подсказок нет, условий больше, в выводах встречаются «некоторые» и «некоторые… не».', '<b>Deductive.</b> Base: up to two direct position clues, and only “all” and “no” in syllogisms. Expert: no direct clues, more conditions, and “some” and “some … not” appear.'],
          ['<b>Вербальный.</b> Доля ответов «Нельзя сказать» — самых трудных — около 15% на базовом уровне, 28% на Senior и 38% на эксперте. Длинные тексты — только с Senior.', '<b>Verbal.</b> The share of “Cannot say” answers, the hardest ones, is about 15% at Base, 28% at Senior and 38% at Expert. Long passages start at Senior.'],
          ['<b>Игровые форматы.</b> С уровнем растут размер фигур и число операций: в кодах перестановки сначала один переключатель, потом цепочка из двух; в поворотах узора на эксперте добавляется отражение.', '<b>Game-based.</b> Size and number of operations grow with level: switch codes go from one switch to a chain of two; pattern turns add a mirror step at Expert.'],
          ['<b>Watson-Glaser.</b> Уровень пока не влияет: задания берутся из общего банка.', '<b>Watson-Glaser.</b> The level has no effect yet: items come from one bank.']
        ]],
        ['Тренировка и экзамен', 'Practice and exams', [
          ['<b>Тренировка.</b> Без ограничения времени, можно выбрать нужные типы заданий. После каждого ответа — разбор: правило и почему неверен каждый вариант.', '<b>Practice.</b> No time limit, and you choose the question types. After every answer you see the rule and why each wrong option is wrong.'],
          ['<b>Экзамен.</b> Число вопросов, таймер и порядок — как у провайдера: общий таймер у SHL и Watson-Glaser, свой таймер на вопрос у Korn Ferry, ЭКОПСИ и игровых тестов. Там, где реальный тест адаптивный, сложность в тренажёре тоже меняется по ответам. Итог и разбор ошибок — в конце.', '<b>Exam.</b> Item count, timer and order follow the provider: one timer for SHL and Watson-Glaser, a timer per item for Korn Ferry, Ecopsy and the game-based tests. Where the real test is adaptive, difficulty here also follows your answers. Score and review come at the end.'],
          ['<b>Частичные баллы.</b> В интерактивных заданиях SHL (рассадка, расписание, графики) частично верный ответ даёт часть балла, как в реальном тесте.', '<b>Partial credit.</b> In SHL interactive items (rooms, schedules, charts) a partly right answer earns part of the point, as in the real test.']
        ]],
        ['Когда переходить на следующий уровень', 'When to move up a level', [
          ['Начните с базового уровня в каждом модуле, если формат новый, и с Senior — если уже знакомы с ним.', 'Start at Base in each module if the format is new to you, and at Senior if you know it.'],
          ['Переходите выше, когда два подряд захода по 20 вопросов дают 80% и больше и вы укладываетесь в темп реального теста (раздел «Время и день теста»).', 'Move up when two 20-item sessions in a row reach 80% or more and you keep to the real test’s pace (see “Timing and test day”).'],
          ['Если на новом уровне результат ниже 50%, вернитесь на предыдущий и потренируйте слабые типы заданий.', 'If you score under 50% at the new level, step back and drill your weak question types.']
        ], true],
        ['Статистика', 'Progress', [
          ['Во вкладке «Статистика» видно, какие типы заданий получаются хуже всего. Нажмите на тип — откроется тренировка только по нему.', 'The Progress tab shows which question types go worst. Tap a type to practise only that type.'],
          ['Процент верных в тренажёре — не процентиль реального теста: там результат сравнивают с группой других кандидатов (см. «Форматы тестов → Как оценивается результат»). Используйте тренажёр, чтобы видеть рост и слабые места.', 'Your percentage here is not a real test percentile: there your score is compared with other candidates (see “Test formats → How results are scored”). Use the trainer to track progress and weak spots.']
        ]]
      ]
    },
    time: {
      intro: T('Результат зависит не только от логики, но и от темпа. Ниже — расчёт времени на вопрос по открытым данным о форматах и практические правила.', 'Results depend on pace as well as logic. Below are per-item timings based on published formats, plus practical rules.'),
      blocks: [
        ['Время на вопрос', 'Time per item', [
          ['SHL Verify Interactive: индуктивный — около 72 с (18 мин ÷ 15), числовой — около 108 с (18 мин ÷ 10), дедуктивный — около 90 с (18 мин ÷ 12).', 'SHL Verify Interactive: inductive about 72 s (18 min ÷ 15), numerical about 108 s (18 min ÷ 10), deductive about 90 s (18 min ÷ 12).'],
          ['SHL Verbal — около 38 секунд на утверждение (19 мин ÷ 30). Это самый быстрый темп.', 'SHL Verbal — about 38 seconds per statement (19 min ÷ 30). This is the fastest pace.'],
          ['SHL Verify G+ — около 90 секунд на вопрос (36 мин ÷ 24).', 'SHL Verify G+ — about 90 seconds per item (36 min ÷ 24).'],
          ['Korn Ferry Elements — отдельный таймер на каждый вопрос: 60–90 секунд. Больше всего времени даётся на первый вопрос к новой таблице или тексту — потратьте его на то, чтобы разобраться в данных: следующие вопросы будут по ним же.', 'Korn Ferry Elements — a separate timer on every item: 60–90 seconds. The first question on a new table or passage gets the most time — use it to understand the data, because the next questions use the same data.'],
          ['ЭКОПСИ Switch (по неофициальным данным) — до 45 секунд на лёгкие задания, до 60 на средние и до 90 на сложные. В версии для менеджеров — около 90 секунд на большую таблицу.', 'Ecopsy Switch (unofficial data) — up to 45 seconds for easy items, up to 60 for medium and up to 90 for hard ones. In the manager version, about 90 seconds per large table.'],
          ['Korn Ferry KFALP (матрицы Равена) — около 23 заданий примерно за 40 минут, то есть около 105 секунд на задание; к концу задания сложнее.', 'Korn Ferry KFALP (Raven’s matrices) — about 23 items in about 40 minutes, i.e. about 105 seconds each; items get harder towards the end.'],
          ['Watson-Glaser III — 40 вопросов за 30 минут, около 45 секунд на ответ, таймер общий.', 'Watson-Glaser III — 40 items in 30 minutes, about 45 seconds each, one overall timer.'],
          ['Игровые тесты (Aon, Cognify) — раунды по 20–60 секунд; считаются и скорость, и точность.', 'Game-based tests (Aon, Cognify) — rounds of 20–60 seconds; speed and accuracy both count.']
        ]],
        ['Тактика по провайдерам', 'Tactics by provider', [
          ['Почти во всех онлайн-тестах вопросы идут по одному: пропустить вопрос и вернуться к нему позже обычно нельзя. Тактика «сначала лёгкие, потом трудные» здесь не работает.', 'In almost all online tests items come one at a time: you usually cannot skip an item and come back to it. “Easy ones first, hard ones later” does not work here.'],
          ['SHL: таймер общий. Знайте средний темп своего теста (индуктивный ≈72 с, дедуктивный ≈90 с, числовой ≈108 с, вербальный ≈38 с) и не тратьте на один вопрос больше полуторной нормы — дайте лучший ответ и двигайтесь дальше.', 'SHL: one overall timer. Know your test’s average pace (inductive ≈72 s, deductive ≈90 s, numerical ≈108 s, verbal ≈38 s) and spend no more than about 1.5 times that on one item — give your best answer and move on.'],
          ['SHL Interactive: по описанию SHL, интерактивные задания оцениваются по нескольким баллам, и частично верная рассадка или расстановка приносит часть балла (в тренажёре так же). Но введённое число либо верно, либо нет. Оставляйте 15–20 секунд, чтобы пройтись по каждому условию перед отправкой.', 'SHL Interactive: per SHL, interactive items use multi-point scoring, so a partly correct allocation or ranking earns partial credit (the trainer does the same). A typed number, though, is simply right or wrong. Keep 15–20 seconds to run through every condition before submitting.'],
          ['SHL: за неверный ответ обычно не штрафуют (проверьте инструкцию), поэтому пустые вопросы невыгодны. Если время кончается, дайте лучший ответ на текущий вопрос, а не оставляйте его пустым.', 'SHL: wrong answers are usually not penalised (check the instructions), so blanks cost you. If time is running out, give your best answer to the current item rather than leave it blank.'],
          ['Korn Ferry: остаток времени не переносится на следующий вопрос. Решили — переходите, но не жертвуйте точностью ради скорости: сэкономленное время не пригодится.', 'Korn Ferry: unused time does not carry over. Once solved, move on, but do not trade accuracy for speed — saved time is lost anyway.'],
          ['Korn Ferry: выберите предварительный ответ, как только он у вас появится, и уточняйте его, пока идёт время. Если таймер истечёт, выбранный ответ засчитается; без ответа балла не будет, а следующий вопрос станет проще.', 'Korn Ferry: pick a provisional answer as soon as you have one and refine it while time remains. If the timer runs out, the selected answer is submitted; a blank scores nothing and the next item gets easier.'],
          ['Korn Ferry адаптивный: если вопросы стали труднее, это хороший знак.', 'Korn Ferry is adaptive: if items get harder, that is a good sign.'],
          ['KFALP: время общее, а задания к концу труднее. Первые решайте быстро, но без ошибок — после ошибки уровень не растёт. Пустой ответ хуже предположения.', 'KFALP: one overall timer and harder items at the end. Solve the early ones quickly but accurately — after a mistake the level does not rise. A blank is worse than a guess.'],
          ['Watson-Glaser: правило раздела прочитайте один раз внимательно — дальше оно одинаково для всех вопросов раздела. Не тратьте больше минуты на одно утверждение: вопросов 40, а время общее.', 'Watson-Glaser: read each section’s rule carefully once — it is the same for every item in the section. Spend no more than a minute on one statement: there are 40 items on one timer.'],
          ['Игровые тесты: пройдите обучающие раунды — они не оцениваются. Ошибочный клик стоит баллов, поэтому темп держите ровный, а не максимальный. В заданиях «отметьте все верные» засчитывается каждый верный вариант, а лишняя отметка снижает результат.', 'Game-based tests: do the tutorial rounds — they are not scored. A wrong click costs points, so keep a steady pace rather than a frantic one. In “tick every correct one” rounds each right option counts and a wrong tick lowers the score.'],
          ['ЭКОПСИ Switch: у каждого задания свой лимит. В числовом и вербальном тестах первые задания простые и короткие по времени (до 45 с) — решайте их быстро и без ошибок; на последних трёх сложных времени больше (до 90 с). Абстрактно-логический тест адаптивный.', 'Ecopsy Switch: every item has its own limit. In numerical and verbal the first items are easy and short (up to 45 s) — solve them quickly and accurately; the last three hard items get more time (up to 90 s). The abstract test is adaptive.']
        ]],
        ['Перед тестом', 'Before the test', [
          ['Узнайте точное название теста из приглашения (Verify Numerical, Elements Logical и т. п.) и тренируйте именно этот формат.', 'Find the exact test name in the invitation (Verify Numerical, Elements Logical, etc.) and practise that format.'],
          ['Пройдите демо-вопросы перед стартом: это бесплатное время, чтобы привыкнуть к интерфейсу.', 'Do the demo items before starting: it is free time to get used to the interface.'],
          ['Ноутбук лучше телефона: таблицы и графики читать удобнее. Игровые тесты вроде Cognify можно проходить с любого устройства, но перетаскивать фигуры удобнее мышью.', 'A laptop beats a phone: tables and charts are easier to read. Game-based tests such as Cognify run on any device, but dragging shapes is easier with a mouse.'],
          ['Подготовьте стабильный интернет, зарядку и тихое место: 30–60 минут на один тест, до 2–3 часов на комплексную оценку вроде ЭКОПСИ Potential in Focus. Выключите уведомления: внутри блока перерыв сделать нельзя, таймер продолжает идти.', 'Arrange a stable connection, a charger and a quiet place: 30–60 minutes for one test, up to 2–3 hours for a full battery such as Ecopsy Potential in Focus. Turn off notifications: you cannot pause within a block and the timer keeps running.'],
          ['Держите под рукой обычный калькулятор, бумагу и ручку. Калькулятор в телефоне хуже: тест может идти на том же телефоне, а переключение между окнами отнимает время. Для Elements Numerical калькулятор нужен — возьмите свой.', 'Keep a physical calculator, paper and a pen at hand. A phone app is worse: the test may run on that same phone, and switching windows costs time. Elements Numerical needs a calculator — bring your own.'],
          ['Проходите тест сами: работодатель может попросить пройти короткий проверочный тест под наблюдением на следующем этапе, и большой разрыв с онлайн-результатом будет заметен.', 'Take the test yourself: an employer may ask you to sit a short supervised check at a later stage, and a big gap from your online score shows up.'],
          ['SHL Verify Interactive доступен на английском и нескольких европейских языках, но не на русском; в России его обычно проходят на английском. ЭКОПСИ и Korn Ferry предлагают русскую версию. У Watson-Glaser русской и арабской версий нет. Для работодателей в странах Персидского залива готовьтесь проходить тесты на английском: переключите тренажёр на EN хотя бы на последние дни.', 'SHL Verify Interactive is offered in English and several European languages but not Russian; in Russia it is usually taken in English. Ecopsy and Korn Ferry offer Russian versions. Watson-Glaser has no Russian or Arabic version. For Gulf employers, expect to take tests in English: switch the trainer to EN at least for the last few days.'],
          ['Лучше проходить на свежую голову, а не вечером после тяжёлого дня.', 'Take it when you are fresh, not late after a long day.']
        ]],
        ['План подготовки на 1–2 недели', 'A 1–2 week preparation plan', [
          ['Дни 1–3: по 20 вопросов в каждом модуле — базовый уровень для новых форматов, Senior для знакомых. Читайте разбор каждой ошибки. Переходите на уровень выше по правилу из раздела «Как пользоваться».', 'Days 1–3: 20 items per module — Base for new formats, Senior for familiar ones. Read the breakdown of every mistake. Move up a level by the rule in “How to use it”.'],
          ['Дни 4–7: откройте «Статистику» и тренируйте два самых слабых типа заданий точечно, на уровне Senior и эксперт.', 'Days 4–7: open Progress and drill your two weakest question types at Senior and Expert.'],
          ['Если в приглашении Watson-Glaser или игровые тесты, добавьте их с 4-го дня: по одному заходу в день. Watson-Glaser тренируйте на английском.', 'If your invitation mentions Watson-Glaser or game-based tests, add them from day 4: one session a day. Practise Watson-Glaser in English.'],
          ['Дни 8–10: экзамены в формате провайдера из приглашения, один-два в день. Если ждёте ЭКОПСИ для руководящей позиции, пройдите блок Potential in Focus.', 'Days 8–10: exams in the provider’s format from your invitation, one or two a day. If you expect Ecopsy for a management role, take the Potential in Focus block.'],
          ['Последний день: один лёгкий прогон без марафона. Отдых важнее.', 'Final day: one light run, no marathon. Rest matters more.']
        ], true]
      ]
    }
  };
  function guideTab() {
    var sec = S.guideSec || 'use';
    var h = '<div class="chips" style="margin-bottom:16px">' + GSECS.map(function (g) { return '<button class="chip" data-act="gsec" data-v="' + g[0] + '" aria-pressed="' + (sec === g[0]) + '">' + esc(tr(g[1])) + '</button>'; }).join('') + '</div>';
    if (sec === 'formats') return h + formatsHtml();
    var G = GUIDE[sec], ru = S.lang === 'ru';
    h += '<p class="sum-tip" style="max-width:72ch;margin:0 0 14px">' + esc(tr(G.intro)) + '</p>';
    G.blocks.forEach(function (b) {
      var tag = b[3] ? 'ol' : 'ul';
      h += '<div class="panel guide"><h2>' + esc(ru ? b[0] : b[1]) + '</h2><' + tag + '>' + b[2].map(function (it) { return '<li>' + (ru ? it[0] : it[1]) + '</li>'; }).join('') + '</' + tag + '></div>';
    });
    return h;
  }
  function formatsHtml() {
    var ru = S.lang === 'ru';
    var g = function (title, items, src) { return '<div class="panel guide"><h2>' + esc(title) + '</h2><ul>' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' + (src ? '<p class="src">' + src + '</p>' : '') + '</div>'; };
    var a = function (href, t) { return '<a href="' + href + '" target="_blank" rel="noopener">' + esc(t) + '</a>'; };
    var SRC = ru ? 'Источники: ' : 'Sources: ', RUS = ru ? '' : ' (in Russian)';
    var h = '';
    h += g(ru ? 'Как оценивается результат' : 'How results are scored', ru ? [
      'Работодатель обычно видит не число верных ответов, а процентиль: какую долю нормативной группы вы опередили. 70-й процентиль значит, что результат выше, чем у 70% группы.',
      'Нормативную группу подбирают под роль: кандидатов на позиции выпускников сравнивают с выпускниками, на руководящие — с менеджерами. Поэтому один и тот же сырой балл может дать разный процентиль в зависимости от того, с кем вас сравнивают.',
      'Единого проходного балла нет: порог задаёт работодатель, и обычно его не публикуют. Он зависит от роли и конкуренции.',
      'В адаптивных тестах результат учитывает и сложность заданий, на которые вы ответили, а не только их число. За неверный ответ в тестах способностей обычно не штрафуют — пустой ответ невыгоден.',
      'Отчёт обычно получает работодатель, а не кандидат; увидите ли вы результат, зависит от компании.',
      'Процент верных в тренажёре нельзя напрямую перевести в процентиль: он показывает ваш рост и слабые места, а не место среди других кандидатов.'
    ] : [
      'Employers usually see a percentile rather than a count of correct answers: the share of the comparison group you outscored. The 70th percentile means you beat 70% of the group.',
      'The comparison group is matched to the role: graduate roles are compared with graduates, management roles with managers. So the same raw score can give a different percentile depending on who you are compared with.',
      'There is no single pass mark: the employer sets the cut-off and rarely publishes it. It depends on the role and the competition.',
      'In adaptive tests the score also reflects the difficulty of the items you answered, not only their number. Ability tests usually do not penalise wrong answers, so blanks cost you.',
      'The report usually goes to the employer, not to you; whether you see your result depends on the company.',
      'Your percentage in the trainer cannot be turned into a percentile: it shows progress and weak spots, not your place among other candidates.'
    ], SRC + [
      a('https://www.practiceaptitudetests.com/resources/shl-test-results/', 'Practice Aptitude Tests — SHL results'),
      a('https://www.talentlens.com/content/dam/school/global/Global-Talentlens/uk/Assessments/WGCTA/WG3_Profile-Report-Sample_-UK.pdf', 'TalentLens — WG III report sample')
    ].join(' · '));
    h += g(ru ? 'Что ещё бывает в оценке, кроме тестов способностей' : 'What else the assessment may include', ru ? [
