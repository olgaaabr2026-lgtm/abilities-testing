<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр тестов способностей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark instrument header band over a cool "test-booklet" paper; one centred working column; progress drawn as a segmented log track. Single light theme by request. */
:root{
  --paper:#F1F4F6; --surface:#FFFFFF; --ink:#15212B; --ink-2:#2B3A47; --muted:#5A6874; --line:#D5DDE3; --line-2:#E6EBEF;
  --accent:#E0552A; --accent-ink:#B5401B; --accent-soft:#FCEBE4;
  --steel:#245B7E; --steel-soft:#E4EEF5;
  --ok:#1D7A4F; --ok-soft:#E2F2E9; --bad:#BC3434; --bad-soft:#FAE6E5; --warn:#A86A12;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--steel);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--ink);color:#E8EEF2;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 34px)}
.band .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;display:block;line-height:1.2}
.brand span{font-size:12px;color:#9FB0BD;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;color:#B8C6D0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-current="true"]{color:#fff;background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid #3A4B59;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#B8C6D0;padding:6px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:34px 18px}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.hero-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero-fig .series{justify-content:center}
.hero-fig .series .fig{width:min(64px,15%)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.provs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.prov{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:var(--surface)}

/* settings */
.section{padding-block:12px 40px}
.settings{display:flex;gap:18px 28px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.settings .hint{font-size:13px;color:var(--muted);flex:1 1 220px;min-width:0}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.mod-art{height:112px;background:linear-gradient(180deg,#F7F9FA,#EEF2F5);border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;padding:12px}
.mod-art svg{height:100%;width:auto;max-width:100%}
.mod-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0;letter-spacing:.005em}
.mod p{margin:0;color:var(--ink-2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--steel);font-weight:500}
.mod-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.mod-stat{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-primary:disabled{background:#E7B9A8;cursor:not-allowed}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:7px 12px;font-size:13.5px}

/* exam list */
.note-box{background:var(--steel-soft);border:1px solid #C9DCE9;border-radius:var(--r);padding:12px 14px;font-size:14px;color:#1C4561;margin-bottom:18px}
.prov-group{margin-bottom:22px}
.prov-group h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.prov-group>p{margin:0 0 10px;color:var(--muted);font-size:14px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.row-main{flex:1 1 260px;min-width:0}
.row-main b{display:block;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2)}
.tag.hot{background:var(--accent-soft);border-color:#F3C9B8;color:var(--accent-ink)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.sbar-title{font-weight:600;font-size:14px;min-width:0;flex:1 1 180px}
.sbar-title small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.warn{color:#fff;background:var(--accent);border-color:var(--accent)}
.timer small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.timer.warn small{color:#FFE3D8}
.track{display:flex;gap:3px;flex:2 1 260px;min-width:0;align-items:center}
.track i{flex:1;height:8px;border-radius:2px;background:var(--line-2);display:block;min-width:3px}
.track i.on{background:var(--ink)}
.track i.ok{background:var(--ok)}
.track i.bad{background:var(--bad)}
.track i.cur{background:var(--accent);height:12px}
.qwrap{max-width:900px;margin:0 auto;padding-block:22px 60px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-family:var(--mono);font-size:13px;color:var(--muted)}
.qtype{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);background:var(--steel-soft);padding:3px 9px;border-radius:6px}
.lvl{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted)}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--ink-2)}
.prompt{font-size:18px;font-weight:600;margin:4px 0 16px;text-wrap:balance;line-height:1.4}
.visual{margin-bottom:18px}
.series{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.series .fig{width:min(88px,15.2%);height:auto;flex:none}
.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,104px));gap:6px;justify-content:center;background:var(--paper);padding:10px;border-radius:12px;width:max-content;max-width:100%;margin:0 auto}
.matrix .fig{width:100%;height:auto;display:block}
.fig{display:block}
.opts{display:grid;gap:10px}
.opts.figs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.opts.txt{grid-template-columns:1fr}
.opts.short{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;position:relative;transition:border-color .12s, background-color .12s}
.opt:hover:not(:disabled){border-color:#9FB2C1;background:#FAFCFD}
.opt .ol{font-family:var(--mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt .ot{min-width:0;padding-top:1px}
.opts.figs .opt{flex-direction:column;align-items:center;padding:8px}
.opts.figs .opt .fig{width:100%;max-width:132px;height:auto}
.opt.multi .ol{border-radius:5px}
.opt.sel{border-color:var(--steel);background:var(--steel-soft)}
.opt.sel .ol{background:var(--steel);color:#fff;border-color:var(--steel)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ol{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qact{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--sbarH, 60px));z-index:4;background:var(--surface);margin:14px -22px 0;padding:10px 22px}
.qact.rev{border-bottom:1px solid var(--line-2);box-shadow:0 6px 10px -10px rgba(21,33,43,.35)}
.actions .spacer{flex:1}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.passage{background:#FAFBFC;border:1px solid var(--line-2);border-left:3px solid var(--ink);border-radius:8px;padding:14px 16px}
.passage h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.passage p{margin:0;max-width:72ch}
.statement{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--steel-soft);font-weight:600;color:#14384F}
.statement .lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--steel);margin-bottom:2px}
.logic p{margin:0 0 8px}
.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.clues li{padding-left:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px}
.dt{border-collapse:collapse;width:100%;font-size:14px}
.dt caption{caption-side:top;text-align:left;font-weight:600;padding:10px 12px 8px;font-size:13.5px}
.dt th,.dt td{padding:7px 12px;border-top:1px solid var(--line-2);white-space:nowrap}
.dt thead th{background:var(--paper);font-weight:600;font-size:12.5px;color:var(--ink-2);text-align:left}
.dt .r{text-align:right}
.dt tbody th{text-align:left;font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.cap{font-weight:600;font-size:13.5px;margin:0 0 6px}
.chart-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px;padding:6px 4px 0;background:#fff}
.chart{width:100%;min-width:480px;height:auto;display:block}

/* feedback */
.fb{margin-top:18px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.fb-head{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.fb.good .fb-head{background:var(--ok-soft)}
.fb.wrong .fb-head{background:var(--bad-soft)}
.verdict{font-family:var(--display);font-weight:600;font-size:16px}
.fb.good .verdict{color:var(--ok)}
.fb.wrong .verdict{color:var(--bad)}
.fb-head .ans{font-size:14px;color:var(--ink-2)}
.fb-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.fb-body h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rules{margin:4px 0 0;padding-left:20px}
.rules li+li{margin-top:3px}
.calc{font-family:var(--mono);font-size:14px;background:var(--paper);padding:8px 10px;border-radius:7px;margin:4px 0 0;overflow-x:auto}
.sol-order{margin:4px 0 0;padding-left:24px;display:flex;flex-wrap:wrap;gap:4px 26px}
.notes{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.notes li{display:flex;gap:10px;font-size:14px;padding:5px 8px;border-radius:7px}
.notes li b{font-family:var(--mono);flex:none;width:18px}
.notes.traps li b{width:auto;min-width:76px;white-space:nowrap}
.dt.wrap th,.dt.wrap td{white-space:normal}
.notes li.mine{background:var(--bad-soft)}
.notes li.right{background:var(--ok-soft)}
.tip{font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;color:#5E2510}
.tip b{color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(21,33,43,.25)}

/* results */
.res-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;margin-bottom:18px}
.score{background:var(--ink);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden}
.score .big{font-family:var(--display);font-weight:600;font-size:56px;line-height:1;margin:10px 0 6px;letter-spacing:-.02em}
.score .big small{font-size:22px;color:#9FB0BD}
.score .band-lbl{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:var(--accent);font-size:13px;font-weight:600}
.score .eyebrow{color:#9FB0BD}
.score p{margin:10px 0 0;color:#C9D4DC;font-size:13px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kv h3,.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar-row.wbtn{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto}
.bar-row .lb{min-width:0;overflow-wrap:break-word;hyphens:auto}
.bar-row .meter{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-row .meter i{display:block;height:100%;border-radius:4px;background:var(--steel)}
.bar-row .meter i.lo{background:var(--bad)}
.bar-row .meter i.mid{background:var(--warn)}
.bar-row .meter i.hi{background:var(--ok)}
.bar-row .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink-2);white-space:nowrap;min-width:44px}
.rv-empty{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:14px}
.qcard:focus{outline:none}
.qwrap{scroll-margin-top:96px}
.facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.review summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px}
.review summary::-webkit-details-marker{display:none}
.review summary .mk{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.mk.y{background:var(--ok)} .mk.n{background:var(--bad)} .mk.s{background:#9AA7B2} .mk.p{background:#D9A23B}
.review summary .st{min-width:0;flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review summary .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.review .rv{padding:0 14px 16px;border-top:1px solid var(--line-2)}
.review .rv .qcard{border:0;padding:14px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:8px 6px;border-top:1px solid var(--line-2);text-align:left;white-space:nowrap}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist .r{text-align:right;font-family:var(--mono)}
.guide h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 8px}
.guide ul,.guide ol{margin:6px 0 0;padding-left:22px;max-width:80ch}
.guide li+li{margin-top:6px}
.guide li::marker{color:var(--accent);font-weight:600}
.guide .src{font-size:13px;color:var(--muted)}
.guide a{color:var(--steel)}
.sum-tip{font-size:14px;color:var(--ink-2)}
.ibars svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ibars .hit{cursor:ns-resize}
.barctl{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.barctl .bc{display:flex;align-items:center;gap:6px;font-size:13px}
.barctl .bc span{min-width:44px;font-weight:600}
.barctl button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font:600 16px var(--mono);cursor:pointer;color:var(--ink)}

.code{letter-spacing:.08em;font-weight:600}

.pie-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;padding:12px;background:#fff}

.cal-wrap{overflow-x:auto}

  P('ru', 'Инвестиционный комитет', 'В компании «Полярная нефть» каждый проект стоимостью свыше 50 млн долларов проходит через инвестиционный комитет. Комитет одобряет проект, если его внутренняя норма доходности (IRR) в базовом сценарии превышает 15% и проект остаётся безубыточным при цене нефти 45 долларов за баррель. В 2025 году комитет рассмотрел 14 проектов, одобрил 9 из них, остальные отклонил. Два из отклонённых проектов превысили порог по IRR, но не выдержали стресс-теста по цене. Проекты стоимостью до 50 млн долларов финансовый директор утверждает единолично.', [

  P('ru', 'Вахтовый график', 'Добывающее предприятие «Тундра-Ойл» работает вахтовым методом: вахта длится 28 дней, после чего следуют 28 дней междувахтового отдыха. В 2024 году компания перевела часть инженерно-технического персонала на график 14/14, оставив производственный персонал на прежнем графике. По данным внутреннего опроса, удовлетворённость графиком среди инженеров выросла, однако текучесть кадров в этой группе не изменилась. Компания планирует распространить график 14/14 на операторов, если транспортные расходы вырастут не более чем на 10%.', [

  P('ru', 'Попутный газ', 'По итогам 2025 года уровень полезного использования попутного нефтяного газа (ПНГ) на месторождениях «Восток-Нефти» составил 93% против 88% годом ранее. Рост обеспечен вводом газотурбинной электростанции на Кедровом месторождении, которая покрывает его собственные потребности в электроэнергии. На двух удалённых месторождениях газ по-прежнему частично сжигается на факелах, поскольку строительство газопровода туда признано нерентабельным. Компания рассматривает закачку газа в пласт как альтернативу, но окончательное решение пока не принято.', [

  P('ru', 'Проект СПГ', 'Проект «Белый Мыс» по производству сжиженного природного газа мощностью 6 млн тонн в год законтрактовал 80% проектной мощности по долгосрочным договорам сроком 15 лет. Цены в этих договорах привязаны к нефтяной корзине с задержкой в шесть месяцев. Оставшиеся 20% планируется продавать на спотовом рынке. Банки-кредиторы потребовали, чтобы доля законтрактованного объёма составляла не менее 75%, иначе финансирование не будет предоставлено.', [

  P('ru', 'Автономные самосвалы', 'Горнодобывающая компания «Уральская медь» с 2023 года испытывает автономные самосвалы на карьере «Южный». За два года пилот охватил 12 машин из 70 в парке карьера. Производительность автономных самосвалов оказалась на 9% выше, чем у машин с водителем, за счёт отсутствия пересменок. При этом затраты на техническое обслуживание выросли из-за сложного сенсорного оборудования. Руководство заявило, что решение о полном переводе парка будет принято, когда срок окупаемости модернизации станет меньше четырёх лет.', [

  P('ru', 'Сервисный подрядчик', 'Компания «Западно-Сибирский сервис» выполняет капитальный ремонт скважин для трёх нефтяных компаний. В 2025 году на крупнейшего заказчика пришлось 55% выручки подрядчика. Договор с ним истекает в марте 2026 года и по его условиям может быть продлён только по итогам тендера. Чтобы снизить зависимость от одного клиента, подрядчик открыл филиал в Оренбургской области, где пока работает одна бригада.', [

  P('ru', 'Мониторинг бурения', 'Внедрение системы удалённого мониторинга бурения позволило «Таёжной буровой компании» сократить среднюю продолжительность строительства скважины с 24 до 19 суток. Наибольший эффект достигнут на горизонтальных скважинах, где сократилось число аварий с прихватом инструмента. Центр мониторинга работает круглосуточно и одновременно сопровождает до 30 буровых установок. Стоимость внедрения системы компания не раскрывает.', [

  P('ru', 'Стратегия до 2035 года', 'Совет директоров «Каспий Энерджи» утвердил стратегию до 2035 года. Согласно документу, доля газа в добыче компании должна вырасти с 30% до 45%, а инвестиции в низкоуглеродные проекты составят не менее 5% капитальных вложений ежегодно. Абсолютный объём добычи нефти при этом планируется сохранить на текущем уровне. Аналитики отмечают, что достижение целей зависит от сроков строительства газоперерабатывающего завода, проектная документация которого находится на экспертизе.', [

  P('ru', 'Хеджирование', 'Финансовая политика «Волга-Петролеум» требует в начале каждого года хеджировать от 30 до 50% добычи, запланированной на этот год. В начале 2025 года компания захеджировала 40% добычи, запланированной на 2025 год, с помощью опционов «пут» с ценой исполнения 65 долларов за баррель. Средняя цена реализации в 2025 году оказалась выше цены исполнения, поэтому опционы не были исполнены, а уплаченная премия была отнесена на расходы.', [

  P('ru', 'Программа геологоразведки', 'Программа геологоразведки «Енисей-Гео» на 2026 год включает бурение семи поисковых скважин, четыре из которых расположены на новых лицензионных участках. Исторически успешность поискового бурения компании составляла около 30%. Бюджет программы — 210 млн долларов, из них треть приходится на сейсморазведку 3D. Если успешными окажутся хотя бы две скважины, компания планирует начать опытно-промышленную эксплуатацию в 2028 году.', [

  PA('ru', 'idea', 'Критерии отбора проектов', 'Ещё десять лет назад нефтегазовые компании оценивали проекты прежде всего по объёму запасов. Сегодня на первый план вышли скорость возврата капитала и устойчивость к низким ценам: инвесторы готовы мириться с меньшим ростом добычи, если компания стабильно выплачивает дивиденды. Поэтому крупные проекты с длинным инвестиционным циклом всё чаще уступают место коротким проектам на уже освоенных месторождениях, даже если их суммарный ресурсный потенциал ниже.', [

    ['Короткие проекты на уже освоенных месторождениях дают компаниям больший ресурсный потенциал, чем крупные новые проекты с длинным циклом.', 'Не следует из текста: напротив, текст допускает, что их потенциал ниже.'],

  PA('ru', 'infer', 'Правило сокращения бурения', 'Если в течение года цена нефти опускается ниже 50 долларов за баррель, компания «Каменный Пояс» в том же году сокращает программу бурения. В 2025 году программа бурения не сокращалась. Кроме того, компания выплачивает специальный дивиденд только в те годы, когда свободный денежный поток превышает 1 млрд долларов.', [

  PA('ru', 'contra', 'Нефтепровод «Восточный луч»', 'Проект строительства нефтепровода «Восточный луч» разделён на три очереди. Первая очередь длиной 240 км введена в эксплуатацию в 2024 году, вторая строится, а проектирование третьей ещё не завершено. Пропускная способность после ввода всех очередей составит 30 млн тонн в год, сейчас — 12 млн тонн. Финансирование второй очереди полностью обеспечено собственными средствами компании.', [

  PA('ru', 'idea', 'Цифровизация и люди', 'Цифровые решения в добыче часто не дают ожидаемого эффекта не из-за технологий, а из-за людей. Система может точно предсказать отказ насоса, но если у мастера нет полномочий остановить скважину без согласования, рекомендация так и остаётся на экране. Компании, которые одновременно с внедрением ИТ-систем меняют регламенты и распределение ответственности, получают эффект в два-три раза выше.', [

  PA('ru', 'infer', 'Раскрытие отчётности', 'Все проекты, получившие государственную поддержку, публикуют отчётность о ходе реализации. Ни один из проектов компании «Лена-Газ» такую отчётность не публикует. Проект «Олёкма» компания «Лена-Газ» реализует совместно с партнёром.', [

  PA('ru', 'contra', 'Стоимость скважин', 'По данным отраслевого обзора, в 2025 году средняя стоимость строительства горизонтальной скважины в регионе выросла на 12% и составила 280 млн рублей. Основной причиной названо удорожание импортных комплектующих для многостадийного гидроразрыва пласта. При этом стоимость собственно буровых работ, по оценке авторов обзора, выросла лишь на 4%.', [

  PA('ru', 'idea', 'Регионы и инвесторы', 'Добывающие регионы долго соревновались за инвестиции налоговыми льготами. Однако опросы компаний показывают, что при выборе площадки льготы стоят лишь на четвёртом месте — после наличия инфраструктуры, доступности квалифицированного персонала и предсказуемости правил. Регион, который меняет условия каждые два года, проигрывает даже при более щедрых льготах.', [

  PA('en', 'idea', 'Copper and the energy transition', 'Copper is often called the metal of the energy transition: electric vehicles, wind turbines and grid upgrades all need far more of it than the technologies they replace. Yet new mines take 10 to 15 years from discovery to production, and ore grades at existing mines are falling. Unless investment in new supply accelerates, demand growth is likely to run ahead of production later this decade.', [

  PL('ru', 'Пилот четырёхдневной недели', 'Страховая компания «Ладья» полгода тестировала четырёхдневную рабочую неделю в двух подразделениях: в отделе урегулирования убытков (120 человек) и в ИТ-департаменте (80 человек). Зарплаты не менялись, а рабочий день остался прежним — восемь часов. В отделе урегулирования убытков среднее время рассмотрения заявления сократилось с 12 до 10 дней, а число жалоб клиентов не изменилось. В ИТ-департаменте доля задач, выполненных в срок, снизилась с 85% до 78%; руководство связывает это с тем, что на пятницу приходилось большинство выпусков новых версий программ. По итогам опроса 91% участников хотели бы сохранить новый график. Совет директоров решил продлить пилот в отделе урегулирования убытков ещё на год, а в ИТ-департаменте вернуть пятидневную неделю, разрешив командам самостоятельно выбирать один сокращённый день. Решение о переводе всей компании на новый график примут по итогам продлённого пилота.', [
    ['В пилоте участвовали 200 сотрудников.', 'T', '120 + 80 = 200.'],
    ['Во время пилота сотрудники работали 32 часа в неделю.', 'T', 'Четыре дня по восемь часов — 32 часа.'],
    ['После продлённого пилота вся компания перейдёт на четырёхдневную неделю.', 'C', 'Решение будет принято по итогам пилота; каким оно будет, неизвестно.'],
    ['В ИТ-департаменте сохранили четырёхдневную неделю.', 'F', 'Там вернули пятидневную неделю.'],
    ['Доля задач ИТ-департамента, выполненных в срок, снизилась на 7 процентных пунктов.', 'T', 'С 85% до 78% — на 7 п. п.']]);
  PL('ru', 'Программа лояльности сети «Вольт»', 'Сеть магазинов электроники «Вольт» в 2025 году заменила фиксированную скидку 5% для участников программы лояльности начислением баллов: покупатель получает баллами 7% от суммы покупки и может оплатить ими до 30% стоимости следующих покупок. Неиспользованные баллы сгорают через 12 месяцев после начисления. По данным компании, за первый год работы новой программы доля покупок её участников в выручке выросла с 48% до 61%, а их средний чек увеличился на 9%. При этом 35% начисленных баллов так и не были использованы. Финансовый директор отмечает, что фактическая стоимость программы для компании оказалась ниже, чем при прежней скидке, но предупреждает, что этот эффект может сократиться, если покупатели начнут тратить баллы активнее. Конкуренты «Вольта» пока сохраняют программы с фиксированной скидкой.', [
    ['Покупатель может полностью оплатить следующую покупку баллами.', 'F', 'Баллами можно оплатить не более 30% стоимости.'],
    ['Около двух третей начисленных баллов были использованы.', 'T', 'Не использованы 35%, значит, использованы 65% — около двух третей.'],
    ['Баллы, начисленные в январе 2025 года, можно потратить в декабре 2025 года.', 'T', 'Баллы сгорают только через 12 месяцев после начисления.'],
    ['Конкуренты «Вольта» планируют перейти на начисление баллов.', 'C', 'О планах конкурентов ничего не сказано — только о том, что они пока сохраняют скидки.'],
    ['Выручка «Вольта» в 2025 году выросла.', 'C', 'Приведены лишь доля участников программы в выручке и их средний чек; об общей выручке данных нет.']]);
  PL('ru', 'Новые правила госзакупок', 'С 1 июля в регионе действуют новые правила закупок для государственных учреждений. Закупки стоимостью до 600 тыс. рублей можно проводить у единственного поставщика без конкурса; раньше этот порог составлял 300 тыс. рублей. Для закупок свыше 20 млн рублей теперь обязательна независимая проверка начальной цены контракта. Кроме того, при оценке заявок цена должна иметь вес не менее 60%, а опыт поставщика — не более 20%. Учреждения обязаны публиковать отчёт о закупках у единственного поставщика ежеквартально, а не раз в год, как прежде. По оценке регионального министерства финансов, новые правила позволят сократить сроки небольших закупок в среднем на три недели. Ассоциация поставщиков считает, что повышение порога снизит конкуренцию, и предлагает ограничить годовой объём таких закупок для одного учреждения.', [
    ['Закупку на 450 тыс. рублей теперь можно провести у единственного поставщика.', 'T', 'Новый порог — 600 тыс. рублей.'],
    ['При оценке заявок опыт поставщика может иметь вес 25%.', 'F', 'Вес опыта — не более 20%.'],
    ['Отчёт о закупках у единственного поставщика теперь публикуется четыре раза в год.', 'T', 'Его публикуют ежеквартально.'],
    ['Независимая проверка начальной цены обязательна для всех закупок.', 'F', 'Только для закупок свыше 20 млн рублей.'],
    ['Сроки небольших закупок уже сократились в среднем на три недели.', 'C', 'Это лишь оценка министерства; фактических данных в тексте нет.']]);
  PL('ru', 'Новая дивидендная политика', 'Совет директоров «Восток-Ресурсов» утвердил новую дивидендную политику. Компания будет направлять на дивиденды не менее 50% свободного денежного потока при условии, что отношение чистого долга к EBITDA не превышает 1,5. Если этот показатель находится в диапазоне от 1,5 до 2,5, выплаты составят не менее 25% свободного денежного потока, а при более высокой долговой нагрузке размер выплат совет директоров определяет отдельно. Дивиденды выплачиваются два раза в год. По итогам 2025 года свободный денежный поток составил 1,2 млрд долларов, а отношение чистого долга к EBITDA — 1,8. Прежняя политика предусматривала выплату 35% чистой прибыли независимо от долговой нагрузки. Менеджмент ожидает, что крупная инвестиционная программа 2026–2027 годов временно увеличит долговую нагрузку.', [
    ['По новой политике на дивиденды за 2025 год должно быть направлено не менее 300 млн долларов.', 'T', 'При долге к EBITDA 1,8 выплачивается не менее 25% от 1,2 млрд — 300 млн.'],
    ['По новой политике размер дивидендов привязан к чистой прибыли.', 'F', 'Он привязан к свободному денежному потоку; к чистой прибыли была привязана прежняя политика.'],
    ['При отношении чистого долга к EBITDA выше 2,5 размер дивидендов определяет совет директоров.', 'T', 'Прямо сказано в тексте.'],
    ['Дивиденды выплачиваются раз в год.', 'F', 'Их выплачивают два раза в год.'],
    ['В 2026 году отношение чистого долга к EBITDA превысит 2,5.', 'C', 'Менеджмент ожидает роста долговой нагрузки, но насколько — не сказано.']]);
  PL('ru', 'Перерасход по проекту СПГ', 'Проект малотоннажного завода СПГ мощностью 0,5 млн тонн в год прошёл этап «Выбор концепции» с оценкой капитальных затрат 640 млн долларов. На этапе «Определение» оценка выросла до 790 млн долларов: 90 млн добавила замена импортного холодильного оборудования на отечественное, остальное — рост стоимости строительно-монтажных работ. По корпоративному регламенту проект, оценка затрат которого выросла между этапами более чем на 15%, должен заново пройти инвестиционный комитет до перехода к следующему этапу. Срок ввода завода сдвинут с 2028 на 2029 год. Внутренняя норма доходности проекта снизилась с 16% до 12,5% при минимально допустимом уровне 12%. Руководство проекта рассматривает возможность сократить затраты за счёт модульной сборки, но её стоимость пока не оценена.', [
    ['Рост стоимости строительно-монтажных работ добавил к оценке 60 млн долларов.', 'T', 'Оценка выросла на 150 млн, из них 90 млн — оборудование, остаётся 60 млн.'],
    ['Проект должен повторно пройти инвестиционный комитет.', 'T', 'Оценка выросла примерно на 23%, больше порога 15%.'],
    ['После пересмотра доходность проекта стала ниже минимально допустимой.', 'F', '12,5% выше минимального уровня 12%.'],
    ['Модульная сборка снизит затраты по проекту на 50 млн долларов.', 'C', 'Её стоимость и эффект пока не оценены.'],
    ['Ввод завода отложен на два года.', 'F', 'С 2028 на 2029 год — на один год.']]);
  PL('ru', 'Трансфертная цена на нефть', 'Нефтеперерабатывающий завод холдинга покупает нефть у добывающей «дочки» по трансфертной цене: рыночная цена Urals минус фиксированная скидка 4 доллара за баррель. Скидка установлена в 2022 году и с тех пор не менялась. В 2025 году налоговая служба проверила сделки за 2022–2023 годы и пришла к выводу, что скидка превышает рыночный уровень, который, по её оценке, составлял 2,5 доллара за баррель. Холдинг оспорил решение в части 2022 года, но согласился с ним в части 2023 года и доплатил налог за этот год. С 2026 года холдинг планирует перейти на формулу, по которой скидка будет пересматриваться ежегодно на основе анализа сопоставимых сделок. До перехода на новую формулу действующая скидка сохраняется.', [
    ['В 2025 году завод покупал нефть со скидкой 4 доллара к цене Urals.', 'T', 'Скидка не менялась с 2022 года и сохраняется до перехода на новую формулу.'],
    ['Налоговая служба считает рыночной скидку 4 доллара за баррель.', 'F', 'По её оценке, рыночный уровень — 2,5 доллара.'],
    ['Холдинг доплатил налог за 2022 год.', 'F', 'Решение по 2022 году холдинг оспорил; налог доплачен за 2023 год.'],
    ['С 2026 года скидка будет меньше 4 долларов за баррель.', 'C', 'Её будут пересматривать на основе сопоставимых сделок; какой она станет, неизвестно.'],
    ['Холдинг согласился с выводами налоговой службы не по всем проверенным годам.', 'T', 'С 2023 годом согласился, 2022 год оспорил.'],
    ['Налоговая служба проверяла и сделки за 2024 год.', 'C', 'Сказано о проверке 2022–2023 годов; о 2024 годе данных нет.']]);
  PL('ru', 'Перевозки по Северному морскому пути', 'Компания «Арктик Карго» планирует перевозить концентрат с горно-обогатительного комбината на Таймыре в порты Азии по Северному морскому пути. Путь из Мурманска в Шанхай через СМП примерно на 40% короче, чем через Суэцкий канал, однако без ледокольной проводки навигация возможна лишь с июля по ноябрь. В остальные месяцы нужны суда ледового класса Arc7 и сопровождение ледокола, что увеличивает стоимость рейса примерно на 30%. Компания заказала четыре судна класса Arc7, первое из них будет передано в 2027 году. До этого перевозки будут идти только в летне-осеннюю навигацию на арендованных судах. Страховые компании пока требуют для арктических рейсов надбавку к ставке страхования, размер которой компания не раскрывает.', [
    ['Путь из Мурманска в Шанхай через Суэцкий канал длиннее, чем через СМП.', 'T', 'Путь через СМП примерно на 40% короче.'],
    ['До 2027 года компания будет перевозить концентрат по СМП круглый год.', 'F', 'До получения судов Arc7 перевозки будут только в летне-осеннюю навигацию.'],
    ['Все четыре судна класса Arc7 компания получит в 2027 году.', 'C', 'Известно только, что первое судно будет передано в 2027 году.'],
    ['Рейс в январе обойдётся компании дороже, чем такой же рейс в августе.', 'T', 'Вне летне-осенней навигации нужны ледокол и суда Arc7, что дороже примерно на 30%.'],
    ['Надбавка к ставке страхования для арктических рейсов составляет 30%.', 'C', 'Размер надбавки компания не раскрывает.']]);

  PL('en', 'Earn-out on a software deal', 'Meridia Logistics has agreed to buy RouteWise, a route-optimisation software start-up, for an upfront payment of $45 million plus an earn-out of up to $30 million. The earn-out depends on RouteWise’s annual recurring revenue (ARR) at the end of 2027: the full amount is paid if ARR reaches $25 million, two thirds if it is between $20 million and $25 million, and nothing below $20 million. RouteWise ended 2025 with ARR of $14 million, up from $9 million a year earlier. Its two founders will stay on as product leads until at least mid-2027, and part of their earn-out is conditional on their staying. Meridia plans to offer RouteWise’s software to its own 600 corporate clients, which analysts see as the main route to the ARR target. Integrating the two companies’ billing systems is expected to take nine months.', [
    ['If RouteWise’s ARR at the end of 2027 is $22 million, the sellers will receive $20 million from the earn-out.', 'T', 'Between $20 and $25 million, two thirds of $30 million — $20 million — is paid.'],
    ['The maximum total price of the deal is $75 million.', 'T', '$45 million upfront plus up to $30 million.'],
    ['RouteWise’s ARR grew by more than 50% in 2025.', 'T', 'From $9 million to $14 million is about 56%.'],
    ['The founders’ earn-out does not depend on whether they stay with the company.', 'F', 'Part of it is conditional on their staying.'],
    ['RouteWise will reach the ARR level needed for the full earn-out.', 'C', 'The passage gives no basis for saying whether it will.']]);
  PL('en', 'Four-day week at a tax agency', 'A regional tax agency ran a six-month trial in which 300 staff in two call centres worked four ten-hour days instead of five eight-hour days. Weekly hours and pay were unchanged. Average call waiting time fell from nine minutes to seven, mainly because the centres were now staffed until 8 p.m. instead of 6 p.m. Sick leave fell by 18%, but overtime costs rose because some evening shifts were hard to fill. The agency’s board will decide in the spring whether to extend the schedule to its processing offices, where work is less tied to opening hours. Staff unions support the change but want a written guarantee that the schedule will stay voluntary for staff with caring responsibilities.', [
    ['Staff in the trial worked fewer hours per week than before.', 'F', 'Weekly hours were unchanged: 4 × 10 = 5 × 8 = 40.'],
    ['During the trial the call centres closed later than before.', 'T', 'They were staffed until 8 p.m. instead of 6 p.m.'],
    ['Overtime costs fell during the trial.', 'F', 'They rose.'],
    ['The schedule will be extended to the processing offices.', 'C', 'The board has not yet decided.'],
    ['Average waiting time fell by more than 20%.', 'T', 'From nine to seven minutes is about 22%.']]);
  PL('en', 'Dynamic pricing at a budget airline', 'Since January, a budget airline has priced seats on its 40 busiest routes using an algorithm that updates fares up to six times a day based on demand, competitor prices and the time left before departure. On its other routes fares are still set weekly by analysts. In the first quarter, average revenue per seat on the algorithm routes rose 7% year on year, compared with 2% on the other routes, while the load factor on both groups of routes stayed at about 88%. The regulator has asked for an explanation after several complaints that fares on the same flight changed within minutes. The airline says the algorithm cannot raise a fare by more than 25% within 24 hours, and it plans to extend the algorithm to all routes by the end of the year if the results hold.', [
    ['Fares on the algorithm routes can change several times a day.', 'T', 'They are updated up to six times a day.'],
    ['The load factor on the algorithm routes rose in the first quarter.', 'F', 'It stayed at about 88%.'],
    ['Under the algorithm, a $100 fare could rise to $130 within one day.', 'F', 'A fare cannot rise by more than 25% within 24 hours.'],
    ['The regulator has fined the airline.', 'C', 'It has only asked for an explanation; nothing is said about a fine.'],
    ['The algorithm will be used on all routes by the end of the year.', 'C', 'That depends on whether the results hold.']]);
  PL('en', 'New emissions disclosure rule', 'From the 2026 reporting year, companies listed on the regional exchange must disclose their Scope 1 and Scope 2 greenhouse gas emissions; Scope 3 disclosure becomes mandatory only in 2028. The figures must be checked by an independent assurance provider, initially at the “limited assurance” level, which involves fewer procedures than a full audit. Companies with fewer than 250 employees may delay compliance by one year. Hadeed Cement, which has 1,900 employees, already publishes all three scopes voluntarily, but its Scope 3 figures have never been externally checked. The exchange estimates that first-year compliance will cost a mid-sized company about $150,000, mostly for data systems and assurance fees.', [
    ['Hadeed Cement must disclose its Scope 1 emissions for 2026.', 'T', 'It is listed and has more than 250 employees.'],
    ['A listed company with 200 employees is required to disclose its Scope 2 emissions for the 2026 reporting year.', 'F', 'Companies with fewer than 250 employees may delay compliance by a year.'],
    ['Limited assurance involves more procedures than a full audit.', 'F', 'It involves fewer.'],
    ['Hadeed Cement’s Scope 3 figures are inaccurate.', 'C', 'They have not been checked; nothing is said about their accuracy.'],
    ['Hadeed Cement already reports more emission scopes than the rule requires for 2026.', 'T', 'It reports Scope 3, which becomes mandatory only in 2028.']]);
  PL('en', 'Qamar Oil’s dividend policy', 'Qamar Oil’s new dividend policy sets a base dividend of $0.40 per share a year, paid quarterly, which the board intends to maintain at Brent prices down to $55 per barrel. In addition, the company will pay out 30% of any free cash flow above $2 billion as a variable dividend once a year. In 2025 free cash flow was $2.6 billion, and the company had 1.5 billion shares outstanding. Share buybacks, which made up half of shareholder returns in 2024, have been suspended until net debt falls below $3 billion; net debt stood at $3.8 billion at the end of 2025. The policy will be reviewed in 2027.', [
    ['The variable dividend for 2025 amounts to $180 million.', 'T', '30% of the $0.6 billion above $2 billion.'],
    ['The base dividend for 2025 totals $600 million.', 'T', '$0.40 × 1.5 billion shares.'],
    ['Qamar Oil bought back shares during 2025.', 'C', 'The passage does not say when the buybacks were suspended.'],
    ['The base dividend is paid once a year.', 'F', 'It is paid quarterly.'],
    ['The board guarantees the base dividend at any oil price.', 'F', 'It intends to maintain it only at Brent prices down to $55.']]);
  PL('en', 'Cost overrun at a gas project', 'At the “Select” gate, the capital cost of an offshore gas compression project was estimated at $1.20 billion. Front-end engineering design raised the estimate to $1.38 billion, mainly because the platform needs heavier steel to meet updated wave-loading standards. Company rules require any project whose estimate rises by more than 10% between gates to return to the investment committee before tendering. The committee approved the revised budget in October on condition that the team obtains at least two fixed-price bids for the topside modules. First gas is still planned for 2028, but the project manager warns that the schedule no longer has any float. The project’s net present value fell from $410 million to $300 million.', [
    ['The cost estimate rose by 15% between gates.', 'T', '$1.38 billion ÷ $1.20 billion = 1.15.'],
    ['The project had to go back to the investment committee.', 'T', 'The 15% rise exceeds the 10% threshold.'],
    ['The committee rejected the revised budget.', 'F', 'It approved it, with a condition.'],
    ['The project’s NPV fell by more than a quarter.', 'T', '$110 million is about 27% of $410 million.'],
    ['Two fixed-price bids for the topside modules have been received.', 'C', 'Obtaining them is a condition; the passage does not say whether they have been received.'],
    ['First gas has been delayed to 2029.', 'F', 'It is still planned for 2028.']]);
  PL('en', 'Data centres and power demand', 'A Gulf utility expects electricity demand from data centres in its area to grow from 0.6 GW today to 2.4 GW by 2030. To serve it, the utility plans 1.5 GW of new gas-fired capacity and 1.2 GW of solar with battery storage. Data-centre operators have asked for supply contracts of 15 years, while the utility normally signs contracts of up to 10 years. The regulator has allowed longer contracts only if the customer pays for the grid connection upfront. Two operators have accepted these terms; a third has paused its project and is considering a site in a neighbouring country. Analysts note that if all the planned capacity is built, the utility’s reserve margin will rise even if data-centre demand grows more slowly than expected.', [
    ['Data-centre demand is expected to quadruple by 2030.', 'T', 'From 0.6 GW to 2.4 GW is four times as much.'],
    ['The utility plans 2.7 GW of new capacity.', 'T', '1.5 GW + 1.2 GW.'],
    ['All three operators have agreed to pay for their grid connections upfront.', 'F', 'Only two have accepted the terms.'],
    ['The third operator will build its data centre in a neighbouring country.', 'C', 'It is only considering it.'],
    ['The utility usually signs supply contracts longer than 15 years.', 'F', 'It normally signs contracts of up to 10 years.']]);
  PL('en', 'Currency clause in a supply contract', 'A Russian petrochemical producer buys catalysts from a European supplier under a three-year contract priced in euros, with deliveries every quarter. Since 2025 the contract has included a currency clause: if the average euro–rouble rate for a quarter differs by more than 10% from the reference rate of 95 roubles set when the contract was signed, either party may ask to renegotiate the price of the next delivery. In the third quarter the rate averaged 104 roubles, and in the fourth quarter 106 roubles. The producer asked to renegotiate after the fourth quarter. The supplier agreed to cut the euro price by 4% for the next two deliveries but rejected a request to switch the contract to yuan. Both companies expect to discuss the payment currency again when the contract is renewed in 2027.', [
    ['The third-quarter average rate allowed either party to ask for renegotiation.', 'F', '104 is about 9.5% above 95 — below the 10% threshold.'],
    ['The fourth-quarter average rate was more than 10% above the reference rate.', 'T', '106 ÷ 95 ≈ 1.116, about 11.6% higher.'],
    ['The euro price will be 4% lower for the next two deliveries.', 'T', 'The supplier agreed to this cut.'],
    ['From the next delivery the contract is priced in yuan.', 'F', 'The supplier rejected the switch to yuan.'],
    ['When the contract is renewed in 2027, payment will switch to yuan.', 'C', 'The companies only expect to discuss the currency again.']]);

  // Long-passage items: 2–3 statements per passage per round, passages shuffled
  E.longItems = function (lang, n) {
    var ps = V.filter(function (p) { return p.lang === lang && p.long; }), out = [];
    while (out.length < n) {
      shuffle(ps).forEach(function (p) { shuffle(p.st.map(function (_, i) { return i; })).slice(0, 2 + rnd(2)).forEach(function (i) { out.push({ p: p.id, s: i }); }); });
    }
    return out.slice(0, n);
  };
  var planBeforeLong = E.verbalPlan;

  PG('en', 'Coffee chain loyalty app', 'Brightbean, a chain of 140 coffee shops, replaced its paper stamp cards with a loyalty app in March. Customers earn one point for every dollar they spend and can exchange 60 points for a free drink. Points expire 12 months after they are earned. In the first six months, 38% of all transactions were made through the app, against a target of 30%. The app cost $1.2 million to develop. The chain will decide in January whether to add a paid subscription tier offering unlimited filter coffee.', [
    ['More than a third of transactions in the first six months were made through the app.', 'T', '38% is more than a third (33.3%).'],
    ['The app missed its usage target in the first six months.', 'F', 'Usage was 38% against a target of 30%, so the target was exceeded.'],
    ['Most Brightbean customers prefer the app to paper cards.', 'C', 'The passage gives the share of transactions, not customers’ preferences.'],
    ['Brightbean has already decided to introduce a paid subscription tier.', 'F', 'The decision will be taken in January.']], [
    ['A customer who spends $60 earns enough points for a free drink.', 'T', 'One point per dollar: $60 gives 60 points, the price of a free drink.'],
    ['The app has already paid back its development cost.', 'C', 'Only the cost is given; nothing is said about the return.']]);
  PG('ru', 'Приложение лояльности кофейни', 'Сеть «Яркое зерно» из 140 кофеен в марте заменила бумажные карточки со штампами приложением лояльности. Покупатель получает один балл за каждый потраченный доллар и может обменять 60 баллов на бесплатный напиток. Баллы сгорают через 12 месяцев после начисления. За первые полгода через приложение прошло 38% всех покупок при целевом уровне 30%. Разработка приложения обошлась в 1,2 млн долларов. В январе сеть решит, вводить ли платную подписку с безлимитным фильтр-кофе.', [
    ['За первые полгода через приложение прошло больше трети всех покупок.', 'T', '38% больше трети (33,3%).'],
    ['За первые полгода приложение не достигло целевого уровня использования.', 'F', 'Использование составило 38% при цели 30% — цель превышена.'],
    ['Большинство покупателей сети предпочитают приложение бумажным карточкам.', 'C', 'В тексте дана доля покупок, а не предпочтения покупателей.'],
    ['Сеть уже решила ввести платную подписку.', 'F', 'Решение будет принято только в январе.']], [
    ['Покупатель, потративший 60 долларов, наберёт баллы на бесплатный напиток.', 'T', 'Один балл за доллар: 60 долларов дают 60 баллов — цену напитка.'],
    ['Приложение уже окупило затраты на разработку.', 'C', 'Указаны только затраты; об отдаче ничего не сказано.']]);
  PG('en', 'Online hospital booking', 'Northfield General Hospital introduced online booking for outpatient appointments last year. Patients can book, move or cancel an appointment online up to 24 hours before it starts; later changes must be made by phone. Since then, missed appointments have fallen from 11% to 7% of all bookings. The hospital estimates that each missed appointment costs it about $160 in unused staff time. Telephone booking remains available: about a quarter of bookings are still made by phone, and the rest are made online.', [
    ['A patient can cancel an appointment online on the morning of the appointment.', 'F', 'Online changes are possible only up to 24 hours before; later changes must be made by phone.'],
    ['The share of missed appointments has fallen by 4 percentage points.', 'T', 'From 11% to 7% is 4 percentage points.'],
    ['Most bookings are now made online.', 'T', 'About a quarter are made by phone and the rest — about three quarters — online.'],
    ['Online booking was introduced to cut staff costs.', 'C', 'The passage does not give the reason for introducing it.']], [

  PG('ru', 'Онлайн-запись в больницу', 'В прошлом году городская больница «Северная» ввела онлайн-запись на амбулаторный приём. Пациент может записаться, перенести или отменить приём онлайн не позднее чем за 24 часа до его начала; более поздние изменения возможны только по телефону. С тех пор доля неявок снизилась с 11% до 7% всех записей. По оценке больницы, каждая неявка обходится ей примерно в 160 долларов неиспользованного рабочего времени персонала. Запись по телефону сохранилась: так оформляется около четверти записей, остальные — онлайн.', [
    ['Пациент может отменить приём онлайн утром в день приёма.', 'F', 'Онлайн изменения возможны не позднее чем за 24 часа; позже — только по телефону.'],
    ['Доля неявок снизилась на 4 процентных пункта.', 'T', 'С 11% до 7% — это 4 процентных пункта.'],
    ['Большинство записей теперь оформляется онлайн.', 'T', 'По телефону — около четверти, остальные, около трёх четвертей, — онлайн.'],
    ['Онлайн-запись ввели, чтобы сократить расходы на персонал.', 'C', 'Причина введения в тексте не названа.']], [

    ['Теперь больница теряет на неявках меньше денег, чем раньше.', 'C', 'Снизилась доля неявок, но общее число записей могло измениться, поэтому число неявок неизвестно.']]);
  PG('en', 'City bike sharing', 'The city of Lindau launched a bike-sharing scheme with 900 bicycles at 75 docking stations. Without a pass, a ride costs €1.50 for the first 30 minutes and €1 for each further 30 minutes or part of it. Holders of an annual pass ride free for the first 45 minutes. In its first year the scheme recorded 410,000 rides, 60% of them by pass holders. The city pays the operator a fixed annual fee; ride revenue goes to the city budget, not to the operator.', [

    ['The operator’s income depends on the number of rides.', 'F', 'The operator receives a fixed fee and does not keep ride revenue.'],
    ['Pass holders made more than 240,000 rides in the first year.', 'T', '60% of 410,000 is 246,000.'],

    ['Most rides lasted less than 30 minutes.', 'C', 'The passage gives no data on ride length.']]);
  PG('ru', 'Городской велопрокат', 'В городе Линдау запустили велопрокат: 900 велосипедов на 75 станциях. Без абонемента поездка стоит 1,5 евро за первые 30 минут и 1 евро за каждые следующие 30 минут или их часть. Владельцы годового абонемента первые 45 минут катаются бесплатно. За первый год совершено 410 тыс. поездок, 60% из них — владельцами абонементов. Город платит оператору фиксированное годовое вознаграждение; выручка от поездок поступает в городской бюджет, а не оператору.', [
    ['Поездка на 50 минут без абонемента стоит 2,5 евро.', 'T', '1,5 евро за первые 30 минут плюс 1 евро за оставшиеся 20 минут — это часть следующего получаса.'],
    ['Доход оператора зависит от числа поездок.', 'F', 'Оператор получает фиксированное вознаграждение, а выручка идёт в бюджет города.'],

    ['Большинство поездок длились меньше 30 минут.', 'C', 'Данных о длительности поездок в тексте нет.']]);
  PG('en', 'Remote working policy', 'From 1 September, staff at Orion Insurance may work from home on up to two days a week, provided their manager agrees. Employees in customer-facing roles are excluded and must work in the office every day. Staff who choose remote working receive a monthly allowance of $40 towards home internet costs; staff who work fully in the office receive a parking subsidy instead. The policy will be reviewed after twelve months using productivity data and a staff survey.', [

  PG('ru', 'Удалённая работа', 'С 1 сентября сотрудники страховой компании «Орион» могут работать из дома до двух дней в неделю при согласии руководителя. Это не распространяется на сотрудников, работающих с клиентами: они каждый день работают в офисе. Тем, кто выбрал удалённый формат, компания ежемесячно компенсирует 40 долларов расходов на домашний интернет; сотрудники, работающие только в офисе, вместо этого получают компенсацию парковки. Через двенадцать месяцев порядок пересмотрят по данным о производительности и результатам опроса сотрудников.', [
    ['Аналитик по убыткам может работать из дома три дня в неделю, если руководитель согласен.', 'F', 'Предел — два дня в неделю.'],
    ['Сотрудники, работающие с клиентами, получают компенсацию интернета 40 долларов.', 'F', 'Компенсация положена тем, кто выбрал удалённый формат, а сотрудники, работающие с клиентами, каждый день в офисе.'],
    ['Сотрудник не может одновременно получать компенсацию интернета и парковки.', 'T', 'Работающие только в офисе получают компенсацию парковки вместо компенсации интернета.'],
    ['Ожидается, что большинство сотрудников перейдут на удалённую работу.', 'C', 'Об ожидаемом числе таких сотрудников в тексте ничего нет.']], [
    ['При пересмотре порядка учтут результаты опроса сотрудников.', 'T', 'Пересмотр пройдёт по данным о производительности и опроса.'],
    ['После введения нового порядка производительность снизилась.', 'C', 'Данные о производительности будут использованы при пересмотре; результатов в тексте нет.']]);
  PG('en', 'Delivery platform commission', 'QuickPlate, a food delivery platform, charges restaurants a commission of 25% of the order value; restaurants that deliver with their own couriers pay 12% instead. From next month, commission will be capped at $6 per order for restaurants that have been on the platform for more than three years. The average order value is $28. Last year 18% of partner restaurants left the platform — the highest rate since QuickPlate was founded.', [
    ['A restaurant with its own couriers pays $3.36 in commission on an average order.', 'T', '12% of $28 is $3.36.'],
    ['After the change, a long-standing partner that uses QuickPlate couriers will pay $7 on an average order.', 'F', '25% of $28 is $7, but the cap limits it to $6.'],
    ['The cap will apply to all partner restaurants.', 'F', 'It applies only to restaurants on the platform for more than three years.'],

    ['QuickPlate has been operating for more than three years.', 'T', 'Some restaurants have been on the platform for more than three years.']]);
  PG('ru', 'Комиссия сервиса доставки', 'Сервис доставки еды «Быстрая тарелка» берёт с ресторанов комиссию 25% от суммы заказа; рестораны, которые доставляют своими курьерами, платят 12%. Со следующего месяца для ресторанов, работающих с сервисом больше трёх лет, комиссия будет ограничена 6 долларами за заказ. Средний чек составляет 28 долларов. В прошлом году сервис покинули 18% ресторанов-партнёров — это самый высокий показатель с момента основания сервиса.', [
    ['Ресторан со своими курьерами платит со среднего заказа 3,36 доллара комиссии.', 'T', '12% от 28 долларов — 3,36 доллара.'],
    ['После изменения давний партнёр, пользующийся курьерами сервиса, заплатит со среднего заказа 7 долларов.', 'F', '25% от 28 — это 7 долларов, но ограничение снижает сумму до 6.'],
    ['Ограничение комиссии распространится на все рестораны-партнёры.', 'F', 'Только на рестораны, работающие с сервисом больше трёх лет.'],
    ['В прошлом году рестораны уходили из сервиса из-за высокой комиссии.', 'C', 'Причины ухода в тексте не названы.']], [

    ['Сервис работает больше трёх лет.', 'T', 'Есть рестораны, которые работают с ним больше трёх лет.']]);
  PG('en', 'University admissions', 'From next year, Westbrook University will no longer require standardised test scores for undergraduate admission. Applicants may still submit scores; if they do, the scores will be considered alongside school grades, a personal statement and a reference. Applicants to the medicine and engineering programmes must still sit the university’s own entrance exam. In a three-year trial at two faculties, students admitted without test scores achieved first-year results similar to those of students who submitted them.', [
    ['Engineering applicants will no longer have to sit any exam to be admitted.', 'F', 'They must still sit the university’s own entrance exam.'],
    ['Submitting test scores will be optional for applicants to the undergraduate history programme.', 'T', 'Scores will not be required for undergraduate admission; only medicine and engineering keep an exam requirement.'],
    ['The trial covered all of the university’s faculties.', 'F', 'It was run at two faculties.'],

    ['The change applies to undergraduate admissions.', 'T', 'Stated in the first sentence.']]);
  PG('ru', 'Приём в университет', 'Со следующего года университет «Вестбрук» перестанет требовать результаты стандартизированных тестов при приёме на бакалавриат. Абитуриенты могут подавать их по желанию; в этом случае результаты учтут наряду со школьными оценками, мотивационным письмом и рекомендацией. Поступающие на медицину и инженерные программы по-прежнему сдают собственный вступительный экзамен университета. В трёхлетнем эксперименте на двух факультетах студенты, принятые без результатов тестов, показали на первом курсе результаты, близкие к результатам тех, кто их подавал.', [
    ['Поступающим на инженерные программы больше не нужно сдавать никаких экзаменов.', 'F', 'Они по-прежнему сдают собственный вступительный экзамен университета.'],
    ['Для поступающих на бакалавриат по истории подача результатов тестов станет необязательной.', 'T', 'Результаты тестов не требуются для бакалавриата; экзамен сохраняется только для медицины и инженерии.'],
    ['Эксперимент проводился на всех факультетах университета.', 'F', 'Только на двух факультетах.'],
    ['Студенты, принятые без результатов тестов, чаще отчислялись.', 'C', 'Приведены только результаты первого курса; данных об отчислениях нет.']], [
    ['Если результаты тестов поданы, они станут решающим фактором при приёме.', 'C', 'Их учтут наряду с другими факторами; вес не указан.'],
    ['Изменение касается приёма на бакалавриат.', 'T', 'Сказано в первом предложении.']]);
  PG('en', 'Bottle deposit scheme', 'From January, shops in the region must charge a deposit of 15 cents on every plastic and glass drinks container they sell. Customers get the deposit back when they return the empty container to any shop that sells drinks. Containers smaller than 150 ml and milk cartons are exempt. In a neighbouring country that introduced a similar scheme five years ago, the share of containers returned rose from 40% to 92%.', [
    ['A customer can get the deposit back only from the shop where the drink was bought.', 'F', 'Containers can be returned to any shop that sells drinks.'],
    ['A 100 ml glass bottle of juice carries a 15-cent deposit.', 'F', 'Containers smaller than 150 ml are exempt.'],

    ['The scheme covers both plastic and glass containers.', 'T', 'Stated in the first sentence.']], [
    ['Milk sold in cartons does not carry a deposit.', 'T', 'Milk cartons are exempt.'],
    ['The neighbouring country charges the same deposit per container.', 'C', 'The size of its deposit is not given.']]);
  PG('ru', 'Залоговая стоимость тары', 'С января магазины региона обязаны брать залог 15 центов за каждую пластиковую и стеклянную бутылку с напитком. Залог возвращают, когда покупатель сдаёт пустую тару в любой магазин, торгующий напитками. Тара объёмом меньше 150 мл и молочные пакеты освобождены от залога. В соседней стране, где похожую систему ввели пять лет назад, доля возвращаемой тары выросла с 40% до 92%.', [
    ['Залог можно вернуть только в том магазине, где купили напиток.', 'F', 'Тару принимают в любом магазине, торгующем напитками.'],
    ['За стеклянную бутылочку сока объёмом 100 мл берут залог 15 центов.', 'F', 'Тара меньше 150 мл освобождена от залога.'],
    ['Доля возвращаемой тары в регионе вырастет примерно до 92%.', 'C', '92% — результат соседней страны; о будущем показателе региона ничего не сказано.'],
    ['Система распространяется и на пластиковую, и на стеклянную тару.', 'T', 'Сказано в первом предложении.']], [

  PG('en', 'Airline baggage fees', 'From May, SkyLink will charge $35 for the first checked bag on short-haul flights booked at its Basic fare; the Standard fare includes one checked bag of up to 23 kg. Bags weighing 23–32 kg cost an extra $50 on any fare, and bags over 32 kg are not accepted. Gold members of the frequent-flyer programme can check a second bag of up to 23 kg free of charge. The airline expects the new fees to raise $40 million a year.', [

    ['Most SkyLink passengers book the Basic fare.', 'C', 'The passage does not say how passengers split between fares.']], [

  function mmss(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); var m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function pct(c, n) { return n ? Math.round(c / n * 100) : 0; }
  function band(p) { return p >= 80 ? 3 : p >= 60 ? 2 : p >= 40 ? 1 : 0; }

    return h;

    h += '<div class="actions" style="margin:0 0 18px"><button class="btn btn-primary" data-act="again">' + esc(tr(U.again)) + '</button><button class="btn btn-ghost" data-act="home">' + esc(tr(U.home)) + '</button></div>';

    s.plan.forEach(function (spec, i) {

      h += '<details data-i="' + i + '"><summary><span class="mk ' + (a.ok ? 'y' : credit(a) > 0 ? 'p' : 'n') + '">' + (a.ok ? '✓' : credit(a) > 0 ? '½' : '✗') + '</span><span class="st">' + (i + 1) + '. ' + esc(L(q.typeName, s.lang)) + ' — ' + esc(L(q.prompt, s.lang)) + '</span><span class="tm">' + Math.round(a.ms / 1000) + (S.lang === 'ru' ? ' с' : ' s') + '</span></summary><div class="rv"></div></details>';
