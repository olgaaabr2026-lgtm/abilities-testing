    num: {
      intro: T('Проверяется не высшая математика, а умение быстро найти нужные данные и не ошибиться в базе, единицах и периоде. Большинство ошибок связано с чтением условия, а не с арифметикой.', 'This is not about advanced maths but about finding the right data fast and getting the base, units and period right. Most mistakes come from reading the question, not from arithmetic.'),
      blocks: [
        ['Алгоритм на один вопрос', 'Routine for one item', [
          ['Сначала прочитайте вопрос, потом ищите в таблице только нужное: строку, столбец, год.', 'Read the question first, then look up only what you need: row, column, year.'],
          ['Проверьте единицы: тысячи или миллионы, сутки или год, доллары или рубли, проценты или процентные пункты. Прочитайте сноски.', 'Check the units: thousands or millions, per day or per year, dollars or roubles, percent or percentage points. Read the footnotes.'],
          ['Прикиньте порядок ответа в уме и отбросьте явно нереальные варианты.', 'Estimate the order of magnitude and drop clearly unrealistic options.'],
          ['Посчитайте на калькуляторе (обычно разрешён — проверьте инструкцию) и сверьте с вариантами.', 'Calculate (a calculator is usually allowed — check the instructions) and compare with the options.'],
          ['Если результат не совпадает ни с одним вариантом, проверьте базу процента и период.', 'If your result matches no option, check the percentage base and the period.']
        ], true],
        ['Формулы, которые нужны чаще всего', 'Formulas you will need most', [
          ['Изменение в %: (новое − старое) ÷ старое × 100. База — старое значение. В сравнениях «на сколько % A больше B» база — B, то, с чем сравнивают.', 'Change in %: (new − old) ÷ old × 100. The base is the old value. In comparisons such as “by what % is A higher than B”, the base is B — the thing you compare with.'],
          ['Доля в %: часть ÷ целое × 100. Целое включает саму часть.', 'Share in %: part ÷ whole × 100. The whole includes the part itself.'],
          ['Обратный процент: если после роста на p% получилось X, исходное = X ÷ (1 + p/100), а не X × (1 − p/100).', 'Reverse percentage: if X is the value after a p% rise, the original is X ÷ (1 + p/100), not X × (1 − p/100).'],
          ['Процентные пункты — разница двух процентов: рост с 30% до 45% — это +15 п. п., но +50%.', 'Percentage points are the difference between two percentages: 30% to 45% is +15 pp but +50%.'],
          ['CAGR = (конец ÷ начало)<sup>1/n</sup> − 1, где n — число годовых шагов (2023 → 2025 — это два шага).', 'CAGR = (end ÷ start)<sup>1/n</sup> − 1, where n is the number of annual steps (2023 → 2025 is two steps).'],
          ['Проверяйте ответ подстановкой: для CAGR умножьте начало на (1 + r)<sup>n</sup> и сравните с концом. Если после падения на p% получилось X, исходное = X ÷ (1 − p/100).', 'Check answers by substitution: for CAGR, multiply the start by (1 + r)<sup>n</sup> and compare with the end. If X is the value after a p% fall, the original is X ÷ (1 − p/100).'],
          ['Удельный показатель: затраты ÷ объём за тот же период. Суточную добычу сначала умножьте на 365.', 'Unit metric: cost ÷ volume for the same period. Multiply daily output by 365 first.'],
          ['Средняя цена = выручка ÷ объём, а не среднее арифметическое цен.', 'Average price = revenue ÷ volume, not the simple average of prices.'],
          ['Рублёвая цена = цена в долларах × курс. Её изменение зависит и от цены, и от курса.', 'Rouble price = dollar price × exchange rate. Its change depends on both.'],
          ['Если цена выросла на a%, а курс на b%, рублёвая цена изменилась на [(1 + a/100)(1 + b/100) − 1] × 100%, а не на (a + b)%.', 'If the price rose by a% and the exchange rate by b%, the rouble price changed by [(1 + a/100)(1 + b/100) − 1] × 100%, not by (a + b)%.']
        ]],
        ['Как решать по типам данных', 'How to handle each type of data', [
          ['<b>Круговая диаграмма.</b> Сумма по статье = доля × итог. Разница двух статей в деньгах = (доля 1 − доля 2) × итог; сама разница долей — это процентные пункты. Если выросла одна статья, вырос и итог: новая доля = новая сумма статьи ÷ новый итог.', '<b>Pie chart.</b> An item’s amount = share × total. The money gap between two items = (share 1 − share 2) × total; the gap in shares alone is percentage points. If one item grows, the total grows too: new share = the item’s new amount ÷ the new total.'],
          ['<b>Линейный график.</b> Берите подписанные значения, а не оценку по сетке. «Сильнее всего вырос» — это самая большая разница с предыдущим месяцем, а не самая высокая точка графика. Спред между двумя линиями (например, дисконт Urals к Brent) — это разница значений за один и тот же месяц.', '<b>Line chart.</b> Use the labelled values, not a reading off the grid. “Rose the most” is the largest change from the previous month, not the highest point on the chart. The spread between two lines (e.g. the Urals discount to Brent) is the difference for the same month.'],
          ['<b>Отчётность.</b> Используйте определения из условия или сноски, даже если в вашей компании считали иначе: в тесте «FCF = EBITDA − CAPEX» значит ровно это. Рентабельность считается от выручки, а не от расходов; «долг / EBITDA» — долг в числителе.', '<b>Financial statements.</b> Use the definitions in the question or footnote, even if your company calculated differently: if the test says FCF = EBITDA − CAPEX, it means exactly that. Margin is on revenue, not on costs; in net debt / EBITDA, debt goes on top.'],
          ['<b>План-факт.</b> Отклонение в % = (факт − план) ÷ план; перерасход — со знаком плюс. Общее отклонение = (сумма факта − сумма плана) ÷ сумма плана, а не среднее отклонений по статьям. Наибольшее отклонение в процентах и в деньгах обычно у разных статей.', '<b>Budget vs actual.</b> Variance in % = (actual − budget) ÷ budget; an overspend is positive. The total variance = (total actual − total budget) ÷ total budget, not the average of the item variances. The biggest variance in per cent and in money usually belong to different items.'],
          ['<b>Средневзвешенное.</b> Средняя цена = Σ(объём × цена) ÷ Σ объёмов. Доля канала в выручке = его объём × цена ÷ общая выручка — это не то же самое, что доля в объёме. Простое среднее цен почти всегда стоит среди вариантов как ловушка.', '<b>Weighted average.</b> Average price = Σ(volume × price) ÷ Σ volumes. A channel’s share of revenue = its volume × price ÷ total revenue — not the same as its share of volume. The simple average of the prices is almost always among the options as a trap.'],
          ['<b>Обратный процент в несколько шагов.</b> Если значение дважды проиндексировали на a% и b%, исходное = X ÷ (1 + b/100) ÷ (1 + a/100). Складывать проценты или вычитать их из нового значения нельзя.', '<b>Multi-step reverse percentage.</b> If a value was indexed twice, by a% and b%, the original = X ÷ (1 + b/100) ÷ (1 + a/100). Do not add the percentages or subtract them from the new value.'],
          ['<b>График и таблица вместе.</b> Сначала сопоставьте периоды и единицы в обоих источниках. Считайте по каждому периоду отдельно (объём × цена × курс) и только потом складывайте. Средняя цена × средний курс × общий объём дадут неверный ответ.', '<b>Chart plus table.</b> First match the periods and units in both sources. Calculate each period separately (volume × price × rate) and only then add up. Average price × average rate × total volume gives the wrong answer.']
        ]],
        ['Быстрый счёт', 'Quick mental maths', [
          ['10% — сдвиг запятой, 5% — половина от 10%, 1% — сотая часть; 15% = 10% + 5%.', '10% moves the decimal point, 5% is half of that, 1% is one hundredth; 15% = 10% + 5%.'],
          ['Рост на 25% = × 1,25; падение на 20% = × 0,8. Рост на 20% и затем падение на 20% дают × 0,96, а не возврат к исходному.', 'A 25% rise = × 1.25; a 20% fall = × 0.8. A 20% rise followed by a 20% fall gives × 0.96, not the starting value.'],
          ['Если варианты отличаются друг от друга на 15–20% и больше, точный расчёт не нужен — хватит оценки.', 'If the options differ by 15–20% or more, an estimate is enough.']
        ]],
        ['Ловушки составителей', 'Traps setters use', [
          ['Процент от неверной базы — от нового значения вместо старого.', 'Percentage of the wrong base — the new value instead of the old.'],
          ['Не тот год или квартал в таблице с несколькими периодами.', 'The wrong year or quarter in a multi-period table.'],
          ['360 дней вместо 365, сутки вместо года, тысячи вместо миллионов.', '360 days instead of 365, days instead of years, thousands instead of millions.'],
          ['Абсолютный прирост вместо процентного в вопросах «где выросло сильнее».', 'Absolute growth instead of percentage growth in “which grew most” questions.'],
          ['Забытый дисконт, курс или коэффициент в многошаговом расчёте.', 'A missed discount, exchange rate or factor in a multi-step calculation.'],
          ['В Korn Ferry Elements Numerical ответ выбирается из выпадающего списка, где вариантов часто 10 и больше. Сначала посчитайте, потом ищите своё число в списке: близкие значения в нём часто соответствуют типичным ошибкам.', 'In Korn Ferry Elements Numerical you pick the answer from a drop-down list that often has 10 or more values. Calculate first, then find your number: nearby values often match typical mistakes.']
        ]],
        ['Лайфхаки', 'Tips', [
          ['Держите рядом бумагу и записывайте промежуточные результаты, чтобы не пересчитывать.', 'Keep paper at hand and write down interim results so you do not recalculate.'],
          ['Округляйте только в конце, промежуточные значения держите с 3–4 знаками.', 'Round only at the end; keep 3–4 digits in interim values.'],
          ['Читайте график целиком: начинается ли ось с нуля, нет ли второй оси, сложены ли столбцы. Среднее из процентов равно общему проценту, только если базы одинаковы.', 'Read the whole chart: does the axis start at zero, is there a second axis, are the bars stacked? An average of percentages equals the overall percentage only if the bases are equal.'],
          ['В SHL Interactive иногда нужно ввести число или перетащить столбец графика. Потренируйтесь отвечать без готовых вариантов: решайте задачу до того, как смотреть на ответы. В тренажёре для этого есть фильтры «Ввод числа (SHL)» и «Графики и таблицы (SHL Interactive)».', 'SHL Interactive sometimes asks you to type a number or drag a chart bar. Practise answering without options: solve the item before looking at the choices. The trainer’s “Type the number (SHL)” and “Charts and tables (SHL Interactive)” filters do exactly this.'],
          ['При вводе числа ошибка формата стоит столько же, сколько ошибка в расчёте. Округляйте ровно так, как сказано в задании; для снижения ставьте минус; единицы уже указаны рядом с полем — вводите только число. Перед отправкой подставьте ответ обратно в условие.', 'When typing a number, a format slip costs as much as a calculation error. Round exactly as instructed; use a minus sign for a decrease; the units are shown next to the box, so enter only the number. Before submitting, plug your answer back into the question.']
        ]]
      ]
    },
    ded: {
      intro: T('Всё, что нужно, есть в условии. Задача не догадаться, а строго вывести ответ.', 'Everything you need is in the conditions. The task is not to guess but to derive the answer strictly.'),
      blocks: [
        ['Порядок, расписание, рассадка', 'Ordering, schedules, seating', [
          ['Нарисуйте слоты: 1 _ 2 _ 3 _ 4 _ 5 или сетку «время × комната».', 'Draw the slots: 1 _ 2 _ 3 _ 4 _ 5, or a time × room grid.'],
          ['Начните с жёстких условий: точное место, «сразу после», «в одной комнате».', 'Start with the tight conditions: exact place, “immediately after”, “in the same room”.'],
          ['Склейте связанные элементы в блоки (А сразу после Б → «БА») и двигайте блоками.', 'Glue linked items into blocks (A right after B → “BA”) and move the blocks.'],
          ['Условия с «не», «раньше», «позже» применяйте последними — они отсекают оставшиеся варианты.', 'Apply “not”, “before” and “after” last — they eliminate the remaining options.'],
          ['Часто для ответа не нужно решать всё: спрашиваемое место определяется раньше полной расстановки.', 'Often you do not need the full solution: the asked position is fixed before everything else.'],
          ['В интерактивных заданиях SHL (составить расписание, распределить комнаты) перечитывайте условия после каждого размещения: одно пропущенное «не» ломает решение.', 'In SHL interactive tasks (build a schedule, assign rooms) re-read the conditions after each placement: one missed “not” breaks the solution.'],
          ['Рассадка: число мест — тоже условие. Если в кабинете уже сидят двое, остальные туда не попадают, и часто именно это даёт последний шаг.', 'Room allocation: the number of seats is a condition too. Once an office has two people, nobody else can go there — often that gives the final step.'],
          ['Ранжирование: условия «A больше B» выстраивайте в цепочку A > B > C, а «сразу после» склеивайте в блок. Обычно одна цепочка и один блок задают почти весь порядок.', 'Ranking: chain the “A is above B” conditions into A > B > C, and glue “immediately after” into a block. Usually one chain and one block fix almost the whole order.'],
          ['Расписание и календарь: проверяйте не только время начала, но и весь отрезок события. Типичная ловушка — окно короче встречи или день, после которого идут выходные. Строки людей, которых нет в условии, — шум.', 'Schedules and calendars: check the whole length of the event, not just its start. Typical traps are a window shorter than the meeting, or a day followed by a weekend. Rows for people not named in the task are noise.'],
          ['Календарь: «не менее двух полных рабочих дней между X и началом» — считаются только рабочие дни строго между ними; сам день X, день начала и выходные не считаются. «Закончиться не позже 23-го» относится к последнему дню события, а не к первому.', 'Calendars: “at least two full working days between X and the start” counts only working days strictly in between; day X, the start day and weekends do not count. “End no later than the 23rd” applies to the event’s last day, not its first.'],
          ['Планирование задач: раннее начало задачи = самое позднее окончание её предшественников. Срок проекта — самое позднее окончание, а не сумма длительностей. Резерв — на сколько задачу можно сдвинуть, не задев срок; у задач критического пути резерв 0.', 'Task scheduling: a task’s earliest start = the latest finish of its predecessors. The project length is the latest finish, not the sum of durations. Float is how far a task can slip without moving the end date; critical-path tasks have zero float.'],
        ]],
        ['Когда допустимых расстановок несколько', 'When several arrangements are possible', [
          ['Прочитайте вопрос: «обязательно верно» — в любой допустимой расстановке, «может быть верно» — хотя бы в одной, «точно неверно» — ни в одной.', 'Read the stem: “must be true” holds in every valid arrangement, “could be true” in at least one, “cannot be true” in none.'],
          ['Выпишите две-три допустимые расстановки. Обычно этого хватает, чтобы сразу отсечь большую часть вариантов.', 'Write out two or three valid arrangements. That is usually enough to rule out most options at once.'],
          ['«Может быть верно»: варианты, которые нарушают условия, отсекаются быстро. Для оставшегося достаточно найти одну подходящую расстановку.', '“Could be true”: options that break a condition drop out quickly. For the one left, a single valid arrangement is enough.'],
          ['«Точно неверно»: добавьте утверждение к условиям и попробуйте расставить всех. Не получилось — это ответ.', '“Cannot be true”: add the statement to the conditions and try to place everyone. If you cannot, that is the answer.'],
          ['«Обязательно верно»: ищите допустимую расстановку, в которой утверждение ложно. Нашли — вариант отпадает.', '“Must be true”: look for a valid arrangement in which the statement is false. If you find one, the option is out.']
        ], true],
        ['Логические выводы', 'Logical conclusions', [
          ['Рисуйте круги Эйлера. «Все A — B»: круг A внутри B. «Ни один A не B»: круги не пересекаются. «Некоторые A — B»: есть хотя бы одна общая точка.', 'Draw Euler circles. “All A are B”: A inside B. “No A is B”: circles apart. “Some A are B”: at least one shared point.'],
          ['«Некоторые» значит «хотя бы один, возможно все».', '“Some” means “at least one, possibly all”.'],
          ['«Все A — B» не означает «все B — A», но из него следует «некоторые B — A», если группа A непуста (в тренажёре это сказано в условии, в тестах обычно так же). «Некоторые A — B» равносильно «некоторые B — A», «ни один A не B» — «ни один B не A».', '“All A are B” does not mean “all B are A”, but it does give “some B are A”, provided group A is non-empty (the trainer states this; tests usually assume it). “Some A are B” equals “some B are A”, and “no A is B” equals “no B is A”.'],
          ['«Некоторые A не B» переворачивать нельзя.', '“Some A are not B” cannot be reversed.'],
          ['Отрицание «все A — B» — «некоторые A не B», а не «ни один A не B». Отрицание «некоторые A — B» — «ни один A не B».', 'The negation of “all A are B” is “some A are not B”, not “no A is B”. The negation of “some A are B” is “no A is B”.'],
          ['Вывод верен, только если его нельзя опровергнуть ни одним рисунком, совместимым с условиями. Нашли контрпример — вывод не обязателен.', 'A conclusion holds only if no drawing consistent with the premises refutes it. Found a counter-example? Then it is not certain.'],
          ['Не используйте знания о реальном мире: если в условии сказано «все месторождения шельфовые», так и считайте.', 'Do not use real-world knowledge: if the premise says all fields are offshore, accept it.'],
          ['Вариант «ни одно не следует» тоже бывает верным. Не бойтесь его выбирать.', '“None of these follows” can be the right answer. Do not be afraid to pick it.']
        ]],
        ['Правило «если — то»', '“If — then” rules', [
          ['Из «если А, то Б» и «А» следует «Б».', 'From “if A then B” and “A”, “B” follows.'],
          ['Из «если А, то Б» и «не Б» следует «не А».', 'From “if A then B” and “not B”, “not A” follows.'],
          ['Из «если А, то Б» и «Б» про А ничего не следует. Из «не А» ничего не следует про Б.', 'From “if A then B” and “B”, nothing follows about A. From “not A”, nothing follows about B.'],
          ['«А, только если Б» означает «если А, то Б».', '“A only if B” means “if A then B”.'],
          ['«А, если Б» означает «если Б, то А». «А, если не Б» (<i>A unless B</i>) означает «если не Б, то А».', '“A if B” means “if B then A”. “A unless B” means “if not B then A”.'],
          ['«Если А, то Б» равносильно «если не Б, то не А». Цепочки складываются: из «А → Б» и «Б → В» следует «А → В».', '“If A then B” is the same as “if not B then not A”. Chains combine: from A → B and B → C, A → C follows.'],
          ['«Ровно один из А и Б»: если А, то не Б, а если не А, то Б.', '“Exactly one of A and B”: if A then not B, and if not A then B.'],
          ['«А и Б не могут быть одновременно»: если А, то не Б, и если Б, то не А. Вариант «ни А, ни Б» не запрещён.', '“A and B cannot both happen”: if A then not B, and if B then not A. “Neither A nor B” is still allowed.'],
          ['«Хотя бы один из А и Б» означает «если не А, то Б» (и «если не Б, то А»).', '“At least one of A and B” means “if not A then B” (and “if not B then A”).'],
          ['Если факта в условии нет, переберите случаи по элементу, который чаще всего встречается в правилах: «да» и «нет». Два случая обычно быстро раскрывают остальные элементы.', 'If no fact is given, split into cases on the element that appears in the most rules: “yes” and “no”. Two cases usually settle the rest quickly.']
        ]]
      ]
    },
    verb: {
      intro: T('Проверяется точность чтения. Текст — единственный источник правды, даже если вы знаете отрасль лучше автора.', 'This tests careful reading. The passage is the only source of truth, even if you know the industry better than the author.'),
      blocks: [
        ['«Верно / Неверно / Нельзя сказать»: алгоритм', 'True / False / Cannot say: routine', [
          ['Сначала прочитайте утверждение и выделите ключевые слова: кто, что, сколько, когда, «все», «только», «уже».', 'Read the statement first and pick out the key words: who, what, how much, when, “all”, “only”, “already”.'],
          ['Найдите в тексте место, о котором идёт речь. Перечитывать весь текст не нужно.', 'Find the part of the passage it refers to. No need to re-read everything.'],
          ['Спросите себя: следует ли утверждение из текста — прямо, через перефразирование, простой расчёт или неизбежный вывод (Верно); противоречит ли ему текст — прямо или по тем же правилам (Неверно); или данных не хватает ни для того, ни для другого (Нельзя сказать)?', 'Ask: does the statement follow from the passage — directly, by paraphrase, simple calculation or necessary inference (True); does the passage rule it out, directly or in the same ways (False); or is there not enough information either way (Cannot say)?'],
          ['Сомневаетесь между «Неверно» и «Нельзя сказать» — спросите, может ли утверждение быть верным, если всё в тексте правда. Может — «Нельзя сказать». Не может — «Неверно».', 'Torn between False and Cannot say? Ask whether the statement could be true if everything in the passage is true. If it could — Cannot say. If it could not — False.']
        ], true],
        ['Слова-ловушки', 'Trap words', [
          ['«Все», «только», «всегда», «никогда», «ни один»: одно исключение в тексте делает утверждение неверным.', '“All”, “only”, “always”, “never”, “none”: one exception in the passage makes the statement false.'],
          ['«В основном» не равно «только».', '“Mainly” does not mean “only”.'],
          ['«Планирует», «ожидает», «рассматривает» не равно «сделал». Прогноз — не факт.', '“Plans”, “expects”, “is considering” do not mean “has done”. A forecast is not a fact.'],
          ['«После» не значит «из-за». Совпадение по времени ещё не причина.', '“After” does not mean “because of”. Timing alone is not a cause.'],
          ['«Аналитики считают», «руководство полагает» — это мнение, а не установленный факт. Если в тексте сказано, что руководство ожидает X, то «руководство ожидает X» — «Верно», а «X произойдёт» — «Нельзя сказать».', '“Analysts believe”, “management thinks” — that is an opinion, not an established fact. If the passage says management expects X, “Management expects X” is True; “X will happen” is Cannot say.'],
          ['Следите за сменой охвата: компания и отрасль, один регион и вся страна, «одна из крупнейших» и «крупнейшая», 2025 и 2026 годы.', 'Watch for scope shifts: company vs industry, one region vs the whole country, “one of the largest” vs “the largest”, 2025 vs 2026.'],
          ['Абсолютное утверждение («все», «всегда»), которому в тексте нет ни подтверждения, ни исключения, — обычно «Нельзя сказать», а не «Верно».', 'An absolute claim (“all”, “always”) with neither support nor an exception in the passage is usually Cannot say, not True.'],
          ['Расчёт допустим: если из цифр текста простым счётом выходит ответ, это «Верно» или «Неверно», а не «Нельзя сказать».', 'Calculation is allowed: if simple maths on the passage’s figures gives the answer, it is True or False, not Cannot say.']
        ]],
        ['Выбор одного или двух утверждений (Korn Ferry)', 'Choosing one or two statements (Korn Ferry)', [
          ['Оценивайте каждое утверждение отдельно, как мини-вопрос «Верно / Неверно / Нельзя сказать».', 'Judge each statement separately, like a mini True / False / Cannot say item.'],
          ['Отмечайте только утверждения, которые следуют из текста — прямо, через перефразирование, расчёт или неизбежный вывод.', 'Select only statements that follow from the passage — directly, by paraphrase, calculation or necessary inference.'],
          ['В вопросе сказано, сколько утверждений выбрать — одно или два. Выберите ровно столько и не больше.', 'The question says how many statements to choose — one or two. Choose exactly that many.'],
          ['Korn Ferry иногда задаёт вопрос в отрицательной форме: «какое утверждение НЕ следует из текста». Перечитайте вопрос перед ответом.', 'Korn Ferry sometimes asks negatively: “which statement does NOT follow”. Re-read the question before answering.']
        ]],
        ['Анализ текста (ЭКОПСИ)', 'Text analysis (Ecopsy)', [
          ['Читайте вопрос до текста — так сразу понятно, что искать: главную мысль, вывод, противоречие или допущение.', 'Read the question before the passage so you know what to look for: main idea, conclusion, contradiction or assumption.'],
          ['<b>Основная мысль</b> охватывает весь текст, а не одну деталь. Отбрасывайте крайности, подмену причины и следствия и то, чего в тексте нет.', '<b>Main idea</b> covers the whole passage, not one detail. Drop extremes, reversed cause and effect, and anything the passage lacks.'],
          ['<b>Вывод</b> должен быть верен при любом раскладе, который допускает текст. Правило «если А, то Б» нельзя переворачивать.', '<b>Conclusion</b> must hold in every situation the passage allows. “If A then B” cannot be reversed.'],
          ['<b>Противоречие</b> — прямой конфликт с фактом текста. Утверждение, о котором данных нет, тексту не противоречит.', '<b>Contradiction</b> is a direct clash with a fact. A statement with no data in the passage does not contradict it.'],
          ['<b>«Найдите противоречие» и «найдите, о чём нет данных»</b>: пометьте каждое из четырёх утверждений как В, Н или НС. Ответ — единственное утверждение с пометкой Н (противоречие) или НС (нет данных). Если таких получилось два, одно из них вы оценили по своим знаниям, а не по тексту: перепроверьте оба.', '<b>“Find the contradiction” and “find what the passage does not cover”</b>: mark each of the four statements T, F or CS. The answer is the only F (contradiction) or the only CS (not covered). If you end up with two, you judged one by your own knowledge rather than the passage: re-check both.'],
          ['<b>Допущение</b> — то, без чего вывод рушится. Проверка: возьмите отрицание варианта. Если аргумент перестаёт работать, это допущение.', '<b>Assumption</b> is what the argument needs. Test it by negating the option: if the argument collapses, that is the assumption.']
        ]],
        ['Усиление и ослабление аргумента', 'Strengthening and weakening an argument', [
          ['Найдите вывод — он часто стоит после слов «поэтому», «делает вывод», «считает» — и посылку, на которой он держится.', 'Find the conclusion — often after “so”, “concludes”, “argues” — and the premise it rests on.'],
          ['Определите тип аргумента. <b>Причина</b> («рост вызван новой технологией»): ослабляют другая причина или другое изменение в тот же период; подкрепляет сравнение с группой, где ничего не меняли.', 'Identify the type of argument. <b>Cause</b> (“growth was caused by the new technology”): another cause or another change in the same period weakens it; a comparison with a group where nothing changed strengthens it.'],
          ['<b>Обобщение по выборке</b> («90% опрошенных довольны, значит, это подойдёт всем»): ослабляют нерепрезентативная выборка и самоотбор участников; подкрепляют широкий охват и случайный отбор.', '<b>Generalising from a sample</b> (“90% of those surveyed are happy, so it suits everyone”): an unrepresentative sample or self-selection weakens it; wide coverage and random selection strengthen it.'],
          ['<b>План или прогноз</b> («окупится за три года», «маржа вырастет»): ослабляет то, что ключевое условие не сохранится (цена, тариф, срок службы); подкрепляют фактические результаты пилота и подтверждение, что условия сохранятся.', '<b>Plan or forecast</b> (“it will pay back in three years”, “margins will rise”): it is weakened if a key condition will not hold (price, tariff, service life); pilot results and evidence that conditions will persist strengthen it.'],
          ['Не влияют: мотивы автора, затраты, если вывод не о затратах, и сведения о других компаниях без сравнения. Из двух подходящих вариантов сильнее тот, что бьёт прямо по связи посылки с выводом.', 'Irrelevant: the author’s motives, cost when the conclusion is not about cost, and facts about other companies with no comparison. Of two plausible options, the stronger one hits the link between premise and conclusion directly.']
        ], true],
        ['Если тест на английском', 'If the test is in English', [
          ['Полезные слова: <i>cannot say</i> — нельзя сказать; <i>respectively</i> — соответственно; <i>at least / at most</i> — не менее / не более; <i>unless</i> — если не; <i>mainly</i> — в основном; <i>rose by / rose to</i> — выросла на / выросла до; <i>no more than</i> — не более; <i>provided that</i> — при условии, что; <i>one of the</i> — один из.', 'Useful words: <i>respectively</i>, <i>at least / at most</i>, <i>unless</i>, <i>mainly</i>, <i>rose by</i> vs <i>rose to</i>, <i>no more than</i>, <i>provided that</i>, <i>one of the</i> — read them literally.'],
          ['Не переводите весь текст в голове: ищите в нём ключевые слова утверждения.', 'Do not translate the whole passage in your head: look for the statement’s key words.'],
          ['Модальные слова <i>may</i>, <i>could</i>, <i>is expected to</i> обозначают возможность, а не факт.', 'Modal words like <i>may</i>, <i>could</i>, <i>is expected to</i> signal possibility, not fact.']
        ]]
      ]
    },
    time: {
      intro: T('Результат зависит не только от логики, но и от темпа. Ниже — расчёт времени на вопрос по открытым данным о форматах и практические правила.', 'Results depend on pace as well as logic. Below are per-item timings based on published formats, plus practical rules.'),
      blocks: [
        ['Время на вопрос', 'Time per item', [
          ['SHL Verify Interactive: индуктивный — около 72 с (18 мин ÷ 15), числовой — около 108 с (18 мин ÷ 10), дедуктивный — около 90 с (18 мин ÷ 12).', 'SHL Verify Interactive: inductive about 72 s (18 min ÷ 15), numerical about 108 s (18 min ÷ 10), deductive about 90 s (18 min ÷ 12).'],
          ['SHL Verbal — около 38 секунд на утверждение (19 мин ÷ 30). Это самый быстрый темп.', 'SHL Verbal — about 38 seconds per statement (19 min ÷ 30). This is the fastest pace.'],
          ['SHL Verify G+ — около 90 секунд на вопрос (36 мин ÷ 24).', 'SHL Verify G+ — about 90 seconds per item (36 min ÷ 24).'],
          ['Korn Ferry Elements — отдельный таймер на каждый вопрос: 60–90 секунд. Больше всего времени даётся на первый вопрос к новой таблице или тексту — потратьте его на то, чтобы разобраться в данных: следующие вопросы будут по ним же.', 'Korn Ferry Elements — a separate timer on every item: 60–90 seconds. The first question on a new table or passage gets the most time — use it to understand the data, because the next questions use the same data.'],
          ['ЭКОПСИ Switch (по неофициальным данным) — до 45 секунд на лёгкие задания, до 60 на средние и до 90 на сложные.', 'Ecopsy Switch (unofficial data) — up to 45 seconds for easy items, up to 60 for medium and up to 90 for hard ones.']
        ]],
        ['Тактика по провайдерам', 'Tactics by provider', [
          ['Во всех трёх форматах вопросы идут по одному: пропустить вопрос и вернуться к нему позже обычно нельзя. Тактика «сначала лёгкие, потом трудные» здесь не работает.', 'In all three formats items come one at a time: you usually cannot skip an item and come back to it. “Easy ones first, hard ones later” does not work here.'],
          ['SHL: таймер общий. Знайте средний темп своего теста (индуктивный ≈72 с, дедуктивный ≈90 с, числовой ≈108 с, вербальный ≈38 с) и не тратьте на один вопрос больше полуторной нормы — дайте лучший ответ и двигайтесь дальше.', 'SHL: one overall timer. Know your test’s average pace (inductive ≈72 s, deductive ≈90 s, numerical ≈108 s, verbal ≈38 s) and spend no more than about 1.5 times that on one item — give your best answer and move on.'],
          ['SHL Interactive: по описанию SHL, интерактивные задания оцениваются по нескольким баллам, и частично верная рассадка или расстановка приносит часть балла (в тренажёре так же). Но введённое число либо верно, либо нет. Оставляйте 15–20 секунд, чтобы пройтись по каждому условию перед отправкой.', 'SHL Interactive: per SHL, interactive items use multi-point scoring, so a partly correct allocation or ranking earns partial credit (the trainer does the same). A typed number, though, is simply right or wrong. Keep 15–20 seconds to run through every condition before submitting.'],
          ['SHL: за неверный ответ обычно не штрафуют (проверьте инструкцию), поэтому пустые вопросы невыгодны. Если время кончается, дайте лучший ответ на текущий вопрос, а не оставляйте его пустым.', 'SHL: wrong answers are usually not penalised (check the instructions), so blanks cost you. If time is running out, give your best answer to the current item rather than leave it blank.'],
          ['Korn Ferry: остаток времени не переносится на следующий вопрос. Решили — переходите, но не жертвуйте точностью ради скорости: сэкономленное время не пригодится.', 'Korn Ferry: unused time does not carry over. Once solved, move on, but do not trade accuracy for speed — saved time is lost anyway.'],
          ['Korn Ferry: выберите предварительный ответ, как только он у вас появится, и уточняйте его, пока идёт время. Если таймер истечёт, выбранный ответ засчитается; без ответа балла не будет, а следующий вопрос станет проще.', 'Korn Ferry: pick a provisional answer as soon as you have one and refine it while time remains. If the timer runs out, the selected answer is submitted; a blank scores nothing and the next item gets easier.'],
          ['Korn Ferry адаптивный: если вопросы стали труднее, это хороший знак.', 'Korn Ferry is adaptive: if items get harder, that is a good sign.'],
          ['ЭКОПСИ Switch: у каждого задания свой лимит. В числовом и вербальном тестах первые задания простые и короткие по времени (до 45 с) — решайте их быстро и без ошибок; на последних трёх сложных времени больше (до 90 с). Абстрактно-логический тест адаптивный.', 'Ecopsy Switch: every item has its own limit. In numerical and verbal the first items are easy and short (up to 45 s) — solve them quickly and accurately; the last three hard items get more time (up to 90 s). The abstract test is adaptive.']
        ]],
        ['Перед тестом', 'Before the test', [
          ['Узнайте точное название теста из приглашения (Verify Numerical, Elements Logical и т. п.) и тренируйте именно этот формат.', 'Find the exact test name in the invitation (Verify Numerical, Elements Logical, etc.) and practise that format.'],
          ['Пройдите демо-вопросы перед стартом: это бесплатное время, чтобы привыкнуть к интерфейсу.', 'Do the demo items before starting: it is free time to get used to the interface.'],
          ['Ноутбук лучше телефона: таблицы и графики читать удобнее.', 'A laptop beats a phone: tables and charts are easier to read.'],
          ['Подготовьте стабильный интернет, зарядку и тихое место: 30–60 минут на один тест, до 2–3 часов на комплексную оценку вроде ЭКОПСИ Potential in Focus. Выключите уведомления: внутри блока перерыв сделать нельзя, таймер продолжает идти.', 'Arrange a stable connection, a charger and a quiet place: 30–60 minutes for one test, up to 2–3 hours for a full battery such as Ecopsy Potential in Focus. Turn off notifications: you cannot pause within a block and the timer keeps running.'],
          ['Держите под рукой обычный калькулятор, бумагу и ручку. Калькулятор в телефоне хуже: тест может идти на том же телефоне, а переключение между окнами отнимает время. Для Elements Numerical калькулятор нужен — возьмите свой.', 'Keep a physical calculator, paper and a pen at hand. A phone app is worse: the test may run on that same phone, and switching windows costs time. Elements Numerical needs a calculator — bring your own.'],
          ['Проходите тест сами: работодатель может попросить пройти короткий проверочный тест под наблюдением на следующем этапе, и большой разрыв с онлайн-результатом будет заметен.', 'Take the test yourself: an employer may ask you to sit a short supervised check at a later stage, and a big gap from your online score shows up.'],
          ['SHL Verify Interactive доступен на английском и нескольких европейских языках, но не на русском; в России его обычно проходят на английском. ЭКОПСИ и Korn Ferry предлагают русскую версию.', 'SHL Verify Interactive is offered in English and several European languages but not Russian; in Russia it is usually taken in English. Ecopsy and Korn Ferry offer Russian versions.'],
          ['Лучше проходить на свежую голову, а не вечером после тяжёлого дня.', 'Take it when you are fresh, not late after a long day.']

        ['План подготовки на 1–2 недели', 'A 1–2 week preparation plan', [
          ['Дни 1–3: тренировка уровня Senior по 20 вопросов в каждом модуле. Читайте разбор каждой ошибки.', 'Days 1–3: Senior practice, 20 items per module. Read the breakdown of every mistake.'],
          ['Дни 4–7: откройте «Статистику» и тренируйте два самых слабых типа заданий точечно.', 'Days 4–7: open Progress and drill your two weakest question types.'],
          ['Дни 8–10: экзамены в формате провайдера из приглашения, один-два в день. Если ждёте ЭКОПСИ для руководящей позиции, пройдите блок Potential in Focus.', 'Days 8–10: exams in the provider’s format from your invitation, one or two a day. If you expect Ecopsy for a management role, take the Potential in Focus block.'],

    }

      'Таймер на каждый вопрос: Numerical — 90 с на первый вопрос к таблице и 75 с на следующие; Verbal — 75 с на первый вопрос к тексту и 60 с на следующие; Logical — 75 с. Неиспользованное время не переносится, вернуться к прошлым вопросам нельзя.',
