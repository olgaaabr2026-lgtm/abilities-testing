<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр тестов способностей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark instrument header band over a cool "test-booklet" paper; one centred working column; progress drawn as a segmented log track. Single light theme by request. */
:root{
  --paper:#F1F4F6; --surface:#FFFFFF; --ink:#15212B; --ink-2:#2B3A47; --muted:#5A6874; --line:#D5DDE3; --line-2:#E6EBEF;
  --accent:#E0552A; --accent-ink:#B5401B; --accent-soft:#FCEBE4;
  --steel:#245B7E; --steel-soft:#E4EEF5;
  --ok:#1D7A4F; --ok-soft:#E2F2E9; --bad:#BC3434; --bad-soft:#FAE6E5; --warn:#A86A12;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--steel);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--ink);color:#E8EEF2;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 34px)}
.band .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;display:block;line-height:1.2}
.brand span{font-size:12px;color:#9FB0BD;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;color:#B8C6D0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-current="true"]{color:#fff;background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid #3A4B59;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#B8C6D0;padding:6px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:34px 18px}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.hero-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero-fig .series{justify-content:center}
.hero-fig .series .fig{width:min(64px,15%)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.provs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.prov{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:var(--surface)}

/* settings */
.section{padding-block:12px 40px}
.settings{display:flex;gap:18px 28px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.settings .hint{font-size:13px;color:var(--muted);flex:1 1 220px;min-width:0}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.mod-art{height:112px;background:linear-gradient(180deg,#F7F9FA,#EEF2F5);border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;padding:12px}
.mod-art svg{height:100%;width:auto;max-width:100%}
.mod-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0;letter-spacing:.005em}
.mod p{margin:0;color:var(--ink-2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--steel);font-weight:500}
.mod-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.mod-stat{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-primary:disabled{background:#E7B9A8;cursor:not-allowed}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:7px 12px;font-size:13.5px}

/* exam list */
.note-box{background:var(--steel-soft);border:1px solid #C9DCE9;border-radius:var(--r);padding:12px 14px;font-size:14px;color:#1C4561;margin-bottom:18px}
.prov-group{margin-bottom:22px}
.prov-group h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.prov-group>p{margin:0 0 10px;color:var(--muted);font-size:14px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.row-main{flex:1 1 260px;min-width:0}
.row-main b{display:block;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2)}
.tag.hot{background:var(--accent-soft);border-color:#F3C9B8;color:var(--accent-ink)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.sbar-title{font-weight:600;font-size:14px;min-width:0;flex:1 1 180px}
.sbar-title small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.warn{color:#fff;background:var(--accent);border-color:var(--accent)}
.timer small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.timer.warn small{color:#FFE3D8}
.track{display:flex;gap:3px;flex:2 1 260px;min-width:0;align-items:center}
.track i{flex:1;height:8px;border-radius:2px;background:var(--line-2);display:block;min-width:3px}
.track i.on{background:var(--ink)}
.track i.ok{background:var(--ok)}
.track i.bad{background:var(--bad)}
.track i.cur{background:var(--accent);height:12px}
.qwrap{max-width:900px;margin:0 auto;padding-block:22px 60px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-family:var(--mono);font-size:13px;color:var(--muted)}
.qtype{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);background:var(--steel-soft);padding:3px 9px;border-radius:6px}
.lvl{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted)}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--ink-2)}
.prompt{font-size:18px;font-weight:600;margin:4px 0 16px;text-wrap:balance;line-height:1.4}
.visual{margin-bottom:18px}
.series{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.series .fig{width:min(88px,15.2%);height:auto;flex:none}
.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,104px));gap:6px;justify-content:center;background:var(--paper);padding:10px;border-radius:12px;width:max-content;max-width:100%;margin:0 auto}
.matrix .fig{width:100%;height:auto;display:block}
.fig{display:block}
.opts{display:grid;gap:10px}
.opts.figs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.opts.txt{grid-template-columns:1fr}
.opts.short{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;position:relative;transition:border-color .12s, background-color .12s}
.opt:hover:not(:disabled){border-color:#9FB2C1;background:#FAFCFD}
.opt .ol{font-family:var(--mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt .ot{min-width:0;padding-top:1px}
.opts.figs .opt{flex-direction:column;align-items:center;padding:8px}
.opts.figs .opt .fig{width:100%;max-width:132px;height:auto}
.opt.multi .ol{border-radius:5px}
.opt.sel{border-color:var(--steel);background:var(--steel-soft)}
.opt.sel .ol{background:var(--steel);color:#fff;border-color:var(--steel)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ol{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qact{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--sbarH, 60px));z-index:4;background:var(--surface);margin:14px -22px 0;padding:10px 22px}
.qact.rev{border-bottom:1px solid var(--line-2);box-shadow:0 6px 10px -10px rgba(21,33,43,.35)}
.actions .spacer{flex:1}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.passage{background:#FAFBFC;border:1px solid var(--line-2);border-left:3px solid var(--ink);border-radius:8px;padding:14px 16px}
.passage h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.passage p{margin:0;max-width:72ch}
.statement{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--steel-soft);font-weight:600;color:#14384F}
.statement .lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--steel);margin-bottom:2px}
.logic p{margin:0 0 8px}
.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.clues li{padding-left:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px}
.dt{border-collapse:collapse;width:100%;font-size:14px}
.dt caption{caption-side:top;text-align:left;font-weight:600;padding:10px 12px 8px;font-size:13.5px}
.dt th,.dt td{padding:7px 12px;border-top:1px solid var(--line-2);white-space:nowrap}
.dt thead th{background:var(--paper);font-weight:600;font-size:12.5px;color:var(--ink-2);text-align:left}
.dt .r{text-align:right}
.dt tbody th{text-align:left;font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.cap{font-weight:600;font-size:13.5px;margin:0 0 6px}
.chart-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px;padding:6px 4px 0;background:#fff}
.chart{width:100%;min-width:480px;height:auto;display:block}

/* feedback */
.fb{margin-top:18px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.fb-head{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.fb.good .fb-head{background:var(--ok-soft)}
.fb.wrong .fb-head{background:var(--bad-soft)}
.verdict{font-family:var(--display);font-weight:600;font-size:16px}
.fb.good .verdict{color:var(--ok)}
.fb.wrong .verdict{color:var(--bad)}
.fb-head .ans{font-size:14px;color:var(--ink-2)}
.fb-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.fb-body h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rules{margin:4px 0 0;padding-left:20px}
.rules li+li{margin-top:3px}
.calc{font-family:var(--mono);font-size:14px;background:var(--paper);padding:8px 10px;border-radius:7px;margin:4px 0 0;overflow-x:auto}
.sol-order{margin:4px 0 0;padding-left:24px;display:flex;flex-wrap:wrap;gap:4px 26px}
.notes{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.notes li{display:flex;gap:10px;font-size:14px;padding:5px 8px;border-radius:7px}
.notes li b{font-family:var(--mono);flex:none;width:18px}
.notes.traps li b{width:auto;min-width:76px;white-space:nowrap}
.dt.wrap th,.dt.wrap td{white-space:normal}
.notes li.mine{background:var(--bad-soft)}
.notes li.right{background:var(--ok-soft)}
.tip{font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;color:#5E2510}
.tip b{color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(21,33,43,.25)}

/* results */
.res-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;margin-bottom:18px}
.score{background:var(--ink);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden}
.score .big{font-family:var(--display);font-weight:600;font-size:56px;line-height:1;margin:10px 0 6px;letter-spacing:-.02em}
.score .big small{font-size:22px;color:#9FB0BD}
.score .band-lbl{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:var(--accent);font-size:13px;font-weight:600}
.score .eyebrow{color:#9FB0BD}
.score p{margin:10px 0 0;color:#C9D4DC;font-size:13px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kv h3,.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar-row.wbtn{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto}
.bar-row .lb{min-width:0;overflow-wrap:break-word;hyphens:auto}
.bar-row .meter{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-row .meter i{display:block;height:100%;border-radius:4px;background:var(--steel)}
.bar-row .meter i.lo{background:var(--bad)}
.bar-row .meter i.mid{background:var(--warn)}
.bar-row .meter i.hi{background:var(--ok)}
.bar-row .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink-2);white-space:nowrap;min-width:44px}
.rv-empty{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:14px}
.qcard:focus{outline:none}
.qwrap{scroll-margin-top:96px}
.facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.review summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px}
.review summary::-webkit-details-marker{display:none}
.review summary .mk{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.mk.y{background:var(--ok)} .mk.n{background:var(--bad)} .mk.s{background:#9AA7B2} .mk.p{background:#D9A23B}
.review summary .st{min-width:0;flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review summary .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.review .rv{padding:0 14px 16px;border-top:1px solid var(--line-2)}
.review .rv .qcard{border:0;padding:14px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:8px 6px;border-top:1px solid var(--line-2);text-align:left;white-space:nowrap}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist .r{text-align:right;font-family:var(--mono)}
.guide h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 8px}
.guide ul,.guide ol{margin:6px 0 0;padding-left:22px;max-width:80ch}
.guide li+li{margin-top:6px}
.guide li::marker{color:var(--accent);font-weight:600}
.guide .src{font-size:13px;color:var(--muted)}
.guide a{color:var(--steel)}
.sum-tip{font-size:14px;color:var(--ink-2)}
.ibars svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ibars .hit{cursor:ns-resize}
.barctl{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.barctl .bc{display:flex;align-items:center;gap:6px;font-size:13px}
.barctl .bc span{min-width:44px;font-weight:600}
.barctl button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font:600 16px var(--mono);cursor:pointer;color:var(--ink)}

.code{letter-spacing:.08em;font-weight:600}

.pie-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;padding:12px;background:#fff}

.cal-wrap{overflow-x:auto}

  P('ru', 'Отечественное оборудование', 'Компания «Ангара-Нефть» поставила цель довести долю отечественного оборудования в закупках до 80% к 2028 году. В 2025 году эта доля составила 64%. Наибольшие трудности связаны с насосами для добычи высоковязкой нефти: российские аналоги пока проходят опытные испытания. Компания готова заключать долгосрочные контракты с отечественными производителями, только если их оборудование дороже импортных аналогов не более чем на 15%.', [

  P('ru', 'Методика оценки проектов', 'Методика оценки проектов «Обь-Инвест» предписывает рассчитывать NPV в реальных ценах по ставке 10%. Для проектов в регионах с повышенным политическим риском к ставке добавляется премия от 2 до 5 процентных пунктов. Зарубежные проекты дополнительно проверяются на чувствительность к курсу местной валюты. В 2025 году методику дополнили требованием оценивать стоимость выбросов углерода.', [
    ['Для проекта в регионе с повышенным политическим риском ставка дисконтирования может составить 14%.', 'T', '10% + премия от 2 до 5 п. п. — значит, от 12% до 15%; 14% входит в диапазон.'],

    ['Все зарубежные проекты компании относятся к регионам с повышенным политическим риском.', 'C', 'Связи между зарубежными проектами и политическим риском текст не устанавливает.']]);

  P('en', 'Farm-out deal', 'Brantwood Energy has agreed to farm out a 30% interest in its Block 12 licence to Orion Petroleum. In exchange, Orion will pay 45% of the cost of the next two exploration wells, capped at $60 million. Brantwood remains operator and keeps 70% of the licence. The deal still requires approval from the national petroleum regulator, which typically takes three to six months.', [

  P('en', 'LNG carrier fleet', 'Coral Bay LNG charters out its fleet of six carriers on contracts of seven to ten years. Two vessels are due to come off charter in 2027. Spot charter rates for LNG carriers fell by more than half during 2025 as a large number of newbuilds entered service. The company intends to re-charter the two vessels on long-term contracts rather than trade them on the spot market.', [

  P('en', 'Cut-off grade', 'Following a rise in gold prices, Westgate Mining lowered the cut-off grade at its Kalgoon pit from 0.9 to 0.7 grams per tonne. Material that was previously treated as waste can now be processed profitably, increasing the pit’s reserves by 18%. However, the lower average grade means that each tonne processed contains less gold, so the plant must process more ore to maintain output.', [

  P('en', 'Field decommissioning', 'The Harrow field in the North Sea ceased production in 2024 after 38 years. Decommissioning will take place in three phases: plugging and abandoning the wells, removing the topsides, and finally removing or leaving in place the steel jacket. Regulators will decide on the jacket only after an environmental assessment. The operator estimates total decommissioning costs at £420 million, of which about 40% relates to well plugging.', [
    ['The Harrow field was already producing in 1990.', 'T', 'It produced for 38 years until 2024, so production began around 1986, before 1990.'],

  P('en', 'Green hydrogen export', 'Sahra Energy is building a 300-megawatt electrolyser powered by a dedicated solar farm to produce green hydrogen for export as ammonia. The project has secured a 20-year offtake agreement with a European utility for 60% of its output. The final investment decision was taken in March 2026, and first production is scheduled for 2029. The company has not yet found buyers for the remaining volumes.', [

  P('en', 'Near-miss reporting', 'Since 2024 Pinecrest Oil has required all drilling contractors to report near-miss incidents within 24 hours. The number of reported near misses tripled in the first year, while recordable injuries fell by 20%. Management believes that the rise in near-miss reports reflects better reporting rather than more dangerous operations. Contractors that fail to report face a reduction in their performance bonus.', [

  P('en', 'Heavy crude discount', 'Heavy sour crude from the Qamar field sells at a discount to Brent because it yields less gasoline and diesel and requires more complex refining. In 2025 the average discount widened from $4 to $7 per barrel because several refineries equipped to process heavy crude closed for maintenance. Qamar Petroleum expects the discount to narrow once those refineries restart, but it has not hedged the differential.', [

  P('en', 'Polymer flooding pilot', 'At the Rimal field, water injection has been used for 15 years to maintain reservoir pressure. Last year the operator began a polymer flooding pilot in one section of the field. Polymers make the injected water more viscous, helping it push more oil towards producing wells. Early results show a 6% increase in oil recovery in the pilot area. The operator will decide on a field-wide rollout after evaluating chemical costs.', [

  P('en', 'Leverage after an acquisition', 'Following the acquisition of a rival producer, Corvane Resources’ net debt rose to 2.8 times annual EBITDA. A ratings agency placed the company’s credit rating on watch for a possible downgrade, saying it would decide on the rating once Corvane sets out its debt reduction plan. Corvane has not yet published the plan, but it has said it aims to bring leverage below 2.0 times within two years, mainly through asset sales.', [

  P('en', 'National workforce quota', 'A new rule requires private companies with more than 50 employees to raise the share of national staff in skilled roles by 2 percentage points each year. Ras Al Barr Services, a private company, has 120 employees, and nationals currently hold 9% of its skilled roles. Companies that miss the target pay a monthly contribution for each unfilled position. Ras Al Barr plans to meet the requirement through a graduate hiring programme with a local university.', [

  PA('ru', 'idea', 'Критерии отбора проектов', 'Ещё десять лет назад нефтегазовые компании оценивали проекты прежде всего по объёму запасов. Сегодня на первый план вышли скорость возврата капитала и устойчивость к низким ценам: инвесторы готовы мириться с меньшим ростом добычи, если компания стабильно выплачивает дивиденды. Поэтому крупные проекты с длинным инвестиционным циклом всё чаще уступают место коротким проектам на уже освоенных месторождениях, даже если их суммарный ресурсный потенциал ниже.', [
    ['Критерии отбора проектов сместились от масштаба запасов к быстрой окупаемости и устойчивости к низким ценам.', 'Эта мысль охватывает весь текст: что было, что изменилось и к чему это привело.'],
    ['Инвесторы больше не интересуются ростом добычи.', 'Слишком сильное утверждение: инвесторы «готовы мириться с меньшим ростом», а не отказались от него.'],
    ['Крупные проекты с длинным циклом невыгодны при любых ценах.', 'В тексте этого нет: такие проекты уступают по приоритету, а не невыгодны всегда.'],
    ['Короткие проекты на уже освоенных месторождениях дают компаниям больший ресурсный потенциал, чем крупные новые проекты с длинным циклом.', 'Не следует из текста: напротив, текст допускает, что их потенциал ниже.'],
    ['Дивиденды важнее для компаний, чем для инвесторов.', 'Такого сравнения в тексте нет.']]);
  PA('ru', 'infer', 'Правило сокращения бурения', 'Если в течение года цена нефти опускается ниже 50 долларов за баррель, компания «Каменный Пояс» в том же году сокращает программу бурения. В 2025 году программа бурения не сокращалась. Кроме того, компания выплачивает специальный дивиденд только в те годы, когда свободный денежный поток превышает 1 млрд долларов.', [
    ['В 2025 году цена нефти не опускалась ниже 50 долларов за баррель.', 'Следует обязательно: если бы цена упала ниже 50, программу бы сократили, а этого не было.'],
    ['В 2025 году компания выплатила специальный дивиденд.', 'Не следует: о денежном потоке за 2025 год ничего не сказано.'],
    ['Если цена выше 50 долларов, компания увеличивает программу бурения.', 'Не следует: правило описывает только то, что происходит при цене ниже 50 долларов; об увеличении программы в тексте ничего нет.'],
    ['Свободный денежный поток компании в 2025 году превысил 1 млрд долларов.', 'Не следует: данных о денежном потоке нет.'],
    ['При цене 45 долларов компания отменит специальный дивиденд.', 'Не следует: дивиденд зависит от денежного потока, а не напрямую от цены.']]);
  PA('ru', 'contra', 'Нефтепровод «Восточный луч»', 'Проект строительства нефтепровода «Восточный луч» разделён на три очереди. Первая очередь длиной 240 км введена в эксплуатацию в 2024 году, вторая строится, а проектирование третьей ещё не завершено. Пропускная способность после ввода всех очередей составит 30 млн тонн в год, сейчас — 12 млн тонн. Финансирование второй очереди полностью обеспечено собственными средствами компании.', [
    ['Для строительства второй очереди компания привлекла банковский кредит.', 'Противоречит тексту: вторая очередь полностью финансируется собственными средствами.'],
    ['Пропускная способность нефтепровода после ввода всех очередей вырастет более чем вдвое по сравнению с первой очередью.', 'Не противоречит: рост с 12 до 30 млн тонн — в 2,5 раза.'],
    ['Протяжённость первой очереди — 240 км.', 'Совпадает с текстом.'],
    ['Строительство третьей очереди начнётся в 2027 году.', 'Не противоречит: сроки по третьей очереди не названы, данных нет.'],
    ['Общая длина нефтепровода превысит 600 км.', 'Не противоречит: длина второй и третьей очередей неизвестна.']]);
  PA('ru', 'idea', 'Цифровизация и люди', 'Цифровые решения в добыче часто не дают ожидаемого эффекта не из-за технологий, а из-за людей. Система может точно предсказать отказ насоса, но если у мастера нет полномочий остановить скважину без согласования, рекомендация так и остаётся на экране. Компании, которые одновременно с внедрением ИТ-систем меняют регламенты и распределение ответственности, получают эффект в два-три раза выше.', [
    ['Эффект от цифровых решений зависит от того, изменены ли процессы и полномочия людей.', 'Это главный тезис текста, пример и вывод его подтверждают.'],
    ['Системы предсказания отказов насосов работают неточно.', 'Противоречит тексту: система «может точно предсказать отказ».'],
    ['Мастерам нужно запретить останавливать скважины.', 'Обратное мысли текста: проблема как раз в отсутствии полномочий.'],
    ['ИТ-системы в добыче не окупаются.', 'Слишком общее утверждение, текст его не делает.'],
    ['Цифровизация сама по себе увеличивает добычу в два-три раза независимо от того, как организована работа людей.', 'Искажение: в два-три раза различается эффект у разных компаний, а не добыча; к тому же текст говорит, что эффект зависит от организации работы.']]);
  PA('ru', 'infer', 'Раскрытие отчётности', 'Все проекты, получившие государственную поддержку, публикуют отчётность о ходе реализации. Ни один из проектов компании «Лена-Газ» такую отчётность не публикует. Проект «Олёкма» компания «Лена-Газ» реализует совместно с партнёром.', [
    ['Проект «Олёкма» не получал государственной поддержки.', 'Следует обязательно: «Олёкма» — проект «Лена-Газ», он не публикует отчётность, а все проекты с господдержкой её публикуют.'],
    ['Проект «Олёкма» получил государственную поддержку.', 'Противоречит условиям.'],
    ['Партнёр «Лена-Газ» не получает господдержку ни по одному проекту.', 'Не следует: о других проектах партнёра ничего не известно.'],
    ['Проекты без господдержки никогда не публикуют отчётность.', 'Не следует: это обратное утверждение, текст его не содержит.'],
    ['«Лена-Газ» нарушает требования о раскрытии информации.', 'Не следует: о требованиях к проектам без господдержки ничего не сказано.']]);
  PA('ru', 'contra', 'Стоимость скважин', 'По данным отраслевого обзора, в 2025 году средняя стоимость строительства горизонтальной скважины в регионе выросла на 12% и составила 280 млн рублей. Основной причиной названо удорожание импортных комплектующих для многостадийного гидроразрыва пласта. При этом стоимость собственно буровых работ, по оценке авторов обзора, выросла лишь на 4%.', [
    ['Главной причиной удорожания скважин стал рост стоимости буровых работ.', 'Противоречит тексту: главная причина — импортные комплектующие для гидроразрыва.'],
    ['В 2024 году средняя скважина стоила около 250 млн рублей.', 'Не противоречит: 280 ÷ 1,12 = 250.'],
    ['Стоимость буровых работ за год росла заметно медленнее, чем общая стоимость скважины.', 'Совпадает с текстом: 4% против 12%.'],
    ['Отечественные комплектующие для гидроразрыва подешевели.', 'Не противоречит: о них нет данных.'],
    ['В соседних регионах удорожание было меньше.', 'Не противоречит: о других регионах нет данных.']]);
  PA('ru', 'assume', 'Перенос бурения', 'Руководство «Печора-Нефти» предлагает перенести бурение новых скважин с 2026 на 2027 год: к тому времени цена нефти, по его мнению, восстановится, и проект станет более доходным.', [
    ['Рост затрат на бурение к 2027 году не перекроет выигрыш от более высокой цены нефти.', 'Без этого допущения вывод рушится: если затраты вырастут сильнее, перенос не сделает проект доходнее.'],
    ['Цена нефти в 2026 году окажется выше, чем в 2027 году, поэтому бурить выгоднее как можно раньше.', 'Противоречит рассуждению руководства, которое рассчитывает на более высокую цену в 2027 году.'],
    ['Бурение в 2026 году технически невозможно.', 'Не требуется: аргумент экономический, а не технический.'],
    ['Проект убыточен при любой цене нефти.', 'Противоречит рассуждению: при более высокой цене проект должен стать доходнее.'],
    ['Конкуренты тоже перенесут бурение.', 'Не относится к рассуждению.']]);
  PA('ru', 'idea', 'Регионы и инвесторы', 'Добывающие регионы долго соревновались за инвестиции налоговыми льготами. Однако опросы компаний показывают, что при выборе площадки льготы стоят лишь на четвёртом месте — после наличия инфраструктуры, доступности квалифицированного персонала и предсказуемости правил. Регион, который меняет условия каждые два года, проигрывает даже при более щедрых льготах.', [
    ['Для инвесторов инфраструктура, кадры и стабильность правил важнее налоговых льгот.', 'Главная мысль: льготы уступают трём другим факторам.'],
    ['Налоговые льготы не влияют на выбор площадки.', 'Слишком сильно: льготы на четвёртом месте, но всё же учитываются.'],
    ['Регионам следует отменить налоговые льготы.', 'Такой рекомендации в тексте нет.'],
    ['Квалифицированный персонал — главный фактор при выборе площадки.', 'Не следует: персонал назван лишь одним из трёх факторов, стоящих выше льгот; главным текст его не называет.'],

    DB.hist.slice(-15).reverse().forEach(function (x) { var d = new Date(x.d); h += '<tr><td class="num">' + d.toLocaleDateString(S.lang === 'ru' ? 'ru-RU' : 'en-GB') + ' ' + d.toLocaleTimeString(S.lang === 'ru' ? 'ru-RU' : 'en-GB', { hour: '2-digit', minute: '2-digit' }) + '</td><td>' + esc(tr(x.title)) + ' <span class="tag">' + (x.kind === 'exam' ? tr(U.tExam) : tr(U.tTrain)) + '</span></td><td class="r">' + num1(x.c) + '/' + x.n + ' · ' + pct(x.c, x.n) + '%</td><td class="r">' + (x.ms ? mmss(x.ms) : '—') + '</td></tr>'; });
    h += '</tbody></table></div></div>';
    h += S.confirmReset ? '<div class="actions"><span>' + esc(tr(U.resetQ)) + '</span><button class="btn btn-primary btn-sm" data-act="reset-yes">' + esc(tr(U.resetYes)) + '</button><button class="btn btn-ghost btn-sm" data-act="reset-no">' + esc(tr(U.no)) + '</button></div>' : '<button class="btn btn-ghost btn-sm" data-act="reset">' + esc(tr(U.reset)) + '</button>';
    return h;
  }
  var GSECS = [['formats', T('Форматы тестов', 'Test formats')], ['ind', T('Абстрактный', 'Abstract')], ['num', T('Числовой', 'Numerical')], ['ded', T('Дедуктивный', 'Deductive')], ['verb', T('Вербальный', 'Verbal')], ['time', T('Время и день теста', 'Timing and test day')]];

  var GUIDE = {
    ind: {
      intro: T('Задача — найти скрытые правила. В реальных тестах обычно действуют два-три правила одновременно, и каждое относится к своему элементу фигуры.', 'The task is to find hidden rules. Real tests usually apply two or three rules at once, each to a different element of the figure.'),
      blocks: [
        ['Алгоритм на один вопрос (60–75 секунд)', 'Routine for one item (60–75 seconds)', [
          ['За 10 секунд пробегите взглядом весь ряд и отметьте, какие элементы вообще меняются.', 'In 10 seconds scan the whole series and note which elements change at all.'],
          ['Возьмите один элемент и проследите его по всем фигурам. Не сравнивайте фигуры целиком.', 'Take one element and follow it through every figure. Do not compare whole figures.'],
          ['Найдя первое правило, сразу вычеркните варианты, которые его нарушают. Обычно остаётся два-три.', 'Once you find the first rule, cross out every option that breaks it. Usually two or three remain.'],
          ['Второе правило ищите только среди оставшихся вариантов — так быстрее.', 'Look for the second rule only among the remaining options — it is faster.'],
          ['Если осталось два варианта, найдите элемент, которым они различаются, и проверьте только его.', 'If two options remain, find the element where they differ and check just that.']
        ], true],
        ['Чек-лист ФЦПКП: что может меняться', 'Checklist SCPNR: what can change', [
          ['<b>Форма</b> — тип фигуры, число сторон (+1, −1, по циклу).', '<b>Shape</b> — figure type, number of sides (+1, −1, in a cycle).'],
          ['<b>Цвет и заливка</b> — белая, серая, чёрная, штриховка; чередование через один или цикл из трёх.', '<b>Colour and fill</b> — white, grey, black, hatching; alternating or a three-step cycle.'],
          ['<b>Положение</b> — сдвиг по кругу или сетке, по или против часовой стрелки, на 1, 2 или 3 позиции.', '<b>Position</b> — moves around a ring or grid, clockwise or anticlockwise, by 1, 2 or 3 places.'],
          ['<b>Количество</b> — элементов, точек, линий: прибавляется, убывает или повторяется по циклу.', '<b>Number</b> — of elements, dots, lines: rising, falling or cycling.'],
          ['<b>Поворот</b> — на 45°, 90° или 180°; иногда шаг растёт: 45°, 90°, 135°…', '<b>Rotation</b> — by 45°, 90° or 180°; sometimes the step grows: 45°, 90°, 135°…']
        ]],
        ['Как решать по форматам', 'How to solve each format', [
          ['<b>Ряды.</b> Следите за одним элементом от фигуры к фигуре и запишите, как он меняется: «+90°», «белый → серый → чёрный». Предскажите следующую фигуру и только потом смотрите на варианты.', '<b>Series.</b> Follow one element from figure to figure and write down how it changes: “+90°”, “white → grey → black”. Predict the next figure before you look at the options.'],
          ['<b>Матрицы.</b> Начните с полной строки или столбца. Проверьте оба направления: правило может идти по строкам, по столбцам или быть «латинским квадратом» — каждое значение один раз в строке и в столбце. Тогда в пустую клетку попадает то значение, которого в её строке ещё нет.', '<b>Matrices.</b> Start from a complete row or column. Check both directions: the rule may run along rows, along columns, or be a “Latin square” — each value once in every row and column. Then the empty cell takes the value its row is still missing.'],
          ['<b>Лишняя фигура.</b> Ищите связь элементов внутри каждой фигуры (точек столько же, сколько сторон; стрелка смотрит на кружок). Фигура, которая сильнее всего выделяется на вид, чаще ловушка, чем ответ.', '<b>Odd one out.</b> Look for a link between elements inside each figure (as many dots as sides; the arrow points at the circle). The figure that looks most different is more often a trap than the answer.'],
          ['<b>Движение по сетке.</b> Разберите каждый элемент отдельно: запишите номер его клетки на каждом шаге — так сразу видно маршрут, шаг и переход через край сетки. Если один элемент прыгает без системы, а остальные объяснены, это шум.', '<b>Grid movement.</b> Take each element separately: write down its cell number at every step — the path, the step size and how it wraps past the edge become obvious. If one element jumps around with no pattern and the rest are explained, it is noise.'],
          ['<b>Повороты в матрице (Korn Ferry).</b> Выберите несимметричную деталь — короткий выступ буквы L или флажок — и следите за ней: так виден угол и направление поворота. Проверка на зеркало: мысленно поверните вариант так, чтобы длинная часть легла как у соседней фигуры. Если выступ оказался с другой стороны, это отражение, а не поворот.', '<b>Rotation matrices (Korn Ferry).</b> Pick an asymmetric detail — the short foot of an L or the flag — and follow it: it shows the angle and direction of rotation. Mirror check: mentally turn the option so its long part lies like the neighbouring figure. If the foot ends up on the other side, it is a reflection, not a rotation.'],
          ['<b>Стрелки.</b> Клетка состоит из нескольких позиций (левая, средняя, правая стрелка), и у каждой своё правило: одна поворачивается от столбца к столбцу, другая одинакова во всей строке, третья принимает каждое направление один раз в строке и в столбце. Решайте позицию за позицией.', '<b>Arrows.</b> A cell has several positions (left, middle, right arrow), each with its own rule: one rotates from column to column, another stays the same across the row, a third takes each direction once per row and column. Solve one position at a time.'],
          ['<b>Наложение.</b> Третья фигура получается из первых двух одним из четырёх способов: всё вместе, только общее, только различающееся, «первое минус второе». Хватает двух проверок. Линия есть в обеих фигурах — она остаётся при «всё вместе» и «только общее». Линия есть только во второй — она остаётся при «всё вместе» и «только различающееся».', '<b>Overlay.</b> The third figure is made from the first two in one of four ways: everything, common lines only, differing lines only, or “first minus second”. Two checks are enough. A line in both figures stays under “everything” and “common only”. A line only in the second figure stays under “everything” and “differing only”.'],
          ['<b>Счёт элементов.</b> Считайте каждый вид элементов отдельно (линии, точки), не обращая внимания на их расположение. Подпишите числа под фигурами и посмотрите на разности: +1; цикл +2, −1; −1.', '<b>Counting.</b> Count each kind of element separately (lines, dots) and ignore where they sit. Write the numbers under the figures and look at the differences: +1; a +2, −1 cycle; −1.'],
          ['<b>Коды и цепочки (SHL Interactive).</b> Разбейте код на позиции и найдите правило для каждой: буква сдвигается по алфавиту, цифра растёт или убывает, последний символ чередуется, знаки меняются местами. Опорные номера латинских букв: E = 5, J = 10, O = 15, T = 20, Y = 25.', '<b>Codes and chains (SHL Interactive).</b> Split the code into positions and find a rule for each: a letter steps through the alphabet, a digit rises or falls, the last symbol alternates, characters swap places. Anchor letters: E = 5, J = 10, O = 15, T = 20, Y = 25.']
        ]],
        ['Матрицы Равена (KFALP)', 'Raven’s matrices (KFALP)', [
          ['В матрицах Равена встречается всего несколько типов правил: признак одинаков в строке; признак меняется с постоянным шагом (поворот, число элементов); три значения распределены по одному разу в каждой строке и столбце; третья фигура — сумма или разность первых двух; совпадающие элементы исчезают.', 'Raven’s matrices use only a handful of rule types: an attribute stays the same along a row; it changes by a constant step (rotation, number of elements); three values are spread once per row and column; the third figure is the sum or difference of the first two; matching elements cancel out.'],
          ['Разберите клетку на признаки и решайте каждый отдельно. Сначала составьте ответ мысленно, потом ищите его среди вариантов: из восьми вариантов большинство отличается от верного одной деталью или повторяет соседнюю клетку.', 'Break the cell into attributes and solve each separately. Build the answer in your head first, then look for it: most of the eight options differ from it by one detail or copy a neighbouring cell.'],
          ['Если признак «скачет» без порядка по строкам, проверьте столбцы и диагонали — правило «по одному разу в строке и столбце» часто выглядит как хаос.', 'If an attribute seems to jump around along the rows, check the columns and diagonals — the “once per row and column” rule often looks like chaos.'],
          ['Недостающий фрагмент: смотрите, где каждая линия входит в вырез и где выходит. Зеркальный, повёрнутый или сдвинутый кусок выдаёт себя на одном из краёв.', 'Missing piece: look at where each line enters and leaves the gap. A mirrored, turned or shifted piece gives itself away at one edge.'],
          ['Сложность растёт к концу, а время общее (около 40 минут): первые задания решайте быстро, чтобы оставить запас на последние. Пустой ответ обычно хуже предположения.', 'Items get harder towards the end and the time is shared (about 40 minutes): move quickly through the early ones to save time for the last. A blank is usually worse than a guess.']
        ]],
        ['Типовые правила, которые стоит знать', 'Common rules worth knowing', [
          ['Чередование и цикл: «белый — чёрный» (период 2), «белый — серый — чёрный» (период 3). Чтобы найти период, посчитайте, через сколько шагов признак повторяется.', 'Alternation and cycles: white–black (period 2), white–grey–black (period 3). To find the period, count how many steps it takes for the feature to repeat.'],
          ['Растущий шаг: сдвиг на 1, 2, 3… позиции. Если движение кажется неровным, выпишите разности между соседними положениями.', 'Growing step: moves of 1, 2, 3… places. If the motion looks irregular, write down the differences between neighbouring positions.'],
          ['Движение по кругу из 8 позиций: одна позиция = 45°. Сдвиг на 4 = противоположная сторона.', 'Movement around 8 positions: one position = 45°. A move of 4 = the opposite side.'],
          ['Связь внутри фигуры: число точек равно числу сторон, стрелка указывает на кружок, цвета противоположны.', 'A link inside each figure: dots equal sides, the arrow points at the circle, colours are opposite.'],
          ['Матрицы: правило идёт по строкам, по столбцам или «каждое значение один раз в каждой строке и каждом столбце».', 'Matrices: the rule runs along rows, along columns, or “each value once in every row and column”.'],
          ['Ещё типовые правила: сумма или чётность элементов, симметрия, число углов или пересечений, наложение, при котором остаются только общие элементы.', 'More common rules: the sum or parity of elements, symmetry, the number of corners or intersections, and overlays where only common elements remain.']
        ]],
        ['Лайфхаки', 'Tips', [
          ['Сначала предскажите ответ, потом смотрите на варианты. Сравните варианты между собой: признаки, которыми они различаются, подсказывают, какие правила нужно проверить.', 'Predict the answer before looking at the options. Then compare the options: the features in which they differ show which rules you need to check.'],
          ['В SHL Interactive ответ часто нужно собрать самому — перетащить элементы или линию. Отсеять варианты не получится, поэтому найдите все правила до конца.', 'In SHL Interactive you often build the answer yourself by dragging elements or a line. You cannot eliminate options, so pin down every rule.'],
          ['Проговаривайте правило коротко: «стрелка +90°, кружок −1». Так варианты проверяются за секунды.', 'Say the rule briefly: “arrow +90°, circle −1”. Options can then be checked in seconds.'],
          ['Не ищите одно сложное правило — почти всегда это несколько простых.', 'Do not look for one complex rule — it is almost always several simple ones.'],
          ['Если признак меняется хаотично, это шум. Сосредоточьтесь на остальных элементах.', 'If a feature changes at random, it is noise. Focus on the other elements.'],
          ['Сравните первую и последнюю фигуры: это быстро показывает направление поворота и общий счёт.', 'Compare the first and last figures: it quickly shows the direction of rotation and the overall count.'],
          ['В матрице начните с самой полной строки или столбца и выведите правило из них.', 'In a matrix start from the most complete row or column and derive the rule from it.'],
          ['В «лишней фигуре» ищите связь элементов внутри каждой фигуры. Самая заметная по цвету фигура часто ловушка.', 'For the odd one out, look for a link between elements inside each figure. The one that stands out by colour is often the trap.'],
          ['Не тратьте больше 90 секунд на вопрос: выберите лучший вариант и двигайтесь дальше.', 'Do not spend more than 90 seconds on one item: pick the best option and move on.']
        ]]
      ]
